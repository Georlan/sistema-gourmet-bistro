name = "koma-availability-worker"
main = "src/index.mjs"
compatibility_date = "2026-11-01"

[triggers]
crons = ["*/5 * * * *"]

[vars]
KOMA_FRONTEND_URL = "https://app.komafood.com.br"
KOMA_CENTRAL_URL = "https://central.komafood.com.br"
KOMA_API_URL = "https://sistema-gourmet-bistro-production.up.railway.app"
ALERT_COOLDOWN_MS = "1800000"

# Opcional (persistência de estado UP/DEGRADED/DOWN entre invocações no free tier):
# [[kv_namespaces]]
# binding = "MONITOR_STATE"
# id = "<PREENCHER_COM_KV_NAMESPACE_ID>"
