name: Build Kôma Desktop Windows (PyInstaller + Tauri)

on:
  push:
    branches:
      - feat/desktop-windows-architecture
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywin32 -r print-agent/requirements.txt

      - name: Build Kôma Hardware Print Agent EXE
        run: |
          pyinstaller --onefile --noconsole --distpath build/hardware --name KomaHardwareService print-agent/main.py

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Tauri Desktop Installer (KomaSetup)
        run: npm run desktop:build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KomaDesktop-Windows-Build
          path: |
            dist/
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            build/hardware/KomaHardwareService.exe
