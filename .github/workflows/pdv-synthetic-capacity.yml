name: PDV Synthetic Capacity (isolated)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/caixa/pdv/**'
      - 'e2e/cashier-pdv-product-card.spec.ts'
      - 'backend/tests/test_capacity_scale_stages.py'
      - '.github/workflows/pdv-synthetic-capacity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-capacity:
    name: 10 synthetic tenants - 40 orders - bounded concurrent test
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      PYTHONPATH: backend
      DATABASE_URL: sqlite:///${{ runner.temp }}/pdv-synthetic-capacity.db
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Generate disposable test-only secrets
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import secrets
          from cryptography.fernet import Fernet
          print("SECRET_KEY=" + secrets.token_hex(32))
          print("ENCRYPTION_KEY=" + Fernet.generate_key().decode())
          PY
      - name: Verify isolation and exercise concurrent synthetic orders
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          url = urlparse(os.environ["DATABASE_URL"])
          assert url.scheme == "sqlite" and "pdv-synthetic-capacity.db" in url.path
          assert "production" not in url.path
          print("Database: isolated CI SQLite fixture; no production writes")
          PY
          python -m pytest -q -s backend/tests/test_capacity_scale_stages.py::test_capacity_stage_1_ten_tenants
