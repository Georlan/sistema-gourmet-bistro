name: PDV Product Card Browser Targeted

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/caixa/pdv/**'
      - 'src/index.css'
      - 'e2e/cashier-pdv-product-card.spec.ts'
      - 'e2e/cashier-sale-recovery.spec.ts'
      - 'e2e/cashier-delivery-new-order.spec.ts'
      - 'tests/cashierPdvCartLine.test.ts'
      - 'tests/cashierPdvProductCard.test.ts'
      - 'backend/tests/test_capacity_scale_stages.py'
      - '.github/workflows/pdv-product-card-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: PDV cart and checkout on mobile + desktop
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Confirm cart, checkout, recovery and delivery with fixtures
        run: >-
          KOMA_E2E_PORT=4283 npm run test:e2e --
          e2e/cashier-pdv-product-card.spec.ts
          e2e/cashier-sale-recovery.spec.ts
          e2e/cashier-delivery-new-order.spec.ts
          --project=mobile-390
          --project=desktop-1366
          --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pdv-product-card-regression
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3

  synthetic-capacity:
    name: 10 synthetic tenants and 40 orders (isolated only)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      PYTHONPATH: backend
      DATABASE_URL: sqlite:////tmp/pdv-synthetic-capacity.db
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Generate disposable test-only secrets
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import secrets
          from cryptography.fernet import Fernet
          print("SECRET_KEY=" + secrets.token_hex(32))
          print("ENCRYPTION_KEY=" + Fernet.generate_key().decode())
          PY
      - name: Verify isolated SQLite and simulate concurrent orders
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          url = urlparse(os.environ["DATABASE_URL"])
          assert url.scheme == "sqlite" and "pdv-synthetic-capacity.db" in url.path
          assert "production" not in url.path
          print("CI-only synthetic tenants; no production requests")
          PY
          python -m pytest -q -s backend/tests/test_capacity_scale_stages.py::test_capacity_stage_1_ten_tenants
