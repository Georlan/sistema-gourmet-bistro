name: Digital Order Runtime Targeted

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/digital-order-runtime-targeted.yml'
      - 'backend/app/routes/order_tracking.py'
      - 'backend/app/services/web_push.py'
      - 'backend/app/online_order_control_models.py'
      - 'backend/app/services/online_order_control.py'
      - 'backend/app/routes/online_order_control.py'
      - 'backend/app/adapters/orders/web_adapter.py'
      - 'backend/app/services/online_payments/service.py'
      - 'backend/app/services/scheduled_orders.py'
      - 'backend/app/services/atendimentos.py'
      - 'backend/app/operational_models.py'
      - 'backend/alembic/versions/m2b3c4d5e6f7_auto_accept_and_fulfillment_conversion.py'
      - 'backend/tests/test_order_tracking_sse_db_lifetime.py'
      - 'backend/tests/test_web_push_unit.py'
      - 'backend/tests/test_online_order_operational_safety.py'
      - 'backend/tests/test_atendimento_identity.py'
      - 'src/cardapio/**'
      - 'src/components/CaixaPanel.tsx'
      - 'src/components/caixa/orders/CaixaOrdersWorkspace.tsx'
      - 'src/components/caixa/orders/useOnlineOrderAutoAcceptPolicy.ts'
      - 'tests/automatic_order_acceptance.test.ts'
      - 'tests/orderStateContract.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Digital order backend regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      SECRET_KEY: digital-order-runtime-targeted-secret
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      DATABASE_URL: sqlite:///./digital-order-runtime-targeted.db
      MIGRATION_DATABASE_URL: sqlite:///./digital-order-runtime-targeted.db
      KOMA_PUBLIC_API_URL: https://api.example.test
      KOMA_PUBLIC_APP_URL: https://app.example.test
      MERCADO_PAGO_CLIENT_ID: app-ci
      MERCADO_PAGO_CLIENT_SECRET: secret-ci
      MERCADO_PAGO_WEBHOOK_SECRET: webhook-ci
      MERCADO_PAGO_OAUTH_REDIRECT_URI: https://api.example.test/payments/mercado-pago/oauth/callback

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Validate migration head and syntax
        run: |
          cd backend
          test "$(python -m alembic -c alembic.ini heads | grep -c '(head)')" -eq 1
          cd ..
          python -m compileall -q backend/app
      - name: Run targeted backend regressions
        run: >-
          python -m pytest -q -x
          backend/tests/test_order_tracking_sse_db_lifetime.py
          backend/tests/test_web_push_unit.py
          backend/tests/test_online_order_operational_safety.py
          backend/tests/test_atendimento_identity.py

  frontend:
    name: Digital order frontend regressions
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --import tsx --test tests/automatic_order_acceptance.test.ts tests/orderStateContract.test.ts
      - run: npm run build
