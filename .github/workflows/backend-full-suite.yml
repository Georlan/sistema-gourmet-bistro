name: Backend Full Suite

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

concurrency:
  group: backend-full-suite-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  schedule-gate:
    name: Check recent main activity
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.activity.outputs.run }}
    steps:
      - name: Checkout main head
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Check for commits in last 26h
        id: activity
        run: |
          if [ -n "$(git log -1 --since='26 hours ago' --format=%H)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new commits on main in the last 26 hours; skipping full backend suite."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  full-backend:
    name: Full backend pytest
    needs: [schedule-gate]
    if: always() && !cancelled() && (needs.schedule-gate.result == 'skipped' || (needs.schedule-gate.result == 'success' && needs.schedule-gate.outputs.run == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'

      - name: Cache Python virtualenv
        id: py_venv_cache
        uses: actions/cache@v4
        with:
          path: /tmp/koma-ci-venv
          key: py-venv-${{ runner.os }}-py3.13.15-${{ hashFiles('backend/constraints.txt', 'backend/requirements.txt', 'backend/requirements-dev.txt') }}

      - name: Prepare Python virtualenv
        run: |
          if [ "${{ steps.py_venv_cache.outputs.cache-hit }}" != "true" ] || ! /tmp/koma-ci-venv/bin/python -c "import pytest, alembic, fastapi, xdist" >/dev/null 2>&1; then
            rm -rf /tmp/koma-ci-venv
            python -m venv /tmp/koma-ci-venv
            /tmp/koma-ci-venv/bin/python -m pip install --no-cache-dir -r backend/requirements-dev.txt
          fi
          echo "/tmp/koma-ci-venv/bin" >> "$GITHUB_PATH"

      - name: Run complete backend suite
        env:
          ENVIRONMENT: test
          SECRET_KEY: backend-full-suite-test-only-secret-key
          ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          PYTHONPATH: backend
        run: |
          python -m pytest backend/tests --ignore=backend/tests/test_capacity_scale_stages.py -n auto --dist loadfile -q -ra --durations=15
          python -m pytest backend/tests/test_capacity_scale_stages.py -q -ra
