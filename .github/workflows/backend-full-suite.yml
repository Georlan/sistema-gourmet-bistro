name: Backend Full Suite

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/tests/**'
  workflow_dispatch:

concurrency:
  group: backend-full-suite-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-backend:
    name: Full backend pytest
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run complete backend suite
        env:
          ENVIRONMENT: test
          SECRET_KEY: backend-full-suite-test-only-secret
          ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q -ra
