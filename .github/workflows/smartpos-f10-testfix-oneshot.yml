name: SmartPOS F10 test fix one shot

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/smartpos-f10-manual-settlement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/smartpos-f10-manual-settlement
      - name: Fix assertions
        shell: python
        run: |
          from pathlib import Path
          p = Path('backend/tests/test_smartpos_payment_intent_preview.py')
          text = p.read_text(encoding='utf-8')
          wrong = '''        pagamentos = db.query(Pagamento).filter(Pagamento.restaurante_id == RESTAURANTE_ID).all()\n        assert len(pagamentos) == 1\n        assert pagamentos[0].metodo == "cartao_debito"\n        assert Decimal(str(pagamentos[0].valor)) == Decimal("10")\n        comanda = db.query(Comanda).filter(Comanda.id == "cmd-smartpos-intent").one()\n        assert Decimal(str(comanda.valor_pago)) == Decimal("10")\n        assert comanda.fechada is False\n'''
          original = '''        assert db.query(Pagamento).filter(Pagamento.restaurante_id == RESTAURANTE_ID).count() == 0\n        comanda = db.query(Comanda).filter(Comanda.id == "cmd-smartpos-intent").one()\n        assert Decimal(str(comanda.valor_pago)) == Decimal("0")\n        assert comanda.fechada is False\n'''
          if wrong in text:
              text = text.replace(wrong, original, 1)

          old_confirm = '''        assert db.query(Pagamento).filter(Pagamento.restaurante_id == RESTAURANTE_ID).count() == 0\n        comanda = db.query(Comanda).filter(Comanda.id == "cmd-smartpos-intent").one()\n        assert Decimal(str(comanda.valor_pago)) == Decimal("0")\n        assert comanda.fechada is False\n    finally:\n        db.close()\n        current_restaurante_id.reset(token)\n\n\ndef test_dinheiro_confirma_troco_e_fecha_mesa_sem_inflar_receita():\n'''
          new_confirm = '''        pagamentos = db.query(Pagamento).filter(Pagamento.restaurante_id == RESTAURANTE_ID).all()\n        assert len(pagamentos) == 1\n        assert pagamentos[0].metodo == "cartao_debito"\n        assert Decimal(str(pagamentos[0].valor)) == Decimal("10")\n        comanda = db.query(Comanda).filter(Comanda.id == "cmd-smartpos-intent").one()\n        assert Decimal(str(comanda.valor_pago)) == Decimal("10")\n        assert comanda.fechada is False\n    finally:\n        db.close()\n        current_restaurante_id.reset(token)\n\n\ndef test_dinheiro_confirma_troco_e_fecha_mesa_sem_inflar_receita():\n'''
          if old_confirm in text:
              text = text.replace(old_confirm, new_confirm, 1)
          elif new_confirm not in text:
              raise RuntimeError('manual settlement assertion anchor not found')
          p.write_text(text, encoding='utf-8')
      - run: git diff --check
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/test_smartpos_payment_intent_preview.py
          git commit -m "test(smartpos): assert manual settlement effects"
          git push origin HEAD:feat/smartpos-f10-manual-settlement
