name: Onboarding Readiness Targeted

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/onboarding-readiness-targeted.yml'
      - 'backend/alembic/versions/m2b3c4d5e6f7_add_onboarding_order_capabilities.py'
      - 'backend/app/models.py'
      - 'backend/app/routes/caixa.py'
      - 'backend/app/routes/onboarding.py'
      - 'backend/app/routes/saas_billing.py'
      - 'backend/app/routes/signups.py'
      - 'backend/app/schemas.py'
      - 'backend/app/services/onboarding_trial.py'
      - 'backend/app/services/signup_notifications.py'
      - 'backend/tests/test_onboarding_status.py'
      - 'backend/tests/test_signup_automation.py'
      - 'backend/tests/test_signup_notification_copy.py'
      - 'src/components/assinatura/SubscriptionControl.tsx'
      - 'src/components/onboarding/FirstAccessOnboarding.tsx'
      - 'src/components/onboarding/useOnboardingAccessGate.ts'
      - 'src/config/subscriptionPaymentOptions.ts'
      - 'src/legal/PlanContractPageV2.tsx'
      - 'tests/firstAccessOnboarding.test.ts'

permissions:
  contents: read

jobs:
  policy:
    name: Onboarding policy regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      SECRET_KEY: onboarding-readiness-targeted-secret
      ENCRYPTION_KEY: dgvrWayyUxrh0PjzBcjn1AJ5woxjUE3lLTRptHDUSEQ=
      DATABASE_URL: sqlite:///./onboarding-readiness-targeted.db
      MIGRATION_DATABASE_URL: sqlite:///./onboarding-readiness-targeted.db
      KOMA_PUBLIC_API_URL: https://api.example.test
      PYTHONPATH: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Compile onboarding modules
        run: |
          python -m py_compile backend/app/routes/onboarding.py
          python -m py_compile backend/app/services/onboarding_trial.py
          python -m py_compile backend/alembic/versions/m2b3c4d5e6f7_add_onboarding_order_capabilities.py
          python -m py_compile backend/tests/test_onboarding_status.py

      - name: Run onboarding policy regressions
        run: |
          python -m pytest -q -x             backend/tests/test_onboarding_status.py             backend/tests/test_signup_notification_copy.py             backend/tests/test_signup_automation.py::test_superadmin_release_preserves_trial_until_onboarding_is_complete

  postgres-migration:
    name: PostgreSQL onboarding migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: onboarding
          POSTGRES_PASSWORD: onboarding
          POSTGRES_DB: onboarding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onboarding"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: onboarding-readiness-postgres-secret
      ENCRYPTION_KEY: dgvrWayyUxrh0PjzBcjn1AJ5woxjUE3lLTRptHDUSEQ=
      DATABASE_URL: postgresql://onboarding:onboarding@127.0.0.1:5432/onboarding_test
      MIGRATION_DATABASE_URL: postgresql://onboarding:onboarding@127.0.0.1:5432/onboarding_test
      KOMA_PUBLIC_API_URL: https://api.example.test
      PYTHONPATH: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Validate single Alembic head and migrate PostgreSQL
        working-directory: backend
        run: |
          test "$(python -m alembic heads | wc -l)" -eq 1
          python -m alembic upgrade head
