name: Onboarding Canonical Readiness Targeted

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/onboarding-readiness-targeted.yml'
      - 'backend/alembic/versions/n3c4d5e6f7a8_add_canonical_order_modes_and_onboarding_test.py'
      - 'backend/app/application/orders/service.py'
      - 'backend/app/adapters/orders/pos_adapter.py'
      - 'backend/app/models.py'
      - 'backend/app/routes/cardapio_digital.py'
      - 'backend/app/routes/caixa.py'
      - 'backend/app/routes/onboarding.py'
      - 'backend/app/schemas.py'
      - 'backend/app/services/onboarding_readiness.py'
      - 'backend/app/services/onboarding_trial.py'
      - 'backend/app/services/online_order_policy.py'
      - 'backend/app/services/operational_modes.py'
      - 'backend/tests/test_onboarding_status.py'
      - 'src/cardapio/CardapioPage.tsx'
      - 'src/cardapio/CardapioTypes.ts'
      - 'src/cardapio/components/CardapioCartDrawer.tsx'
      - 'src/components/caixa/pdv/useCashierPdv.ts'
      - 'src/components/onboarding/FirstAccessOnboarding.tsx'
      - 'src/components/onboarding/OnboardingOperationalBoundary.tsx'
      - 'src/components/onboarding/useOnboardingAccessGate.ts'
      - 'tests/firstAccessOnboarding.test.ts'

permissions:
  contents: read

jobs:
  backend-policy:
    name: Onboarding backend policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      SECRET_KEY: onboarding-canonical-readiness-ci-only
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      DATABASE_URL: sqlite:///./onboarding-readiness-targeted.db
      MIGRATION_DATABASE_URL: sqlite:///./onboarding-readiness-targeted.db
      KOMA_PUBLIC_API_URL: https://api.example.test
      PYTHONPATH: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Compile onboarding modules
        run: |
          python -m py_compile backend/app/routes/onboarding.py
          python -m py_compile backend/app/services/onboarding_readiness.py
          python -m py_compile backend/app/services/operational_modes.py
          python -m py_compile backend/app/services/online_order_policy.py
          python -m py_compile backend/app/application/orders/service.py
          python -m py_compile backend/app/adapters/orders/pos_adapter.py
          python -m py_compile backend/alembic/versions/n3c4d5e6f7a8_add_canonical_order_modes_and_onboarding_test.py
          python -m py_compile backend/tests/test_onboarding_status.py

      - name: Run onboarding regressions
        run: >-
          python -m pytest
          backend/tests/test_onboarding_status.py
          backend/tests/test_signup_automation.py::test_superadmin_release_preserves_trial_until_onboarding_is_complete
          -q -ra -x

  frontend-policy:
    name: Onboarding frontend policy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Focused onboarding test
        run: node --import tsx --test tests/firstAccessOnboarding.test.ts

      - name: Production build
        run: npm run build

  postgres-migration:
    name: PostgreSQL onboarding migration
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: onboarding
          POSTGRES_PASSWORD: onboarding
          POSTGRES_DB: onboarding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onboarding"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: onboarding-canonical-postgres-ci-only
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      DATABASE_URL: postgresql://onboarding:onboarding@127.0.0.1:5432/onboarding_test
      MIGRATION_DATABASE_URL: postgresql://onboarding:onboarding@127.0.0.1:5432/onboarding_test
      KOMA_PUBLIC_API_URL: https://api.example.test
      PYTHONPATH: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Validate one coherent Alembic head
        working-directory: backend
        run: |
          heads="$(python -m alembic -c alembic.ini heads)"
          printf '%s\n' "$heads"
          test "$(printf '%s\n' "$heads" | grep -c '(head)')" -eq 1
          python -m alembic -c alembic.ini history

      - name: Prove clean database upgrade and relevant downgrade
        working-directory: backend
        run: |
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini downgrade l1a2b3c4d5e6
          python -m alembic -c alembic.ini upgrade head

      - name: Reset disposable schema
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          import os
          engine = create_engine(os.environ["MIGRATION_DATABASE_URL"])
          with engine.begin() as connection:
              connection.execute(text("DROP SCHEMA public CASCADE"))
              connection.execute(text("CREATE SCHEMA public"))
          engine.dispose()
          PY

      - name: Prove previous-main database advances to new head
        working-directory: backend
        run: |
          python -m alembic -c alembic.ini upgrade l1a2b3c4d5e6
          python -m alembic -c alembic.ini upgrade head
