name: Onboarding Canonical Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/onboarding-readiness-targeted.yml'
      - 'backend/alembic/versions/n3c4d5e6f7a8_add_canonical_modes_and_onboarding_test.py'
      - 'backend/app/models.py'
      - 'backend/app/schemas.py'
      - 'backend/app/application/orders/commands.py'
      - 'backend/app/application/orders/service.py'
      - 'backend/app/adapters/orders/pos_adapter.py'
      - 'backend/app/adapters/orders/web_adapter.py'
      - 'backend/app/routes/onboarding.py'
      - 'backend/app/services/onboarding_readiness.py'
      - 'backend/app/services/operational_modes.py'
      - 'backend/tests/test_onboarding_status.py'
      - 'src/components/onboarding/FirstAccessOnboarding.tsx'
      - 'src/components/onboarding/useOnboardingAccessGate.ts'
      - 'src/components/caixa/pdv/useCashierPdv.ts'
      - 'tests/firstAccessOnboarding.test.ts'

permissions:
  contents: read

jobs:
  policy:
    name: Onboarding policy regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      SECRET_KEY: onboarding-readiness-targeted-secret
      ENCRYPTION_KEY: dgvrWayyUxrh0PjzBcjn1AJ5woxjUE3lLTRptHDUSEQ=
      DATABASE_URL: sqlite:///./onboarding-readiness-targeted.db
      MIGRATION_DATABASE_URL: sqlite:///./onboarding-readiness-targeted.db
      KOMA_PUBLIC_API_URL: https://api.example.test
      PYTHONPATH: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Compile onboarding modules
        run: |
          python -m py_compile backend/app/routes/onboarding.py
          python -m py_compile backend/app/services/onboarding_readiness.py
          python -m py_compile backend/app/services/operational_modes.py
          python -m py_compile backend/app/adapters/orders/pos_adapter.py
          python -m py_compile backend/app/adapters/orders/web_adapter.py
          python -m py_compile backend/alembic/versions/n3c4d5e6f7a8_add_canonical_modes_and_onboarding_test.py

      - name: Run onboarding backend regressions
        run: python -m pytest -q -x backend/tests/test_onboarding_status.py

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run onboarding frontend contract
        run: npx tsx --test tests/firstAccessOnboarding.test.ts

  postgres-migration:
    name: PostgreSQL migration lineage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: onboarding
          POSTGRES_PASSWORD: onboarding
          POSTGRES_DB: onboarding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onboarding"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: onboarding-readiness-postgres-secret
      ENCRYPTION_KEY: dgvrWayyUxrh0PjzBcjn1AJ5woxjUE3lLTRptHDUSEQ=
      DATABASE_URL: postgresql://onboarding:onboarding@127.0.0.1:5432/onboarding_test
      MIGRATION_DATABASE_URL: postgresql://onboarding:onboarding@127.0.0.1:5432/onboarding_test
      KOMA_PUBLIC_API_URL: https://api.example.test
      PYTHONPATH: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Validate one head and full clean upgrade
        working-directory: backend
        run: |
          test "$(python -m alembic heads | grep -c '(head)')" -eq 1
          python -m alembic history
          python -m alembic upgrade head
          python -m alembic current

      - name: Prove relevant downgrade and re-upgrade
        working-directory: backend
        run: |
          python -m alembic downgrade l1a2b3c4d5e6
          python -m alembic current | grep l1a2b3c4d5e6
          python -m alembic upgrade head
          python -m alembic current | grep n3c4d5e6f7a8
