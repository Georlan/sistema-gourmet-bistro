name: Hotfix orders kanban one-shot

on:
  push:
    branches:
      - fix/orders-kanban-closing-column
    paths:
      - .github/workflows/hotfix-orders-kanban-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/orders-kanban-closing-column
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact desktop kanban breakpoint fix
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/index.css')
          text = path.read_text(encoding='utf-8')
          old = '@container (min-width: 68rem) {'
          new = '@container (min-width: 63rem) {'
          count = text.count(old)
          assert count == 1, f'expected exactly one legacy breakpoint, found {count}'
          assert new not in text, 'desktop breakpoint already present unexpectedly'
          text = text.replace(old, new, 1)
          assert old not in text
          assert new in text
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Run isolated Kanban layout regression
        run: |
          python3 <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('backend/tests/test_ui_theme_csp_stage4.py')
          spec = importlib.util.spec_from_file_location('stage4_ui_tests', path)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          module.test_orders_kanban_has_no_desktop_breakpoint_gap_that_hides_closing_column()
          print('kanban breakpoint regression: PASS')
          PY

      - name: Commit verified hotfix and remove one-shot workflow
        run: |
          git config user.name "Georlan"
          git config user.email "129700145+Georlan@users.noreply.github.com"
          git rm .github/workflows/hotfix-orders-kanban-one-shot.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(ui): mantém as três colunas do kanban visíveis no desktop"
          git push origin HEAD:fix/orders-kanban-closing-column
