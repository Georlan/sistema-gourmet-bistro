name: Backend dependency health

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/requirements*.txt'
      - '.github/workflows/backend-dependency-health.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-check:
    name: Backend pip dependency check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify installed dependency compatibility
        run: python -m pip check
