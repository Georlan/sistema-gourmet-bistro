name: Dependency security health

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/requirements*.txt'
      - 'backend/requirements.lock'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend-dependency-health.yml'
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

concurrency:
  group: backend-dependency-health-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  schedule-gate:
    name: Check recent main activity
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.activity.outputs.run }}
    steps:
      - name: Checkout main head
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Check for commits in last 8 days
        id: activity
        run: |
          if [ -n "$(git log -1 --since='8 days ago' --format=%H)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new commits on main in the last 8 days; skipping weekly dependency audit."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  npm-audit:
    name: Frontend npm vulnerability check
    needs: [schedule-gate]
    if: always() && !cancelled() && (needs.schedule-gate.result == 'skipped' || (needs.schedule-gate.result == 'success' && needs.schedule-gate.outputs.run == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

  pip-check:
    name: Backend pip dependency check
    needs: [schedule-gate]
    if: always() && !cancelled() && (needs.schedule-gate.result == 'skipped' || (needs.schedule-gate.result == 'success' && needs.schedule-gate.outputs.run == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies and vulnerability auditor
        run: python -m pip install -r backend/requirements-dev.txt pip-audit==2.10.1
      - name: Verify installed dependency compatibility
        run: python -m pip check
      - name: Audit production Python dependencies
        run: pip-audit -r backend/requirements.txt
