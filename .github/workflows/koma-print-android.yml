name: KOMA Print Android

on:
  pull_request:
    paths:
      - "print-android/**"
      - ".github/workflows/koma-print-android.yml"
  push:
    branches:
      - main
    paths:
      - "print-android/**"
      - ".github/workflows/koma-print-android.yml"
  workflow_dispatch:

jobs:
  test-and-assemble:
    name: Kotlin JVM Tests & Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Run unit tests and assemble Debug APK
        run: gradle -p print-android test :app:assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: koma-print-android-debug-apk
          path: print-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
