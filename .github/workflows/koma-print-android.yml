name: KOMA Print Android

on:
  pull_request:
    branches: [main]
    paths:
      - 'print-android/**'
      - '.github/workflows/koma-print-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-assemble:
    name: Kotlin JVM Tests & Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'
      - name: Install Android SDK platform
        run: '${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"'
      - name: Test print core and build debug APK
        run: gradle -p print-android test :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v6
        with:
          name: koma-print-android-debug-apk
          path: print-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
