name: Print agent
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    name: Print transport (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r print-agent/requirements.txt "pytest>=8,<9"
      - run: python -m pytest print-agent/tests -q -ra
      - name: Parse Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem print-agent/*.ps1 | ForEach-Object {
            $parseErrors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
