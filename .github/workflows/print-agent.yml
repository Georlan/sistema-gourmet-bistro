name: Print agent
on:
  pull_request:
    paths:
      - 'print-agent/**'
      - 'backend/app/routes/print_agents.py'
      - 'backend/tests/test_print_agents.py'
      - 'backend/tests/test_print_job_terminal_invariant.py'
      - 'backend/tests/test_print_ack_concurrency_postgres.py'
      - 'INSTALAR-KOMA-WINDOWS.cmd'
      - 'ATUALIZAR-KOMA-WINDOWS.cmd'
      - 'DESINSTALAR-KOMA-WINDOWS.cmd'
      - 'VERIFICAR-KOMA-WINDOWS.cmd'
      - '.github/workflows/print-agent.yml'
      - '.github/workflows/print-agent-public-release.yml'
      - 'scripts/package_print_agent.py'
      - 'scripts/tests/test_print_agent_distribution.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    name: Print transport (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r print-agent/requirements.txt "pytest>=8,<9"
      - run: python -m pytest print-agent/tests -q -ra
      - name: Parse Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem print-agent/*.ps1 | ForEach-Object {
            $parseErrors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }

  backend-contract:
    name: Print backend contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: koma_print_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d koma_print_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt "pytest>=8,<9"
      - run: python -m pytest backend/tests/test_print_agents.py backend/tests/test_print_job_terminal_invariant.py backend/tests/test_print_ack_concurrency_postgres.py -q -ra
        env:
          PYTHONPATH: backend
          PRINT_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/koma_print_test

  distribution-bundle:
    name: Print distribution ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install "pytest>=8,<9"
      - name: Verify distribution allowlist
        run: python -m pytest scripts/tests/test_print_agent_distribution.py -q -ra
      - name: Package offline agent without backend or credentials
        run: python scripts/package_print_agent.py --output dist/KOMA-print-agent.zip
      - name: Record SHA256 for support delivery
        run: sha256sum dist/KOMA-print-agent.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KOMA-print-agent
          path: dist/KOMA-print-agent.zip
          if-no-files-found: error
          retention-days: 30
