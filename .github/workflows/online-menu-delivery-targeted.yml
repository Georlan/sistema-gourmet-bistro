name: Online Menu Delivery Targeted

on:
  pull_request:
    paths:
      - "backend/app/routes/caixa.py"
      - "backend/app/application/orders/**"
      - "backend/app/services/online_order_policy.py"
      - "backend/tests/test_delivery_config_persistence_contract.py"
      - "backend/tests/test_online_order_server_authority.py"
      - "backend/tests/test_checkout_advanced.py"
      - "src/components/caixa/navigation/cashierNavigation.ts"
      - "src/components/caixa/online-menu/**"
      - "tests/onlineMenuSectionNavigation.test.ts"
      - ".github/workflows/online-menu-delivery-targeted.yml"

permissions:
  contents: read

jobs:
  targeted-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: test
      SECRET_KEY: online-menu-targeted-ci-secret-key
      ENCRYPTION_KEY: dgvrWayyUxrh0PjzBcjn1AJ5woxjUE3lLTRptHDUSEQ=
      DATABASE_URL: sqlite:///./online-menu-targeted-ci.db
      MIGRATION_DATABASE_URL: sqlite:///./online-menu-targeted-ci.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Compile delivery configuration modules
        run: |
          python -m py_compile backend/app/routes/caixa.py
          python -m py_compile backend/app/application/orders/service.py
          python -m py_compile backend/app/services/online_order_policy.py

      - name: Run targeted delivery backend tests
        working-directory: backend
        run: |
          python -m pytest -q \
            tests/test_delivery_config_persistence_contract.py \
            tests/test_online_order_server_authority.py \
            tests/test_checkout_advanced.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run lint

      - name: Run online-menu architecture tests
        run: npx tsx --test tests/onlineMenuSectionNavigation.test.ts

      - name: Run frontend unit suite
        run: npm run test:unit

      - name: Build production frontend
        run: npm run build
