name: Online Menu Delivery Targeted

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      SECRET_KEY: online-menu-targeted-ci-secret-key
      ENCRYPTION_KEY: dgvrWayyUxrh0PjzBcjn1AJ5woxjUE3lLTRptHDUSEQ=
      DATABASE_URL: sqlite:///./online-menu-targeted-ci.db
      MIGRATION_DATABASE_URL: sqlite:///./online-menu-targeted-ci.db

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Compile delivery configuration modules
        run: |
          python -m py_compile backend/app/routes/caixa.py
          python -m py_compile backend/app/application/orders/service.py
          python -m py_compile backend/app/services/online_order_policy.py

      - name: Run targeted delivery backend tests
        working-directory: backend
        run: |
          python -m pytest -q -x \
            tests/test_delivery_config_persistence_contract.py \
            tests/test_online_order_server_authority.py \
            tests/test_checkout_advanced.py

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run online-menu architecture test
        run: npx tsx --test tests/onlineMenuSectionNavigation.test.ts
