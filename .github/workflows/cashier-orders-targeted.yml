name: Cashier Orders Targeted

on:
  pull_request:
    paths:
      - "src/components/caixa/orders/**"
      - "src/components/caixa/checkout/**"
      - "src/components/CaixaPanel.tsx"
      - "tests/automatic_order_acceptance.test.ts"
      - "tests/cashierWorkspaceComponents.test.ts"
      - "tests/cashierCheckoutAutoClose.test.ts"
      - ".github/workflows/cashier-orders-targeted.yml"

permissions:
  contents: read

jobs:
  cashier-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run cashier-focused regressions
        run: >-
          npx tsx --test
          tests/automatic_order_acceptance.test.ts
          tests/cashierWorkspaceComponents.test.ts
          tests/cashierCheckoutAutoClose.test.ts
