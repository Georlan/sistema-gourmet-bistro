name: Koma SmartPOS Android Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - 'smartpos-android/**'
      - '.github/workflows/smartpos-android-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install Android SDK platform
        run: '${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-37" "build-tools;36.0.0"'
      - name: Test bridge core and build debug APK
        run: gradle -p smartpos-android test :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: koma-smartpos-dev-apk
          path: smartpos-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
