name: Koma SmartPOS Android Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - 'smartpos-android/**'
      - '.github/workflows/smartpos-android-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Test Kotlin bridge core
        run: gradle -p smartpos-android test --no-daemon
