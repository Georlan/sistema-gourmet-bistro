name: Koma SmartPOS Android

on:
  # SmartPOS changes are validated before merge; main deploy must not wait for an Android rebuild.
  pull_request:
    branches: [main]
    paths:
      - 'smartpos-android/**'
      - '.github/workflows/smartpos-android-bridge.yml'
  workflow_dispatch:

concurrency:
  group: smartpos-android-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  bridge-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.0'
      - name: Install Android SDK platform
        run: '${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"'
      - name: Cache persistent Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: smartpos-android-debug-keystore-v1
          restore-keys: |
            smartpos-android-debug-keystore-
      - name: Ensure debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Test bridge and waiter app, then build debug APK
        run: gradle -p smartpos-android :test :app:testPhoneDebugUnitTest :app:testPagbankDebugUnitTest :app:assemblePhoneDebug :app:assemblePagbankDebug :app:assemblePhoneRelease :app:assemblePagbankRelease --no-daemon --continue
      - name: Record source revision
        if: success()
        run: git rev-parse HEAD > smartpos-android/app/build/outputs/apk/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: smartpos-test-reports
          path: |
            smartpos-android/build/test-results/
            smartpos-android/app/build/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        with:
          name: koma-garcom-smartpos-apks
          path: |
            smartpos-android/app/build/outputs/apk/**/*.apk
            smartpos-android/app/build/outputs/apk/SOURCE_COMMIT.txt
          if-no-files-found: error
