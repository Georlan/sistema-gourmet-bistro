name: Stage 3D money patch

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'audit/consistencia-financeira-etapa-3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply deterministic money-input patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/CaixaPanel.tsx')
          text = path.read_text()

          def replace_exact(old: str, new: str, expected: int = 1):
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'Expected {expected} occurrence(s), found {count}: {old[:100]!r}')
              text = text.replace(old, new)

          replace_exact(
              "import { EntradaManualModal } from './estoque/EntradaManualModal';",
              "import { EntradaManualModal } from './estoque/EntradaManualModal';\nimport MoneyInput from './MoneyInput';",
          )

          replace_exact("const [saldoInicial, setSaldoInicial] = useState('100.00');", "const [saldoInicial, setSaldoInicial] = useState<number | ''>(100);")
          replace_exact("const [paymentValor, setPaymentValor] = useState('');", "const [paymentValor, setPaymentValor] = useState<number | ''>('');")
          replace_exact("const [prodFormPreco, setProdFormPreco] = useState('');", "const [prodFormPreco, setProdFormPreco] = useState<number | ''>('');")
          replace_exact("const [pdvDeliveryTaxa, setPdvDeliveryTaxa] = useState('0.00');", "const [pdvDeliveryTaxa, setPdvDeliveryTaxa] = useState<number>(0);")

          replace_exact("parseFloat(saldoInicial)", "Number(saldoInicial || 0)")
          replace_exact("parseFloat(paymentValor)", "Number(paymentValor || 0)", expected=5)
          replace_exact("parseFloat(prodFormPreco)", "Number(prodFormPreco || 0)")
          replace_exact("parseFloat(deliveryTaxa) || 0.0", "Number(deliveryTaxa || 0)")
          replace_exact("setPdvDeliveryTaxa('0.00');", "setPdvDeliveryTaxa(0);")

          text, payment_fixed = re.subn(
              r"setPaymentValor\(([^\n;]+?)\.toFixed\(2\)\);",
              r"setPaymentValor(\1);",
              text,
          )
          if payment_fixed < 5:
              raise SystemExit(f'Expected at least 5 numeric payment setters, found {payment_fixed}')
          replace_exact(
              "setPaymentValor(\n                                    Math.max(0, total - Number(checkoutOrder.valorPago || 0)).toFixed(2)\n                                  );",
              "setPaymentValor(\n                                    Math.max(0, total - Number(checkoutOrder.valorPago || 0))\n                                  );",
          )

          text, product_price_setters = re.subn(
              r"setProdFormPreco\(([^\n;]+?)\.preco\.toString\(\)\);",
              r"setProdFormPreco(Number(\1.preco) || 0);",
              text,
          )
          if product_price_setters < 2:
              raise SystemExit(f'Expected product price setters, found {product_price_setters}')

          replace_exact("onChange={(e) => setSaldoInicial(e.target.value)}", "onValueChange={setSaldoInicial}")
          replace_exact("onChange={(e) => setPaymentValor(e.target.value)}", "onValueChange={setPaymentValor}")
          replace_exact("onChange={(e) => setProdFormPreco(e.target.value)}", "onValueChange={setProdFormPreco}")
          replace_exact(
              "onChange={(e) => setInsumoFormCusto(Number(e.target.value))}",
              "onValueChange={(value) => setInsumoFormCusto(Number(value || 0))}",
              expected=2,
          )

          def convert_input(value_name: str, expected: int = 1):
              global text
              matches = []
              for match in re.finditer(r'<input\b[\s\S]*?/>', text):
                  if f'value={{{value_name}}}' in match.group(0):
                      matches.append(match)
              if len(matches) != expected:
                  raise SystemExit(f'Expected {expected} input(s) for {value_name}, found {len(matches)}')
              for match in reversed(matches):
                  tag = match.group(0)
                  tag = tag.replace('<input', '<MoneyInput', 1)
                  tag = re.sub(r'\n\s*type="number"', '', tag)
                  tag = re.sub(r'\n\s*step=(?:"[^"]*"|\{[^\n]*\})', '', tag)
                  tag = re.sub(r'\n\s*min=(?:"[^"]*"|\{[^\n]*\})', '', tag)
                  text = text[:match.start()] + tag + text[match.end():]

          convert_input('saldoInicial')
          convert_input('paymentValor')
          convert_input('prodFormPreco')
          convert_input('insumoFormCusto', expected=2)

          forbidden = [
              'parseFloat(saldoInicial)',
              'parseFloat(paymentValor)',
              'parseFloat(prodFormPreco)',
              'parseFloat(deliveryTaxa)',
              "setPdvDeliveryTaxa('0.00')",
              'onChange={(e) => setSaldoInicial(e.target.value)}',
              'onChange={(e) => setPaymentValor(e.target.value)}',
              'onChange={(e) => setProdFormPreco(e.target.value)}',
          ]
          leftovers = [value for value in forbidden if value in text]
          if leftovers:
              raise SystemExit(f'Forbidden monetary patterns remain: {leftovers}')

          path.write_text(text)
          PY

      - name: Validate frontend after patch
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Commit validated patch and remove one-shot workflow
        run: |
          rm .github/workflows/stage3d-money-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CaixaPanel.tsx .github/workflows/stage3d-money-patch.yml
          git diff --cached --check
          git commit -m "refactor(finance): padroniza inputs monetários do caixa"
          git push origin HEAD:${{ github.head_ref }}
