name: Stage 3D hybrid money patch

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'audit/consistencia-financeira-etapa-3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply deterministic hybrid money patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/CaixaPanel.tsx')
          text = path.read_text()

          def replace_exact(old: str, new: str, expected: int = 1):
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'Expected {expected} occurrence(s), found {count}: {old[:120]!r}')
              text = text.replace(old, new)

          def input_tag_for(value_name: str) -> str:
              matches = [
                  match.group(0)
                  for match in re.finditer(r'<input\b[\s\S]*?/>', text)
                  if f'value={{{value_name}}}' in match.group(0)
              ]
              if len(matches) != 1:
                  raise SystemExit(f'Expected exactly one input for {value_name}, found {len(matches)}')
              return matches[0]

          replace_exact(
              "const [newCrmSaldo, setNewCrmSaldo] = useState<string>('0');",
              "const [newCrmSaldo, setNewCrmSaldo] = useState<number | ''>(0);",
          )
          replace_exact(
              "const created = await handleCreateClient(newCrmNome, newCrmTelefone, Number(newCrmSaldo));",
              "const created = await handleCreateClient(newCrmNome, newCrmTelefone, Number(newCrmSaldo || 0));",
          )

          new_client_input = input_tag_for('newCrmSaldo')
          class_match = re.search(r'className=\{clsx\([^\n]+\)\}', new_client_input)
          if class_match is None:
              raise SystemExit('newCrmSaldo input className not found')
          client_class = class_match.group(0)
          new_client = f'''{{fidelidadeConfig.tipo_recompensa === 'PONTOS' ? (
                  <input
                    type="number"
                    step="1"
                    value={{newCrmSaldo}}
                    onChange={{(e) => setNewCrmSaldo(e.target.value === '' ? '' : Number(e.target.value))}}
                    {client_class}
                  />
                ) : (
                  <MoneyInput
                    value={{newCrmSaldo}}
                    onValueChange={{setNewCrmSaldo}}
                    {client_class}
                  />
                )}}'''
          replace_exact(new_client_input, new_client)

          cashback_input = input_tag_for('crmFormCashback')
          cashback_class_match = re.search(r'className=\{clsx\([^\n]+\)\}', cashback_input)
          if cashback_class_match is None:
              raise SystemExit('crmFormCashback input className not found')
          cashback_class = cashback_class_match.group(0)
          new_cashback = f'''<MoneyInput
                      required
                      value={{crmFormCashback}}
                      onValueChange={{(value) => setCrmFormCashback(Number(value || 0))}}
                      {cashback_class}
                    />'''
          replace_exact(cashback_input, new_cashback)

          coupon_input = input_tag_for('newCouponVal')
          coupon_class_match = re.search(r'className=\{clsx\([^\n]+\)\}', coupon_input)
          if coupon_class_match is None:
              raise SystemExit('newCouponVal input className not found')
          coupon_class = coupon_class_match.group(0)
          new_coupon = f'''{{newCouponTipo === 'fixo' ? (
                        <MoneyInput
                          value={{newCouponVal}}
                          onValueChange={{(value) => setNewCouponVal(Number(value || 0))}}
                          {coupon_class}
                        />
                      ) : (
                        <input
                          type="number"
                          value={{newCouponVal}}
                          onChange={{(e) => setNewCouponVal(Number(e.target.value))}}
                          {coupon_class}
                        />
                      )}}'''
          replace_exact(coupon_input, new_coupon)

          forbidden = [
              "step={fidelidadeConfig.tipo_recompensa === 'PONTOS' ? '1' : '0.01'}",
              'onChange={(e) => setCrmFormCashback(Number(e.target.value))}',
          ]
          leftovers = [value for value in forbidden if value in text]
          if leftovers:
              raise SystemExit(f'Hybrid monetary patterns remain: {leftovers}')

          if text.count("newCouponTipo === 'fixo' ? (") != 1:
              raise SystemExit('Fixed coupon conditional missing or duplicated')
          if text.count("fidelidadeConfig.tipo_recompensa === 'PONTOS' ? (") < 1:
              raise SystemExit('Points/cashback conditional missing')
          if text.count('<MoneyInput') < 7:
              raise SystemExit('Expected canonical MoneyInput uses are missing')

          path.write_text(text)
          PY

      - name: Validate frontend after patch
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Commit validated patch and remove one-shot workflow
        run: |
          rm .github/workflows/stage3d-hybrid-money-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CaixaPanel.tsx .github/workflows/stage3d-hybrid-money-patch.yml
          git diff --cached --check
          git commit -m "refactor(finance): padroniza cashback e cupom fixo"
          git push origin HEAD:${{ github.head_ref }}
