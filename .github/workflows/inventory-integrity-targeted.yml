name: Inventory Integrity Targeted

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inventory-integrity-targeted.yml'
      - 'backend/app/routes/estoque.py'
      - 'backend/app/routes/orders.py'
      - 'backend/app/schemas.py'
      - 'backend/app/services/inventory.py'
      - 'backend/tests/test_inventory_concurrent_idempotency.py'
      - 'backend/tests/test_inventory_concurrency_postgres.py'
      - 'backend/tests/test_online_order_acceptance_inventory.py'
      - 'src/components/caixa/orders/useCashierOrders.ts'

permissions:
  contents: read

jobs:
  policy-regressions:
    name: Informational inventory policy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ENVIRONMENT: test
      SECRET_KEY: inventory-integrity-targeted-secret
      ENCRYPTION_KEY: dgvrWayyUxrh0PjzBcjn1AJ5woxjUE3lLTRptHDUSEQ=
      DATABASE_URL: sqlite:///./inventory-integrity-targeted.db
      MIGRATION_DATABASE_URL: sqlite:///./inventory-integrity-targeted.db
      KOMA_PUBLIC_API_URL: https://api.example.test
      PYTHONPATH: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Compile inventory modules
        run: |
          python -m py_compile backend/app/routes/estoque.py
          python -m py_compile backend/app/routes/orders.py
          python -m py_compile backend/app/schemas.py
          python -m py_compile backend/app/services/inventory.py
          python -m py_compile backend/tests/test_inventory_concurrency_postgres.py
          python -m py_compile backend/tests/test_online_order_acceptance_inventory.py

      - name: Run inventory policy regressions
        run: |
          python -m pytest -q -x             backend/tests/test_inventory_concurrent_idempotency.py             backend/tests/test_online_order_acceptance_inventory.py

  postgres-race:
    name: PostgreSQL stock races
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: inventory-integrity-postgres-secret
      ENCRYPTION_KEY: dgvrWayyUxrh0PjzBcjn1AJ5woxjUE3lLTRptHDUSEQ=
      DATABASE_URL: postgresql://inventory:inventory@127.0.0.1:5432/inventory_test
      MIGRATION_DATABASE_URL: postgresql://inventory:inventory@127.0.0.1:5432/inventory_test
      KOMA_PUBLIC_API_URL: https://api.example.test
      KOMA_PYTEST_USE_EXTERNAL_DATABASE: 'true'
      PYTHONPATH: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Validate Alembic and migrate PostgreSQL
        working-directory: backend
        run: |
          test "$(python -m alembic heads | wc -l)" -eq 1
          python -m alembic upgrade head

      - name: Run PostgreSQL inventory races
        run: python -m pytest -q -x backend/tests/test_inventory_concurrency_postgres.py
