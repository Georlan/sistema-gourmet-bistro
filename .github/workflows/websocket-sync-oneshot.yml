name: WebSocket order sync one shot

on:
  push:
    branches:
      - fix/websocket-order-sync

permissions:
  contents: write

concurrency:
  group: websocket-order-sync-oneshot
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply websocket sync patch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/websocket-order-sync
          fetch-depth: 0

      - name: Apply semantic realtime order synchronization
        shell: python
        run: |
          from pathlib import Path

          orders_path = Path('backend/app/routes/orders.py')
          text = orders_path.read_text(encoding='utf-8')

          old_open = '''    db.refresh(nova_comanda)\n    background_tasks.add_task(manager.broadcast, {"event": "tables_updated"}, require_tenant_id())\n    return nova_comanda\n'''
          new_open = '''    db.refresh(nova_comanda)\n    background_tasks.add_task(\n        manager.broadcast,\n        {\n            "event": "tables_updated",\n            "detail": {\n                "type": "comanda_aberta",\n                "mesa_id": nova_comanda.mesa_id,\n                "comanda_id": nova_comanda.id,\n            },\n        },\n        require_tenant_id(),\n    )\n    return nova_comanda\n'''
          if text.count(old_open) != 1:
              raise RuntimeError(f'orders.py: expected one comanda-open broadcast, found {text.count(old_open)}')
          text = text.replace(old_open, new_open, 1)

          old_launch = '''    db.refresh(novo_lancamento)\n    novo_lancamento.itens = itens_criados\n\n    background_tasks.add_task(manager.broadcast, {"event": "tables_updated"}, require_tenant_id())\n    return novo_lancamento\n'''
          new_launch = '''    db.refresh(novo_lancamento)\n    novo_lancamento.itens = itens_criados\n\n    background_tasks.add_task(\n        manager.broadcast,\n        {\n            "event": "tables_updated",\n            "detail": {\n                "type": "lancamento_criado",\n                "mesa_id": comanda.mesa_id,\n                "comanda_id": comanda.id,\n                "lancamento_id": novo_lancamento.id,\n                "itens": len(itens_criados),\n            },\n        },\n        require_tenant_id(),\n    )\n    return novo_lancamento\n'''
          if text.count(old_launch) != 1:
              raise RuntimeError(f'orders.py: expected one launch broadcast, found {text.count(old_launch)}')
          text = text.replace(old_launch, new_launch, 1)
          orders_path.write_text(text, encoding='utf-8')

          app_path = Path('src/App.tsx')
          text = app_path.read_text(encoding='utf-8')
          old_schedule = '''    const scheduleRealtimeRefresh = (flags: RealtimeRefreshFlags) => {\n      pendingRefresh = { ...pendingRefresh, ...flags };\n      if (wsUpdateTimeout) clearTimeout(wsUpdateTimeout);\n      wsUpdateTimeout = setTimeout(() => {\n'''
          new_schedule = '''    const scheduleRealtimeRefresh = (flags: RealtimeRefreshFlags, delayMs = 90) => {\n      pendingRefresh = { ...pendingRefresh, ...flags };\n      if (wsUpdateTimeout) clearTimeout(wsUpdateTimeout);\n      wsUpdateTimeout = setTimeout(() => {\n'''
          if text.count(old_schedule) != 1:
              raise RuntimeError(f'App.tsx: schedule function signature mismatch: {text.count(old_schedule)}')
          text = text.replace(old_schedule, new_schedule, 1)
          text = text.replace('''      }, 90);\n    };\n\n    const connectWS = () => {''', '''      }, delayMs);\n    };\n\n    const connectWS = () => {''', 1)

          old_tables = '''          if (eventName === "tables_updated" || eventName === "TABLE_UPDATED") {\n            const isLayoutChange = data.detail?.type === 'layout_mesa_atualizado';\n            scheduleRealtimeRefresh(isLayoutChange\n              ? { tables: true }\n              : {\n                  orders: true,\n                  tables: true,\n                  summary: true,\n                  payments: true\n                }\n            );\n'''
          new_tables = '''          if (eventName === "tables_updated" || eventName === "TABLE_UPDATED") {\n            const detailType = String(data.detail?.type || '');\n            const isLayoutChange = detailType === 'layout_mesa_atualizado';\n            const isComandaOpened = detailType === 'comanda_aberta';\n            const isLaunchCreated = detailType === 'lancamento_criado';\n\n            if (isLayoutChange || isComandaOpened) {\n              // Abrir a comanda ocupa a mesa, mas ainda não existe pedido para o Kanban.\n              // Atualizar orders aqui causava um estado intermediário vazio e alerta duplicado.\n              scheduleRealtimeRefresh({ tables: true });\n            } else if (isLaunchCreated) {\n              // Este é o primeiro momento em que existe conteúdo operacional real.\n              // Busca imediatamente para o card e o alerta nascerem no mesmo ciclo.\n              scheduleRealtimeRefresh({ orders: true, tables: true, summary: true }, 0);\n            } else {\n              // Compatibilidade com eventos legados e demais mutações de mesa.\n              scheduleRealtimeRefresh({\n                orders: true,\n                tables: true,\n                summary: true,\n                payments: true\n              });\n            }\n'''
          if text.count(old_tables) != 1:
              raise RuntimeError(f'App.tsx: tables_updated handler mismatch: {text.count(old_tables)}')
          text = text.replace(old_tables, new_tables, 1)
          app_path.write_text(text, encoding='utf-8')

          caixa_path = Path('src/components/CaixaPanel.tsx')
          text = caixa_path.read_text(encoding='utf-8')
          old_ref = '''  const prevOrdersSignatureRef = useRef({\n    orderCount: 0,\n    itemsCount: 0,\n    billRequestedCount: 0\n  });\n'''
          new_ref = '''  const prevOrdersSignatureRef = useRef({\n    itemsCount: 0,\n    billRequestedCount: 0\n  });\n'''
          if text.count(old_ref) != 1:
              raise RuntimeError(f'CaixaPanel.tsx: notification signature ref mismatch: {text.count(old_ref)}')
          text = text.replace(old_ref, new_ref, 1)

          old_effect = '''    const orderCount = active.length;\n    const itemsCount = active.reduce((sum, o) => sum + (o.itens ? o.itens.length : 0), 0);\n    const billRequestedCount = active.filter(o =>\n      (o as any).status_comanda === 'aguardando_pagamento' ||\n      (o as any).statusComanda === 'aguardando_pagamento' ||\n      (o as any).contaPedida === true\n    ).length;\n\n    if (isInitialOrdersMountRef.current) {\n      isInitialOrdersMountRef.current = false;\n      prevOrdersSignatureRef.current = { orderCount, itemsCount, billRequestedCount };\n      return;\n    }\n\n    const prev = prevOrdersSignatureRef.current;\n    if (billRequestedCount > prev.billRequestedCount) {\n      playOrderAlert('bill_requested');\n    } else if (itemsCount > prev.itemsCount || orderCount > prev.orderCount) {\n      playOrderAlert('new_order');\n    }\n\n    prevOrdersSignatureRef.current = { orderCount, itemsCount, billRequestedCount };\n'''
          new_effect = '''    const itemsCount = active.reduce((sum, o) => sum + (o.itens ? o.itens.length : 0), 0);\n    const billRequestedCount = active.filter(o =>\n      (o as any).status_comanda === 'aguardando_pagamento' ||\n      (o as any).statusComanda === 'aguardando_pagamento' ||\n      (o as any).contaPedida === true\n    ).length;\n\n    if (isInitialOrdersMountRef.current) {\n      isInitialOrdersMountRef.current = false;\n      prevOrdersSignatureRef.current = { itemsCount, billRequestedCount };\n      return;\n    }\n\n    const prev = prevOrdersSignatureRef.current;\n    if (billRequestedCount > prev.billRequestedCount) {\n      playOrderAlert('bill_requested');\n    } else if (itemsCount > prev.itemsCount) {\n      // Uma comanda vazia é apenas sessão de mesa, não um pedido novo.\n      // O som nasce somente quando os itens que também geram o card chegam.\n      playOrderAlert('new_order');\n    }\n\n    prevOrdersSignatureRef.current = { itemsCount, billRequestedCount };\n'''
          if text.count(old_effect) != 1:
              raise RuntimeError(f'CaixaPanel.tsx: orders notification effect mismatch: {text.count(old_effect)}')
          text = text.replace(old_effect, new_effect, 1)
          caixa_path.write_text(text, encoding='utf-8')

      - name: Validate patch shape
        run: |
          git diff --check
          grep -q '"type": "comanda_aberta"' backend/app/routes/orders.py
          grep -q '"type": "lancamento_criado"' backend/app/routes/orders.py
          grep -q 'scheduleRealtimeRefresh({ orders: true, tables: true, summary: true }, 0)' src/App.tsx
          grep -q "else if (itemsCount > prev.itemsCount)" src/components/CaixaPanel.tsx

      - name: Commit synchronization fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/routes/orders.py src/App.tsx src/components/CaixaPanel.tsx
          git commit -m "fix(realtime): synchronize order cards and alerts"
          git push origin HEAD:fix/websocket-order-sync
