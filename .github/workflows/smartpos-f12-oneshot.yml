name: SmartPOS F12 one shot

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/smartpos-f12-recovery-refunds'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/smartpos-f12-recovery-refunds
          fetch-depth: 0

      - name: Apply F12 recovery and refund guards
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  if new in text:
                      return
                  raise RuntimeError(f'anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # SmartPOS manual confirmation now locks the intent against cancellation races.
          replace_once(
              'backend/app/routes/smartpos.py',
              '''    intent = db.query(SmartPosPaymentIntent).filter(\n        SmartPosPaymentIntent.restaurante_id == restaurante_id,\n        SmartPosPaymentIntent.id == intent_id,\n    ).first()\n''',
              '''    intent = (\n        db.query(SmartPosPaymentIntent)\n        .filter(\n            SmartPosPaymentIntent.restaurante_id == restaurante_id,\n            SmartPosPaymentIntent.id == intent_id,\n        )\n        .with_for_update()\n        .first()\n    )\n'''
          )

          # Cancellation DTOs.
          replace_once(
              'backend/app/routes/smartpos.py',
              '''class SmartPosManualConfirmationResponse(SmartPosPaymentIntentResponse):\n    transition_replayed: bool = False\n    payment_id: Optional[str] = None\n    settled: bool = False\n    financial_effect: bool = False\n    troco: Decimal = Decimal("0.00")\n\n\ndef _money''',
              '''class SmartPosManualConfirmationResponse(SmartPosPaymentIntentResponse):\n    transition_replayed: bool = False\n    payment_id: Optional[str] = None\n    settled: bool = False\n    financial_effect: bool = False\n    troco: Decimal = Decimal("0.00")\n\n\nclass SmartPosIntentCancellation(BaseModel):\n    idempotency_key: str = Field(min_length=8, max_length=128)\n    motivo: Optional[str] = Field(default=None, max_length=255)\n\n\nclass SmartPosIntentCancellationResponse(SmartPosPaymentIntentResponse):\n    transition_replayed: bool = False\n    financial_effect: bool = False\n\n\ndef _money'''
          )

          # Append safe pre-charge cancellation endpoint.
          smartpos_path = Path('backend/app/routes/smartpos.py')
          smartpos = smartpos_path.read_text(encoding='utf-8')
          cancellation = '''\n\n@router.post(\n    "/payment-intents/{intent_id}/cancelar",\n    response_model=SmartPosIntentCancellationResponse,\n)\ndef cancelar_payment_intent(\n    intent_id: str,\n    payload: SmartPosIntentCancellation,\n    background_tasks: BackgroundTasks,\n    db: Session = Depends(get_db),\n    current_user: Usuario = Depends(require_permission("smartpos:receber")),\n):\n    """Cancela somente antes de existir cobrança/efeito financeiro."""\n    restaurante_id = require_tenant_id()\n    if not has_capability(db, restaurante_id, "smartpos"):\n        raise HTTPException(\n            status_code=status.HTTP_403_FORBIDDEN,\n            detail="SmartPOS não habilitado para este restaurante.",\n        )\n\n    intent = (\n        db.query(SmartPosPaymentIntent)\n        .filter(\n            SmartPosPaymentIntent.restaurante_id == restaurante_id,\n            SmartPosPaymentIntent.id == intent_id,\n        )\n        .with_for_update()\n        .first()\n    )\n    if intent is None:\n        raise HTTPException(status_code=404, detail="Intenção de pagamento não encontrada.")\n    if intent.pagamento_id is not None:\n        raise HTTPException(\n            status_code=409,\n            detail="Este recebimento já foi liquidado. Use o estorno financeiro do Caixa.",\n        )\n    if intent.status == "processando":\n        raise HTTPException(\n            status_code=409,\n            detail=(\n                "A cobrança já está em processamento no terminal. "\n                "Não é seguro cancelar; reconcilie o resultado da mesma operação."\n            ),\n        )\n    if intent.status == "aprovada":\n        raise HTTPException(\n            status_code=409,\n            detail=(\n                "A cobrança já foi aprovada e aguarda liquidação. "\n                "Não cancele: conclua a reconciliação financeira."\n            ),\n        )\n\n    try:\n        result = transition_intent(\n            db,\n            intent=intent,\n            target_status="cancelada",\n            transition_key=payload.idempotency_key,\n            actor_id=current_user.id,\n            motivo=payload.motivo or "Recebimento cancelado pelo operador antes da cobrança.",\n        )\n        db.commit()\n    except InvalidSmartPosTransition as exc:\n        db.rollback()\n        raise HTTPException(status_code=409, detail=str(exc)) from exc\n\n    db.refresh(intent)\n    background_tasks.add_task(\n        manager.broadcast,\n        {\n            "event": "payment_intent_updated",\n            "detail": {\n                "intent_id": intent.id,\n                "mesa_id": intent.mesa_id,\n                "status": intent.status,\n                "type": "smartpos_intent_cancelled",\n            },\n        },\n        restaurante_id,\n    )\n    background_tasks.add_task(\n        manager.broadcast,\n        {\n            "event": "tables_updated",\n            "detail": {\n                "type": "smartpos_intent_cancelled",\n                "mesa_id": intent.mesa_id,\n                "intent_id": intent.id,\n            },\n        },\n        restaurante_id,\n    )\n    return {\n        **_intent_payload(intent),\n        "transition_replayed": result.replayed,\n        "financial_effect": False,\n    }\n'''
          if 'def cancelar_payment_intent(' not in smartpos:
              smartpos_path.write_text(smartpos.rstrip() + cancellation + '\n', encoding='utf-8')

          # Provider operations and cancellation use the same row lock.
          replace_once(
              'backend/app/routes/smartpos_provider.py',
              '''def _load_intent(db: Session, restaurante_id: int, intent_id: str) -> SmartPosPaymentIntent:\n    intent = db.query(SmartPosPaymentIntent).filter(\n        SmartPosPaymentIntent.restaurante_id == restaurante_id,\n        SmartPosPaymentIntent.id == intent_id,\n    ).first()\n''',
              '''def _load_intent(db: Session, restaurante_id: int, intent_id: str) -> SmartPosPaymentIntent:\n    intent = (\n        db.query(SmartPosPaymentIntent)\n        .filter(\n            SmartPosPaymentIntent.restaurante_id == restaurante_id,\n            SmartPosPaymentIntent.id == intent_id,\n        )\n        .with_for_update()\n        .first()\n    )\n'''
          )

          # New financial refunds of provider-integrated SmartPOS payments are fail-closed
          # until the real provider reversal exists. Idempotent retries of historical refunds
          # still pass through before this guard.
          replace_once(
              'backend/app/services/refund_guard.py',
              'from ..models import Pagamento\n',
              'from ..models import Pagamento\nfrom ..smartpos_models import SmartPosPaymentIntent\n'
          )
          replace_once(
              'backend/app/services/refund_guard.py',
              '''    if existing is not None:\n        # O serviço central faz a validação estrita de payload drift e devolve\n        # o mesmo evento quando a retentativa é realmente idempotente.\n        return create_refund(\n            db,\n            restaurante_id=restaurante_id,\n            payment_id=payment_id,\n            turno_id=turno_id,\n            usuario_id=usuario_id,\n            valor=valor,\n            motivo=motivo,\n            idempotency_key=idempotency_key,\n            metodo_devolucao=metodo_devolucao,\n            alocacoes=alocacoes,\n        )\n\n    refund_value = money(valor)\n''',
              '''    if existing is not None:\n        # O serviço central faz a validação estrita de payload drift e devolve\n        # o mesmo evento quando a retentativa é realmente idempotente.\n        return create_refund(\n            db,\n            restaurante_id=restaurante_id,\n            payment_id=payment_id,\n            turno_id=turno_id,\n            usuario_id=usuario_id,\n            valor=valor,\n            motivo=motivo,\n            idempotency_key=idempotency_key,\n            metodo_devolucao=metodo_devolucao,\n            alocacoes=alocacoes,\n        )\n\n    smartpos_intent = db.query(SmartPosPaymentIntent).filter(\n        SmartPosPaymentIntent.restaurante_id == restaurante_id,\n        SmartPosPaymentIntent.pagamento_id == payment_id,\n    ).first()\n    if smartpos_intent is not None and smartpos_intent.captura == "provider_integrado":\n        raise RefundDomainError(\n            "Pagamento integrado da maquininha exige estorno confirmado pelo provider; "\n            "a reversão física ainda não está habilitada.",\n            status_code=409,\n        )\n\n    refund_value = money(valor)\n'''
          )

          # Do not advertise provider-integrated SmartPOS payments as refundable yet.
          replace_once(
              'backend/app/routes/financial_refund_listing.py',
              'from ..models import Pagamento, Usuario\n',
              'from ..models import Pagamento, Usuario\nfrom ..smartpos_models import SmartPosPaymentIntent\n'
          )
          replace_once(
              'backend/app/routes/financial_refund_listing.py',
              '''        for payment in payments:\n            payload = refundable_payment_payload_human(\n''',
              '''        integrated_payment_ids = {\n            str(row[0])\n            for row in db.query(SmartPosPaymentIntent.pagamento_id).filter(\n                SmartPosPaymentIntent.restaurante_id == restaurante_id,\n                SmartPosPaymentIntent.pagamento_id.in_([payment.id for payment in payments]),\n                SmartPosPaymentIntent.captura == "provider_integrado",\n            ).all()\n            if row[0]\n        }\n\n        for payment in payments:\n            if str(payment.id) in integrated_payment_ids:\n                continue\n            payload = refundable_payment_payload_human(\n'''
          )

          # UI: operator can cancel only while the backend says it is still safe.
          ui_path = Path('src/smartpos/SmartPosPaymentFlow.tsx')
          ui = ui_path.read_text(encoding='utf-8')
          ui = ui.replace(
              "  const [isConfirmingManual, setIsConfirmingManual] = useState(false);\n",
              "  const [isConfirmingManual, setIsConfirmingManual] = useState(false);\n  const [isCancelling, setIsCancelling] = useState(false);\n"
          )
          anchor = "  const confirmManualPayment = async () => {\n"
          cancel_fn = '''  const cancelPaymentIntent = async () => {\n    if (!intentId || manualSettled) return;\n    setIsCancelling(true);\n    setError('');\n    try {\n      const response = await fetch(`${API_BASE_URL}/auth/smartpos/payment-intents/${encodeURIComponent(intentId)}/cancelar`, {\n        method: 'POST',\n        headers: {\n          Authorization: `Bearer ${session.token}`,\n          'Content-Type': 'application/json',\n        },\n        body: JSON.stringify({\n          idempotency_key: `${idempotencyKey || intentId}:cancel`,\n          motivo: 'Cancelado pelo operador na maquininha antes da cobrança.',\n        }),\n      });\n      if (response.status === 401 || response.status === 403) {\n        onSessionInvalid();\n        return;\n      }\n      const data = await response.json().catch(() => null);\n      if (!response.ok) throw new Error(data?.detail || 'Não foi possível cancelar o recebimento.');\n      onBack();\n    } catch (cause) {\n      setError(cause instanceof Error ? cause.message : 'Não foi possível cancelar o recebimento.');\n    } finally {\n      setIsCancelling(false);\n    }\n  };\n\n'''
          if cancel_fn.strip() not in ui:
              if anchor not in ui:
                  raise RuntimeError('F12 cancel function anchor not found')
              ui = ui.replace(anchor, cancel_fn + anchor, 1)

          old = '''          {!manualCapture && !manualSettled && (\n            <p className="mt-5 border-t border-koma-border pt-4 text-xs text-koma-muted">A cobrança integrada será processada pelo aplicativo Android da maquininha.</p>\n          )}\n          {error &&'''
          new = '''          {!manualCapture && !manualSettled && (\n            <p className="mt-5 border-t border-koma-border pt-4 text-xs text-koma-muted">A cobrança integrada será processada pelo aplicativo Android da maquininha. Depois que o terminal assumir a operação, o cancelamento fica bloqueado e o resultado precisa ser reconciliado.</p>\n          )}\n          {!manualSettled && intentId && (\n            <button\n              type="button"\n              onClick={() => void cancelPaymentIntent()}\n              disabled={isCancelling || isConfirmingManual}\n              className="mt-3 min-h-12 w-full rounded-xl border border-red-900/60 px-4 text-xs font-black text-red-300 disabled:opacity-50"\n            >\n              {isCancelling ? 'Cancelando…' : 'Cancelar recebimento'}\n            </button>\n          )}\n          {error &&'''
          if old in ui:
              ui = ui.replace(old, new, 1)
          elif new not in ui:
              raise RuntimeError('F12 cancel UI anchor not found')
          ui_path.write_text(ui, encoding='utf-8')

          # Tests: cleanup refund ledger and add a Caixa identity.
          test_path = Path('backend/tests/test_smartpos_payment_intent_preview.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace(
              'from app.database import Base, SessionLocal, current_restaurante_id, engine\n',
              'from app.database import Base, SessionLocal, current_restaurante_id, engine\nfrom app.financial_models import PagamentoEstorno\nfrom app.financial_refund_models import PagamentoEstornoAlocacao, PagamentoEstornoLiquidacao\n'
          )
          tests = tests.replace(
              'from app.services.smartpos_payment_state import can_transition\n',
              'from app.services.smartpos_payment_state import can_transition\n'
          )
          tests = tests.replace(
              'USER_ID = "smartpos-intent-garcom"\n',
              'USER_ID = "smartpos-intent-garcom"\nCAIXA_USER_ID = "smartpos-intent-caixa"\n'
          )
          cleanup_anchor = '''        db.query(SmartPosPaymentIntentEvent).filter(\n            SmartPosPaymentIntentEvent.restaurante_id == RESTAURANTE_ID\n        ).delete()\n'''
          cleanup_new = '''        db.query(PagamentoEstornoAlocacao).filter(\n            PagamentoEstornoAlocacao.restaurante_id == RESTAURANTE_ID\n        ).delete()\n        db.query(PagamentoEstornoLiquidacao).filter(\n            PagamentoEstornoLiquidacao.restaurante_id == RESTAURANTE_ID\n        ).delete()\n        db.query(PagamentoEstorno).filter(\n            PagamentoEstorno.restaurante_id == RESTAURANTE_ID\n        ).delete()\n        db.query(SmartPosPaymentIntentEvent).filter(\n            SmartPosPaymentIntentEvent.restaurante_id == RESTAURANTE_ID\n        ).delete()\n'''
          if cleanup_anchor in tests:
              tests = tests.replace(cleanup_anchor, cleanup_new, 1)

          user_anchor = '''        usuario = db.query(Usuario).filter(Usuario.id == USER_ID).first()\n        if usuario is None:\n            db.add(Usuario(\n                id=USER_ID,\n                nome="Garçom Intent",\n                email="smartpos-intent@koma.test",\n                senha_hash="$2b$12$dummyhashsmartposintent",\n                role="garcom",\n                status="ativo",\n                restaurante_id=RESTAURANTE_ID,\n            ))\n            db.flush()\n\n'''
          user_new = user_anchor + '''        caixa_user = db.query(Usuario).filter(Usuario.id == CAIXA_USER_ID).first()\n        if caixa_user is None:\n            db.add(Usuario(\n                id=CAIXA_USER_ID,\n                nome="Caixa SmartPOS",\n                email="smartpos-caixa@koma.test",\n                senha_hash="$2b$12$dummyhashsmartposcaixa",\n                role="caixa",\n                status="ativo",\n                restaurante_id=RESTAURANTE_ID,\n            ))\n            db.flush()\n\n'''
          if user_anchor in tests and 'nome="Caixa SmartPOS"' not in tests:
              tests = tests.replace(user_anchor, user_new, 1)

          headers_anchor = '''def headers():\n    token = create_access_token(subject=USER_ID, restaurante_id=RESTAURANTE_ID, role="garcom")\n    return {"Authorization": f"Bearer {token}"}\n\n'''
          headers_new = headers_anchor + '''\ndef caixa_headers():\n    token = create_access_token(\n        subject=CAIXA_USER_ID,\n        restaurante_id=RESTAURANTE_ID,\n        role="caixa",\n    )\n    return {"Authorization": f"Bearer {token}"}\n\n'''
          if headers_anchor in tests and 'def caixa_headers()' not in tests:
              tests = tests.replace(headers_anchor, headers_new, 1)

          insertion = '''\n\ndef test_f12_cancelamento_pre_cobranca_libera_reserva_e_e_idempotente():\n    first = client.post(\n        "/auth/smartpos/payment-intents",\n        headers=headers(),\n        json={\n            "mesa_id": 4,\n            "valor": "30.00",\n            "metodo": "pix",\n            "escopo": "valor",\n            "idempotency_key": "f12-cancel-create-01",\n        },\n    )\n    assert first.status_code == 201, first.text\n    intent_id = first.json()["id"]\n    payload = {\n        "idempotency_key": "f12-cancel-action-01",\n        "motivo": "Cliente desistiu antes da cobrança.",\n    }\n    cancelled = client.post(\n        f"/auth/smartpos/payment-intents/{intent_id}/cancelar",\n        headers=headers(),\n        json=payload,\n    )\n    replay = client.post(\n        f"/auth/smartpos/payment-intents/{intent_id}/cancelar",\n        headers=headers(),\n        json=payload,\n    )\n    assert cancelled.status_code == 200, cancelled.text\n    assert cancelled.json()["status"] == "cancelada"\n    assert cancelled.json()["financial_effect"] is False\n    assert replay.status_code == 200, replay.text\n    assert replay.json()["transition_replayed"] is True\n\n    full = client.post(\n        "/auth/smartpos/payment-intents",\n        headers=headers(),\n        json={\n            "mesa_id": 4,\n            "valor": "42.00",\n            "metodo": "dinheiro",\n            "escopo": "valor",\n            "idempotency_key": "f12-after-cancel-full",\n        },\n    )\n    assert full.status_code == 201, full.text\n\n\ndef test_f12_cobranca_em_processamento_nao_pode_ser_cancelada():\n    created = client.post(\n        "/auth/smartpos/payment-intents",\n        headers=headers(),\n        json={\n            "mesa_id": 4,\n            "valor": "10.00",\n            "metodo": "credito",\n            "escopo": "valor",\n            "idempotency_key": "f12-processing-create",\n        },\n    )\n    intent_id = created.json()["id"]\n    prepared = client.post(\n        f"/auth/smartpos/payment-intents/{intent_id}/preparar-terminal",\n        headers=headers(),\n        json={\n            "provider": "pagbank",\n            "operation_key": "f12-processing-op-key",\n            "terminal_id": "terminal-f12",\n        },\n    )\n    assert prepared.status_code == 200, prepared.text\n    assert prepared.json()["should_execute"] is True\n\n    cancel = client.post(\n        f"/auth/smartpos/payment-intents/{intent_id}/cancelar",\n        headers=headers(),\n        json={"idempotency_key": "f12-processing-cancel"},\n    )\n    assert cancel.status_code == 409, cancel.text\n    assert "reconcil" in cancel.json()["detail"].lower()\n\n\ndef test_f12_pagamento_manual_pode_ser_estornado_no_caixa_sem_reabrir_comanda():\n    created = client.post(\n        "/auth/smartpos/payment-intents",\n        headers=headers(),\n        json={\n            "mesa_id": 4,\n            "valor": "42.00",\n            "metodo": "dinheiro",\n            "escopo": "valor",\n            "idempotency_key": "f12-refund-cash-create",\n        },\n    )\n    confirmed = client.post(\n        f"/auth/smartpos/payment-intents/{created.json()['id']}/confirmar-manual",\n        headers=headers(),\n        json={\n            "idempotency_key": "f12-refund-cash-confirm",\n            "valor_recebido": "50.00",\n        },\n    )\n    assert confirmed.status_code == 200, confirmed.text\n    payment_id = confirmed.json()["payment_id"]\n    refund_payload = {\n        "valor": "10.00",\n        "motivo": "Devolução parcial solicitada pelo cliente.",\n        "idempotency_key": "f12-refund-cash-action",\n        "metodo_devolucao": "dinheiro",\n    }\n    refunded = client.post(\n        f"/auth/caixa/pagamentos/{payment_id}/estornar",\n        headers=caixa_headers(),\n        json=refund_payload,\n    )\n    replay = client.post(\n        f"/auth/caixa/pagamentos/{payment_id}/estornar",\n        headers=caixa_headers(),\n        json=refund_payload,\n    )\n    assert refunded.status_code == 201, refunded.text\n    assert replay.status_code == 201, replay.text\n    assert replay.json()["id"] == refunded.json()["id"]\n    assert Decimal(str(refunded.json()["saldo_estornavel_pagamento"])) == Decimal("32.0")\n\n    token = current_restaurante_id.set(RESTAURANTE_ID)\n    db = SessionLocal()\n    try:\n        assert db.query(PagamentoEstorno).filter(\n            PagamentoEstorno.restaurante_id == RESTAURANTE_ID,\n            PagamentoEstorno.pagamento_id == payment_id,\n        ).count() == 1\n        comanda = db.query(Comanda).filter(Comanda.id == "cmd-smartpos-intent").one()\n        assert comanda.fechada is True\n        assert Decimal(str(comanda.valor_pago)) == Decimal("42")\n    finally:\n        db.close()\n        current_restaurante_id.reset(token)\n\n\ndef test_f12_pagamento_provider_nao_pode_gerar_estorno_contabil_sem_reversao_real():\n    created = client.post(\n        "/auth/smartpos/payment-intents",\n        headers=headers(),\n        json={\n            "mesa_id": 4,\n            "valor": "42.00",\n            "metodo": "pix",\n            "escopo": "valor",\n            "idempotency_key": "f12-provider-refund-create",\n        },\n    )\n    intent_id = created.json()["id"]\n    prepared = client.post(\n        f"/auth/smartpos/payment-intents/{intent_id}/preparar-terminal",\n        headers=headers(),\n        json={\n            "provider": "pagbank",\n            "operation_key": "f12-provider-refund-op",\n            "terminal_id": "terminal-f12-refund",\n        },\n    )\n    assert prepared.status_code == 200, prepared.text\n    approved = client.post(\n        f"/auth/smartpos/payment-intents/{intent_id}/resultado-terminal",\n        headers=headers(),\n        json={\n            "provider": "pagbank",\n            "operation_key": "f12-provider-refund-op",\n            "terminal_id": "terminal-f12-refund",\n            "outcome": "approved",\n            "reference": "provider-f12-approved",\n        },\n    )\n    assert approved.status_code == 200, approved.text\n    payment_id = approved.json()["payment_id"]\n    assert payment_id\n\n    listing = client.get(\n        "/auth/caixa/pagamentos/estornaveis",\n        headers=caixa_headers(),\n    )\n    assert listing.status_code == 200, listing.text\n    assert payment_id not in {str(row["id"]) for row in listing.json()}\n\n    refund = client.post(\n        f"/auth/caixa/pagamentos/{payment_id}/estornar",\n        headers=caixa_headers(),\n        json={\n            "valor": "42.00",\n            "motivo": "Tentativa sem reversão no provider.",\n            "idempotency_key": "f12-provider-refund-block",\n            "metodo_devolucao": "pix",\n        },\n    )\n    assert refund.status_code == 409, refund.text\n    assert "provider" in refund.json()["detail"].lower()\n\n    token = current_restaurante_id.set(RESTAURANTE_ID)\n    db = SessionLocal()\n    try:\n        assert db.query(PagamentoEstorno).filter(\n            PagamentoEstorno.restaurante_id == RESTAURANTE_ID,\n            PagamentoEstorno.pagamento_id == payment_id,\n        ).count() == 0\n    finally:\n        db.close()\n        current_restaurante_id.reset(token)\n'''
          anchor = '\n\ndef test_estado_terminal_exige_novo_intent_para_nova_tentativa():'
          if insertion.strip() not in tests:
              if anchor not in tests:
                  raise RuntimeError('F12 test insertion anchor not found')
              tests = tests.replace(anchor, insertion + anchor, 1)
          test_path.write_text(tests, encoding='utf-8')

      - name: Validate patch syntax
        run: |
          git diff --check
          python -m py_compile \
            backend/app/routes/smartpos.py \
            backend/app/routes/smartpos_provider.py \
            backend/app/routes/financial_refund_listing.py \
            backend/app/services/refund_guard.py

      - name: Commit F12
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/routes/smartpos.py \
            backend/app/routes/smartpos_provider.py \
            backend/app/routes/financial_refund_listing.py \
            backend/app/services/refund_guard.py \
            backend/tests/test_smartpos_payment_intent_preview.py \
            src/smartpos/SmartPosPaymentFlow.tsx
          git commit -m "feat(smartpos): add safe cancellation and refund recovery"
          git push origin HEAD:feat/smartpos-f12-recovery-refunds
