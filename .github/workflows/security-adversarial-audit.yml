name: Koma Security Adversarial Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/tools/security_adversarial_audit.py'
      - 'backend/tools/security_a_db_assertions.py'
      - 'backend/alembic/versions/**'
      - '.github/workflows/security-adversarial-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      SECRET_KEY: security-audit-secret-key-2026-only-for-ci
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      AUDIT_ADMIN_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/koma_security
      DATABASE_URL: postgresql+psycopg2://koma_audit_runtime:audit-runtime-password@127.0.0.1:5432/koma_security
      MIGRATION_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/koma_security
      DB_POOL_SIZE: '10'
      DB_MAX_OVERFLOW: '15'
      DB_POOL_TIMEOUT: '20'
      KOMA_SECURITY_AUDIT_REPORT: security-audit-report.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt

      - name: Create isolated database and Supabase-compatible roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN BYPASSRLS;
            END IF;
          END
          $$;
          DROP DATABASE IF EXISTS koma_security WITH (FORCE);
          CREATE DATABASE koma_security;
          SQL

      - name: Migrate isolated PostgreSQL to current head
        working-directory: backend
        run: python -m alembic -c alembic.ini upgrade head

      - name: Create least-privilege runtime login for the audit
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d koma_security -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'koma_audit_runtime') THEN
              DROP ROLE koma_audit_runtime;
            END IF;
            CREATE ROLE koma_audit_runtime
              LOGIN PASSWORD 'audit-runtime-password'
              NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS INHERIT;
          END
          $$;
          GRANT CONNECT ON DATABASE koma_security TO koma_audit_runtime;
          GRANT koma_app TO koma_audit_runtime;
          SQL

      - name: Run five-tenant busy-day and adversarial audit
        run: PYTHONPATH=backend python backend/tools/security_adversarial_audit.py

      - name: Enforce Security A database invariants
        run: PYTHONPATH=backend python backend/tools/security_a_db_assertions.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koma-security-adversarial-audit-${{ github.run_id }}
          path: security-audit-report.json
          if-no-files-found: warn
          retention-days: 14
