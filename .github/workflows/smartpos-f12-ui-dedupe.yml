name: SmartPOS F12 UI dedupe

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/smartpos-f12-recovery-refunds'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/smartpos-f12-recovery-refunds
      - name: Remove duplicated cancellation state
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/smartpos/SmartPosPaymentFlow.tsx')
          text = p.read_text(encoding='utf-8')
          duplicate = "  const [isCancelling, setIsCancelling] = useState(false);\n  const [isCancelling, setIsCancelling] = useState(false);\n"
          single = "  const [isCancelling, setIsCancelling] = useState(false);\n"
          if duplicate in text:
              p.write_text(text.replace(duplicate, single, 1), encoding='utf-8')
          elif text.count(single) != 1:
              raise RuntimeError('unexpected isCancelling declaration count')
      - run: git diff --check
      - name: Commit UI fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/smartpos/SmartPosPaymentFlow.tsx
          git commit -m "fix(smartpos): deduplicate cancellation UI state"
          git push origin HEAD:feat/smartpos-f12-recovery-refunds
