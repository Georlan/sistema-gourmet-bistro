name: One-off cashier UX refinement

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/chatgpt-cashier-ux-pass.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply focused UX changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          def replace_between(text: str, start: str, end: str, replacement: str, label: str) -> str:
              start_at = text.find(start)
              if start_at < 0:
                  raise SystemExit(f"{label}: start marker not found")
              end_at = text.find(end, start_at)
              if end_at < 0:
                  raise SystemExit(f"{label}: end marker not found")
              return text[:start_at] + replacement + text[end_at:]

          # Remove the separate online-order exception UI. Cancellation now
          # belongs to the regular card detail flow.
          main_path = Path('src/main.tsx')
          main = main_path.read_text(encoding='utf-8')
          main, count = re.subn(
              r'const OnlineOrderEmergencyActions = isSmartPosRoute\n\s*\? null\n\s*: React\.lazy\(\(\) => import\("\.\/components\/OnlineOrderEmergencyActions"\)\);\n',
              '',
              main,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'emergency component declaration: expected 1, got {count}')
          main, count = re.subn(
              r'^\s*\{OnlineOrderEmergencyActions && <OnlineOrderEmergencyActions \/>\}\n',
              '',
              main,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit(f'emergency component render: expected 1, got {count}')
          main_path.write_text(main, encoding='utf-8')
          emergency_path = Path('src/components/OnlineOrderEmergencyActions.tsx')
          if emergency_path.exists():
              emergency_path.unlink()

          # Remove the visible network-status badge. Connectivity itself stays
          # internal so refresh/retry behavior continues to work normally.
          app_path = Path('src/App.tsx')
          app = app_path.read_text(encoding='utf-8')
          reconnect_pos = app.find("Reconectando...")
          if reconnect_pos < 0:
              raise SystemExit('network badge: Reconectando... not found')
          status_start = app.rfind('<div className={clsx(', 0, reconnect_pos)
          if status_start < 0:
              raise SystemExit('network badge: status div not found')
          status_line_start = app.rfind('\n', 0, status_start) + 1
          status_end = app.find('</div>', reconnect_pos)
          if status_end < 0:
              raise SystemExit('network badge: status closing div not found')
          status_end += len('</div>')
          app = app[:status_line_start] + app[status_end:]
          if 'Reconectando...' in app:
              raise SystemExit('network badge: reconnecting copy remains')
          app_path.write_text(app, encoding='utf-8')

          caixa_path = Path('src/components/CaixaPanel.tsx')
          caixa = caixa_path.read_text(encoding='utf-8')

          # Navigation and visible connection noise.
          caixa = replace_once(
              caixa,
              "      { id: 'impressao_salao', label: 'Salão e impressão', icon: Printer },",
              "      { id: 'impressao_salao', label: 'Configurações', icon: SlidersHorizontal },",
              'settings nav label',
          )
          caixa = caixa.replace("&& 'Configurações do Salão'", "&& 'Configurações'")
          caixa, online_count = re.subn(
              r'^\s*<span><i /> Sistema online</span>\n',
              '',
              caixa,
              flags=re.MULTILINE,
