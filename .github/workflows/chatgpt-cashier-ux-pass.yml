                  <div className="flex justify-between"><dt>Pix informado</dt><dd className="font-bold tabular-nums text-koma-foreground">{formatMoney(Number(declaradoPix || 0))}</dd></div>
                </dl>
              </div>
            )}

            <div className="mt-4 flex gap-2">
              <button type="button" onClick={() => setShowConfirmModal(false)} disabled={isSubmitting} className="flex-1 rounded-xl border border-koma-border-subtle bg-koma-panel px-3 py-3 text-xs font-bold text-koma-secondary hover:text-koma-foreground disabled:opacity-50">Voltar</button>
              <button type="button" onClick={handleExecuteFechamento} disabled={isSubmitting} className="inline-flex flex-1 items-center justify-center gap-2 rounded-xl border border-emerald-500/40 bg-emerald-600 px-3 py-3 text-xs font-bold text-white hover:bg-emerald-500 disabled:opacity-50">
                <Check size={15} /> {isSubmitting ? 'Fechando...' : 'Fechar caixa'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
'''
          open_start = closing.rfind('  return (\n    <div className="cashier-fluid-view closing-workspace grid')
          if open_start < 0:
              raise SystemExit('closing open return not found')
          component_end = closing.rfind('\n};')
          if component_end < open_start:
              raise SystemExit('closing component end not found')
          closing = closing[:open_start] + open_return + closing[component_end:]
          closing_path.write_text(closing, encoding='utf-8')

          # Final regression guards for the visible concepts removed by this pass.
          sources = {
              'app': app_path.read_text(encoding='utf-8'),
              'caixa': caixa_path.read_text(encoding='utf-8'),
              'turno': turno_path.read_text(encoding='utf-8'),
              'refund': refund_path.read_text(encoding='utf-8'),
              'closing': closing_path.read_text(encoding='utf-8'),
          }
          forbidden = {
              'Reconectando...': ('app',),
              'Sistema online': ('caixa',),
              'Tentar sincronizar': ('turno',),
              'Sincronização reconectando': ('turno',),
              'Estornar recebimento': ('refund',),
              'Confirmar estorno': ('refund',),
              'Preencher esperados': ('closing',),
              'Conferência assistida': ('closing',),
          }
          for phrase, files in forbidden.items():
              for key in files:
                  if phrase in sources[key]:
                      raise SystemExit(f'forbidden visible copy remains in {key}: {phrase}')
          if "label: 'Cardápio digital'" in sources['caixa']:
              raise SystemExit('ambiguous digital menu sidebar label remains')
          if 'Salão e impressão' in sources['caixa']:
              raise SystemExit('old settings label remains')
          if 'Conferência rápida' not in sources['closing'] or 'Conferência cega' not in sources['closing']:
              raise SystemExit('closing modes were not installed')
