              "                    { label: 'fechamento no app', value: permCloseAccount ? 'Permitido' : 'Bloqueado' },\n                    { label: 'integrações pendentes', value: 7 }\n",
              "                    { label: 'fechamento no app', value: permCloseAccount ? 'Permitido' : 'Bloqueado' }\n",
              'waiter settings metrics',
          )
          caixa = caixa.replace('                  eyebrow="SALÃO / TAXA DE SERVIÇO"', '                  eyebrow="CONFIGURAÇÕES / SERVIÇO"')
          caixa = caixa.replace('                  title="Taxa"', '                  title="Taxa de serviço"')
          caixa = caixa.replace('                  description="A regra é única para o salão e chega ao fechamento sem cálculo paralelo."', '                  description="Defina uma regra única para o salão e para o fechamento."')
          caixa = replace_once(
              caixa,
              "                    { label: 'percentual padrão', value: taxaServicoAtiva ? `${serviceTaxRate}%` : '—' },\n                    { label: 'aplicação', value: 'Fechamento' },\n                    { label: 'alcance', value: 'Caixa e salão' }\n",
              "                    { label: 'percentual padrão', value: taxaServicoAtiva ? `${serviceTaxRate}%` : '—' },\n                    { label: 'alcance', value: 'Caixa e salão' }\n",
              'service fee metrics',
          )

          # Product cards: name/price are primary. Ingredients and description
          # stay available on hover or by clicking the detail icon.
          product_start_token = '                    {filteredProducts.map((p) => {'
          product_end_token = '                    )})}\n                  </div>'
          product_start = caixa.find(product_start_token)
          if product_start < 0:
              raise SystemExit('product cards: start not found')
          product_end = caixa.find(product_end_token, product_start)
          if product_end < 0:
              raise SystemExit('product cards: end not found')
          product_end += len('                    )})}')
          new_product_block = '''                    {filteredProducts.map((p) => {
                      const productLabel = splitProductLabel(p.nome);
                      const productDetailKey = String(p.id);
                      const hasProductDetails = Boolean(p.descricao || productLabel.code);
                      return (
                        <div
