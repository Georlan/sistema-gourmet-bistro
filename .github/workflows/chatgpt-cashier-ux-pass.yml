name: Human-centered operations UX patch source

on:
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Patch source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          def replace_between(text: str, start: str, end: str, replacement: str, label: str) -> str:
              start_at = text.find(start)
              if start_at < 0:
                  raise SystemExit(f"{label}: start marker not found")
              end_at = text.find(end, start_at)
              if end_at < 0:
                  raise SystemExit(f"{label}: end marker not found")
              return text[:start_at] + replacement + text[end_at:]

          # ------------------------------------------------------------------
          # One interaction model for order cards; no parallel exception widget.
          # ------------------------------------------------------------------
          main_path = Path('src/main.tsx')
          main = main_path.read_text(encoding='utf-8')
          main, declaration_count = re.subn(
              r'const OnlineOrderEmergencyActions = isSmartPosRoute\n\s*\? null\n\s*: React\.lazy\(\(\) => import\("\.\/components\/OnlineOrderEmergencyActions"\)\);\n',
              '',
              main,
              count=1,
          )
          if declaration_count != 1:
              raise SystemExit(f'emergency component declaration: expected 1, got {declaration_count}')
          main, render_count = re.subn(
              r'^\s*\{OnlineOrderEmergencyActions && <OnlineOrderEmergencyActions \/>\}\n',
              '',
              main,
              count=1,
              flags=re.MULTILINE,
          )
          if render_count != 1:
              raise SystemExit(f'emergency component render: expected 1, got {render_count}')
          main_path.write_text(main, encoding='utf-8')
          emergency_path = Path('src/components/OnlineOrderEmergencyActions.tsx')
          if emergency_path.exists():
              emergency_path.unlink()

          # ------------------------------------------------------------------
          # Realtime is infrastructure, not operator UI.
          # ------------------------------------------------------------------
          app_path = Path('src/App.tsx')
          app = app_path.read_text(encoding='utf-8')
          reconnect_pos = app.find('Reconectando...')
          if reconnect_pos >= 0:
              status_start = app.rfind('<div className={clsx(', 0, reconnect_pos)
              if status_start < 0:
                  raise SystemExit('network badge: status div not found')
              status_line_start = app.rfind('\n', 0, status_start) + 1
              status_end = app.find('</div>', reconnect_pos)
              if status_end < 0:
                  raise SystemExit('network badge: closing div not found')
              status_end += len('</div>')
              app = app[:status_line_start] + app[status_end:]
          app_path.write_text(app, encoding='utf-8')

          # ------------------------------------------------------------------
          # Cashier shell: intuitive labels, calmer headers, simpler new order,
          # unified cancellation and unambiguous menu naming.
          # ------------------------------------------------------------------
          caixa_path = Path('src/components/CaixaPanel.tsx')
          caixa = caixa_path.read_text(encoding='utf-8')

          caixa = replace_once(
              caixa,
              "      { id: 'impressao_salao', label: 'Salão e impressão', icon: Printer },",
              "      { id: 'impressao_salao', label: 'Configurações', icon: SlidersHorizontal },",
              'settings nav label',
          )
          caixa = replace_once(
              caixa,
              "      { id: 'cardapio_digital', label: 'Cardápio digital', icon: Globe }",
              "      { id: 'cardapio_digital', label: 'Cardápio online', icon: Globe }",
              'online menu nav label',
          )
          caixa = caixa.replace("&& 'Configurações do Salão'", "&& 'Configurações'")
          caixa = caixa.replace('Configurações do Cardápio Digital', 'Configurações do cardápio online')
