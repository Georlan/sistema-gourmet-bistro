          )

          old_operation_tabs = '''          {activeTab === 'operacao' && [
            { id: 'pedidos', label: 'Pedidos' },
            { id: 'balcao', label: 'Novo pedido' },
            { id: 'mesas', label: 'Salão' }
          ].map(sub => (
            <button
              key={sub.id}
              onClick={() => setActiveSubTab(sub.id)}
'''
          new_operation_tabs = '''          {activeTab === 'operacao' && [
            { id: 'pedidos', label: 'Pedidos' },
            { id: 'balcao', label: 'Novo pedido' },
            { id: 'mesas', label: 'Salão' }
