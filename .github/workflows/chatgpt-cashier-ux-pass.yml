          caixa = caixa.replace('                  eyebrow="SALÃO / TAXA DE SERVIÇO"', '                  eyebrow="CONFIGURAÇÕES / SERVIÇO"')

          # Product cards: keep the useful description, but reveal it on demand.
          product_start_token = '                    {filteredProducts.map((p) => {'
          product_end_token = '                    )})}\n                  </div>'
