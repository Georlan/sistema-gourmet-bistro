                isConnected={isWsConnected}
'''
          new_orders_banner = '''                eyebrow="OPERAÇÃO"
                title="Pedidos"
                accent="por etapa"
                description="Clique em qualquer card para ver detalhes e agir no pedido."
                metrics={[
                  { label: 'em produção', value: filteredCol1.length + filteredDigitalProduction.length },
