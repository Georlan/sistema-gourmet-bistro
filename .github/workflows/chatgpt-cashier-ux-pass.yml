              "                  { label: 'pagamentos pendentes', value: pagamentosPendentes.length, valueClassName: pagamentosPendentes.length > 0 ? 'text-amber-600 dark:text-amber-300' : 'text-emerald-600 dark:text-emerald-300' },\n                  { label: 'valor pendente', value: formatCompactCurrency(pendingPaymentsTotal) },\n",
              'closing metrics',
          )

          # Settings headers show only configuration facts that help a decision.
          caixa = caixa.replace('                  eyebrow="SALÃO / ORGANIZAÇÃO"', '                  eyebrow="CONFIGURAÇÕES / SALÃO"')
          caixa = caixa.replace('                  title="Mesas"\n                  accent="prontas para receber"', '                  title="Mesas"\n                  accent="organizadas"')
          caixa = caixa.replace('                  description="Capacidade e identificação do salão sem misturar configuração com comandas abertas."', '                  description="Cadastre nomes e capacidades; a operação usa essa mesma estrutura."')
          caixa = caixa.replace('                  eyebrow="SALÃO / APP DO GARÇOM"', '                  eyebrow="CONFIGURAÇÕES / EQUIPE"')
          caixa = caixa.replace('                  title="Atendimento"\n                  accent="com autonomia controlada"', '                  title="App do garçom"\n                  accent="com regras claras"')
          caixa = caixa.replace('                  description="Veja rapidamente o que a equipe pode fazer antes de ajustar cada permissão."', '                  description="Controle apenas o que a equipe pode fazer durante o atendimento."')
          caixa = replace_once(
