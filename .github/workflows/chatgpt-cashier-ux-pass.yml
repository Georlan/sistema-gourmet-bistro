      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Commit validated UX refinement
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git rm .github/workflows/chatgpt-cashier-ux-pass.yml
          git add -A
          git commit -m "feat: simplify cashier order workflows"
          git push origin HEAD:main
