name: Hotfix mobile orders operational labels one-shot

on:
  push:
    branches:
      - fix/mobile-orders-operational-labels
    paths:
      - .github/workflows/hotfix-mobile-orders-labels-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-orders-operational-labels
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact responsive information-preservation patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          caixa_path = Path('src/components/CaixaPanel.tsx')
          caixa = caixa_path.read_text(encoding='utf-8')
          old_label = '<span>Autoaceite online</span>'
          new_label = '<span className="orders-auto-accept__label">Aceitar pedidos online automaticamente</span>'
          assert caixa.count(old_label) == 1, f'expected one legacy autoaccept label, found {caixa.count(old_label)}'
          caixa = caixa.replace(old_label, new_label, 1)
          caixa_path.write_text(caixa, encoding='utf-8')

          css_path = Path('src/index.css')
          css = css_path.read_text(encoding='utf-8')
          hidden_search = "  .orders-search__result {\n    display: none;\n  }\n"
          assert css.count(hidden_search) == 1, f'expected one hidden search-result rule, found {css.count(hidden_search)}'
          css = css.replace(hidden_search, '', 1)

          old_mobile = "  .orders-toolbar__actions {\n    width: 100%;\n    gap: 0.55rem;\n  }\n\n  .orders-auto-accept > span:last-child,\n  .orders-delivery-total {\n    display: none;\n  }\n\n  .orders-new-orders {\n    margin-left: auto;\n  }\n"
          new_mobile = "  .orders-toolbar__actions {\n    width: 100%;\n    display: grid;\n    grid-template-columns: minmax(0, 1fr) auto;\n    align-items: center;\n    gap: 0.55rem 0.75rem;\n  }\n\n  .orders-auto-accept {\n    min-width: 0;\n    white-space: normal;\n  }\n\n  .orders-switch {\n    flex: 0 0 auto;\n  }\n\n  .orders-auto-accept__label {\n    min-width: 0;\n    line-height: 1.25;\n    white-space: normal;\n  }\n\n  .orders-delivery-total {\n    grid-column: 1 / -1;\n    justify-self: start;\n    padding-left: 0;\n    border-left: 0;\n  }\n\n  .orders-new-orders {\n    margin-left: 0;\n    justify-self: end;\n  }\n"
          assert css.count(old_mobile) == 1, f'expected one legacy mobile actions block, found {css.count(old_mobile)}'
          css = css.replace(old_mobile, new_mobile, 1)
          css_path.write_text(css, encoding='utf-8')

          test_path = Path('backend/tests/test_ui_theme_csp_stage4.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '\ndef test_temporary_stage4_patch_workflows_are_not_part_of_runtime_branch():\n'
          assert tests.count(marker) == 1
          regression = (
              '\n\ndef test_mobile_orders_toolbar_preserves_operational_information_instead_of_hiding_it():\n'
              '    css = source("src/index.css")\n'
              '    caixa = source("src/components/CaixaPanel.tsx")\n\n'
              '    assert "Aceitar pedidos online automaticamente" in caixa\n'
              '    assert \'className="orders-auto-accept__label"\' in caixa\n'
              '    assert \'aria-label="Aceitar pedidos online automaticamente"\' in caixa\n\n'
              '    # Responsividade deve reorganizar o toolbar, não remover significado.\n'
              '    assert ".orders-auto-accept > span:last-child" not in css\n'
              '    assert ".orders-search__result {\\n    display: none;" not in css\n'
              '    assert ".orders-delivery-total {\\n    display: none;" not in css\n\n'
              '    assert "grid-template-columns: minmax(0, 1fr) auto;" in css\n'
              '    assert ".orders-auto-accept__label" in css\n'
              '    assert "white-space: normal;" in css\n'
              '    assert "grid-column: 1 / -1;" in css\n'
          )
          assert 'def test_mobile_orders_toolbar_preserves_operational_information_instead_of_hiding_it():' not in tests
          tests = tests.replace(marker, regression + marker, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Run isolated responsive regressions
        run: |
          python3 <<'PY'
          import runpy
          ns = runpy.run_path('backend/tests/test_ui_theme_csp_stage4.py')
          ns['test_mobile_orders_toolbar_preserves_operational_information_instead_of_hiding_it']()
          ns['test_orders_kanban_has_no_desktop_breakpoint_gap_that_hides_closing_column']()
          PY

      - name: Commit verified hotfix and remove one-shot workflow
        run: |
          git config user.name "Georlan"
          git config user.email "129700145+Georlan@users.noreply.github.com"
          git rm .github/workflows/hotfix-mobile-orders-labels-one-shot.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(ui): preserva informações operacionais no mobile"
          git push origin HEAD:fix/mobile-orders-operational-labels
