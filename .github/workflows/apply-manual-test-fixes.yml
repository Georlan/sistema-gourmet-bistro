name: Apply manual test fixes

on:
  push:
    branches:
      - chatgpt/manual-test-fixes-20260824-work
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/manual-test-fixes-20260824-work
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Apply fixes
        run: python scripts/apply_manual_test_fixes.py

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Frontend unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Targeted backend regression
        run: |
          python -m pytest -q backend/tests/test_ui_theme_csp_stage4.py
          python -m pytest -q backend/tests -k "refund or estorno or pagamento_mesa" --maxfail=1

      - name: Remove temporary runner
        run: |
          rm -f scripts/apply_manual_test_fixes.py
          rm -f .github/workflows/apply-manual-test-fixes.yml

      - name: Commit validated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "fix: stabilize manual operational flows"
          git push origin HEAD:chatgpt/manual-test-fixes-20260824-work
