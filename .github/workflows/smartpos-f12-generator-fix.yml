name: SmartPOS F12 generator fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/smartpos-f12-recovery-refunds'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/smartpos-f12-recovery-refunds
      - name: Fix EOF generation
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/smartpos-f12-oneshot.yml')
          text = p.read_text(encoding='utf-8')
          old = "smartpos_path.write_text(smartpos.rstrip() + cancellation + '\\n', encoding='utf-8')"
          new = "smartpos_path.write_text(smartpos.rstrip() + cancellation.rstrip() + '\\n', encoding='utf-8')"
          if old in text:
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise RuntimeError('F12 generator EOF anchor not found')
      - name: Commit generator fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/smartpos-f12-oneshot.yml
          git commit -m "chore: fix F12 patch generator EOF"
          git push origin HEAD:feat/smartpos-f12-recovery-refunds
