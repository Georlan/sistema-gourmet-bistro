name: Secret history scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '41 9 * * 1'
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  schedule-gate:
    name: Check recent main activity
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.activity.outputs.run }}
    steps:
      - name: Checkout main head
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Check for commits in last 8 days
        id: activity
        run: |
          if [ -n "$(git log -1 --since='8 days ago' --format=%H)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new commits on main in the last 8 days; skipping weekly scheduled secret scan."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  gitleaks:
    name: Gitleaks secret scan
    needs: [schedule-gate]
    if: always() && !cancelled() && (needs.schedule-gate.result == 'skipped' || (needs.schedule-gate.result == 'success' && needs.schedule-gate.outputs.run == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan tracked files and Git history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
