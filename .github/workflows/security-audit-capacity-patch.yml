name: Security audit capacity harness patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'audit/security-five-tenants-2026-08-19'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Record capacity failures without aborting audit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/tools/security_adversarial_audit.py')
          text = p.read_text()
          old = '            assert response.status_code == 200, (rid, path, response.status_code, response.text[:300])'
          new = '''            if response.status_code != 200:
                finding(
                    "BUSY_DAY_CAPACITY_FAILURE",
                    "HIGH",
                    "Concurrent restaurant traffic exhausted backend database capacity",
                    f"tenant={rid} path={path} returned HTTP {response.status_code}: {response.text[:160]}",
                    once=True,
                )
                return elapsed'''
          if old not in text:
              raise SystemExit('capacity assert not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/tools/security_adversarial_audit.py
          git diff --cached --quiet && exit 0
          git commit -m 'test(security): record capacity failures and continue audit'
          git push
