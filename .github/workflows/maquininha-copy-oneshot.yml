name: Maquininha copy one shot

on:
  push:
    branches:
      - fix/maquininha-copy

permissions:
  contents: write

concurrency:
  group: maquininha-copy-oneshot
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: trigger maquininha copy patch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/maquininha-copy
          fetch-depth: 0

      - name: Replace operator-facing SmartPOS copy
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('src/components/CaixaPanel.tsx'): {
                  "label: 'SMARTPOS · FINALIZANDO'": "label: 'MAQUININHA · FINALIZANDO'",
                  "label: 'SMARTPOS · ATENÇÃO'": "label: 'MAQUININHA · ATENÇÃO'",
                  "label: 'SMARTPOS · PROCESSANDO'": "label: 'MAQUININHA · PROCESSANDO'",
                  "label: 'SMARTPOS'": "label: 'MAQUININHA'",
              },
              Path('smartpos-android/app/src/main/kotlin/br/com/koma/smartpos/dev/MainActivity.kt'): {
                  'text = "Kôma SmartPOS"': 'text = "Kôma Maquininha"',
                  'text = "Entrar no SmartPOS"': 'text = "Entrar na maquininha"',
                  'text = "Faça login para carregar o contexto SmartPOS."': 'text = "Faça login para carregar o contexto da maquininha."',
                  'require(loadedContext.smartposEnabled) { "SmartPOS não está habilitado para este restaurante." }': 'require(loadedContext.smartposEnabled) { "A maquininha não está habilitada para este restaurante." }',
                  'status.text = "Sessão SmartPOS carregada. Terminal: $terminalId\\n" +': 'status.text = "Sessão da maquininha carregada. Terminal: $terminalId\\n" +',
              },
          }

          for path, mapping in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  count = text.count(old)
                  if count != 1:
                      raise RuntimeError(f'{path}: expected one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit copy change and remove temporary harness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/maquininha-copy-oneshot.yml
          rm -f scripts/maquininha-copy-trigger.txt
          git add -A
          git diff --cached --check
          git commit -m "fix(ux): call SmartPOS maquininha in operator UI"
          git push origin HEAD:fix/maquininha-copy
