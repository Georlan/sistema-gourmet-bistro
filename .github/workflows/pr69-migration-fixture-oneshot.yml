name: PR69 Migration Fixture One Shot

on:
  push:
    branches:
      - agent/smartpos-no-hardware-hardening

permissions:
  contents: write

concurrency:
  group: pr69-migration-fixture-oneshot
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/smartpos-no-hardware-hardening
          fetch-depth: 0

      # This workflow exists only long enough to patch the large validation file.
      - name: Patch migration fixture
        run: python scripts/patch_migration_fixture_pr69.py

      - name: Commit final fixture fix and remove temporary harness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/pr69-migration-fixture-oneshot.yml
          rm scripts/patch_migration_fixture_pr69.py
          rm -f scripts/pr69-migration-trigger.txt
          git add -A
          git diff --cached --check
          git commit -m "test(migrations): decouple legacy fixture from current ORM"
          git push origin HEAD:agent/smartpos-no-hardware-hardening
