name: Transfer concurrency PostgreSQL
on:
  pull_request:
    paths:
      - 'backend/app/routes/atendimentos.py'
      - 'backend/app/services/atendimentos.py'
      - 'backend/tests/test_transfer*.py'
      - '.github/workflows/transfer-concurrency.yml'
permissions:
  contents: read
jobs:
  concurrency:
    name: PostgreSQL transfer races
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: transfer_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests/test_transfer_postgres_concurrency.py backend/tests/test_transfer_database_conflicts.py -q
        env:
          ENVIRONMENT: test
          SECRET_KEY: local-test-only
          ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          PYTHONPATH: backend
          KOMA_CONCURRENCY_DATABASE_URL: postgresql+psycopg2://postgres:local-test-only@127.0.0.1:5432/transfer_tests
