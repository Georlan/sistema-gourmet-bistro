name: SmartPOS F11 reservation fix one shot

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/smartpos-f11-split-payments'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/smartpos-f11-split-payments
      - name: Prioritize item reservation conflict
        shell: python
        run: |
          from pathlib import Path
          p = Path('backend/app/routes/smartpos.py')
          text = p.read_text(encoding='utf-8')
          old = '''    reservado = sum(\n        (_money(active_intent.valor) for active_intent in reserving_intents),\n        Decimal("0.00"),\n    )\n    disponivel = max(Decimal("0.00"), saldo - reservado)\n    if disponivel <= 0:\n        raise HTTPException(\n            status_code=status.HTTP_409_CONFLICT,\n            detail="O saldo da mesa já está reservado por pagamento em andamento.",\n        )\n    if valor > disponivel:\n        raise HTTPException(\n            status_code=status.HTTP_409_CONFLICT,\n            detail=(\n                "O valor excede o saldo disponível após considerar pagamentos em andamento. "\n                f"Disponível: {disponivel}."\n            ),\n        )\n\n    if payload.escopo == "itens":\n        if not normalized_items:\n            raise HTTPException(\n                status_code=status.HTTP_422_UNPROCESSABLE_ENTITY,\n                detail="Selecione ao menos um item para receber por itens.",\n            )\n        reserved_item_ids = {\n            item_id\n            for active_intent in reserving_intents\n            if active_intent.escopo == "itens"\n            for item_id in (active_intent.item_ids or [])\n        }\n        if any(item_id in reserved_item_ids for item_id in normalized_items):\n            raise HTTPException(\n                status_code=status.HTTP_409_CONFLICT,\n                detail="Um ou mais itens já estão reservados por outro pagamento em andamento.",\n            )\n'''
          new = '''    if payload.escopo == "itens" and not normalized_items:\n        raise HTTPException(\n            status_code=status.HTTP_422_UNPROCESSABLE_ENTITY,\n            detail="Selecione ao menos um item para receber por itens.",\n        )\n\n    reserved_item_ids = {\n        item_id\n        for active_intent in reserving_intents\n        if active_intent.escopo == "itens"\n        for item_id in (active_intent.item_ids or [])\n    }\n    if payload.escopo == "itens" and any(\n        item_id in reserved_item_ids for item_id in normalized_items\n    ):\n        raise HTTPException(\n            status_code=status.HTTP_409_CONFLICT,\n            detail="Um ou mais itens já estão reservados por outro pagamento em andamento.",\n        )\n\n    reservado = sum(\n        (_money(active_intent.valor) for active_intent in reserving_intents),\n        Decimal("0.00"),\n    )\n    disponivel = max(Decimal("0.00"), saldo - reservado)\n    if disponivel <= 0:\n        raise HTTPException(\n            status_code=status.HTTP_409_CONFLICT,\n            detail="O saldo da mesa já está reservado por pagamento em andamento.",\n        )\n    if valor > disponivel:\n        raise HTTPException(\n            status_code=status.HTTP_409_CONFLICT,\n            detail=(\n                "O valor excede o saldo disponível após considerar pagamentos em andamento. "\n                f"Disponível: {disponivel}."\n            ),\n        )\n\n    if payload.escopo == "itens":\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise RuntimeError('reservation block anchor not found')
          p.write_text(text, encoding='utf-8')
      - run: |
          git diff --check
          python -m py_compile backend/app/routes/smartpos.py
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/routes/smartpos.py
          git commit -m "fix(smartpos): distinguish item reservation conflicts"
          git push origin HEAD:feat/smartpos-f11-split-payments
