name: SuperAdmin Phase 3 Billing Gate

on:
  pull_request:
    paths:
      - "src/super-admin/SuperAdminBillingTab.tsx"
      - "src/config/subscriptionPlans.ts"
      - "tests/superAdminPhase3Billing.test.ts"
      - "backend/app/subscription.py"
      - "backend/app/subscription_models.py"
      - "backend/app/routes/__init__.py"
      - "backend/app/routes/super_admin.py"
      - "backend/app/routes/super_admin_billing.py"
      - "backend/alembic/versions/3c4d5e6f7a8b_add_restaurant_subscriptions_phase3.py"
      - "backend/tests/test_super_admin_billing_phase3.py"
      - "backend/tests/test_commercial_pricing_sync.py"
      - ".github/workflows/superadmin-phase3-billing-gate.yml"

permissions:
  contents: read

jobs:
  phase3-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: test
      SECRET_KEY: superadmin-phase3-ci-secret-key
      ENCRYPTION_KEY: dgvrWayyUxrh0PjzBcjn1AJ5woxjUE3lLTRptHDUSEQ=
      DATABASE_URL: sqlite:///./superadmin-phase3-ci.db
      MIGRATION_DATABASE_URL: sqlite:///./superadmin-phase3-ci.db
      SUPERADMIN_USERNAME: owner-ci@example.test
      SUPERADMIN_PASSWORD_HASH: unused-because-tests-override-it
      PYTHONPATH: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Compile billing modules
        run: |
          python -m py_compile backend/app/subscription.py
          python -m py_compile backend/app/subscription_models.py
          python -m py_compile backend/app/routes/super_admin_billing.py
          python -m py_compile backend/app/routes/__init__.py

      - name: Run Phase 3 billing acceptance suite
        run: |
          python -m pytest -q \
            backend/tests/test_super_admin_billing_phase3.py \
            backend/tests/test_commercial_pricing_sync.py \
            backend/tests/test_route_ownership.py

  phase3-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build
