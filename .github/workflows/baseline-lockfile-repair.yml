name: Baseline lockfile repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/baseline-lockfile-repair.yml

permissions:
  contents: write

jobs:
  repair-browserslist-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Update only Browserslist lock graph
        run: npm update browserslist --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify high severity audit is clean
        run: npm audit --audit-level=high

      - name: Verify package manifest was not changed
        run: git diff --exit-code -- package.json

      - name: Remove temporary generator workflow
        run: rm .github/workflows/baseline-lockfile-repair.yml

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/baseline-lockfile-repair.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No lockfile update was necessary."
            exit 0
          fi
          git commit -m "chore(security): refresh browserslist lock graph"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
