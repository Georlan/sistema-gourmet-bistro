name: Run final UX completion

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finish:
    if: github.head_ref == 'chatgpt/finish-ux-partials-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/finish-ux-partials-20260823
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply final UX fixes
        run: python scripts/chatgpt_finish_ux.py

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add -A
          git commit -m "UX: concluir simplificação operacional do caixa"
          git push origin HEAD:chatgpt/finish-ux-partials-20260823
