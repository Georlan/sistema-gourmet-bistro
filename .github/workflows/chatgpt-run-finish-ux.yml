name: Run final UX completion

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finish:
    if: github.head_ref == 'chatgpt/finish-ux-partials-20260823'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/finish-ux-partials-20260823
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply final UX fixes
        run: python scripts/chatgpt_finish_ux.py

      - name: Remove obsolete closing refresh callback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/CaixaPanel.tsx')
          text = path.read_text(encoding='utf-8')
          old = """                onRefresh={async () => {
                  await Promise.all([
                    fetchTurnoResumo(),
                    onRefreshPagamentosPendentes?.(),
                  ]);
                }}
"""
          if text.count(old) != 1:
              raise SystemExit(f'closing refresh callback: expected 1 match, found {text.count(old)}')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add -A
          git commit -m "UX: concluir simplificação operacional do caixa"
          git push origin HEAD:chatgpt/finish-ux-partials-20260823
