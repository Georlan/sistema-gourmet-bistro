name: Browser Targeted Gate

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:

concurrency:
  group: browser-targeted-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  schedule-gate:
    name: Check recent main activity
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.activity.outputs.run }}
    steps:
      - name: Checkout main head
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Check for commits in last 26h
        id: activity
        run: |
          if [ -n "$(git log -1 --since='26 hours ago' --format=%H)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new commits on main in the last 26 hours; skipping nightly browser suite."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  browser-gate:
    name: Browser targeted regressions
    needs: [schedule-gate]
    if: always() && !cancelled() && (needs.schedule-gate.result == 'skipped' || (needs.schedule-gate.result == 'success' && needs.schedule-gate.outputs.run == 'true'))
    # Playwright 1.58.2 cannot install Chromium deps on ubuntu-26.04 runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check whether browser tests are needed
        id: precheck
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] || [ -z "$BASE_SHA" ]; then
            echo "run_browser=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          if git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(src/|e2e/|public/|index\.html$|vite\.config\.ts$|playwright\.config\.ts$|\.github/workflows/browser-targeted-gate\.yml$)'; then
            echo "run_browser=true" >> "$GITHUB_OUTPUT"
          else
            echo "No browser-facing files changed; skipping Playwright checks cleanly."
            echo "run_browser=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.precheck.outputs.run_browser == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache node_modules
        id: node_modules_cache
        if: steps.precheck.outputs.run_browser == 'true'
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.precheck.outputs.run_browser == 'true' && steps.node_modules_cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Route changed frontend paths to targeted E2E specs
        id: route
        if: steps.precheck.outputs.run_browser == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] || [ -z "$BASE_SHA" ]; then
            echo 'mode=full' >> "$GITHUB_OUTPUT"
            echo 'dev_specs=' >> "$GITHUB_OUTPUT"
            echo 'checkout_360=true' >> "$GITHUB_OUTPUT"
            echo 'preview_transfer=true' >> "$GITHUB_OUTPUT"
            echo 'preview_seo=true' >> "$GITHUB_OUTPUT"
            echo 'preview_recovery=true' >> "$GITHUB_OUTPUT"
            echo 'firefox_smoke=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"

          python3 - "$changed" <<'PY' >> "$GITHUB_OUTPUT"
          import os, sys

          files = [f.strip() for f in sys.argv[1].splitlines() if f.strip()]
          direct_specs = []
          domain_groups = []
          checkout_360 = False
          preview_transfer = False
          preview_seo = False
          preview_recovery = False

          preview_only_specs = {
              "e2e/cashier-transfer-conflict.spec.ts",
              "e2e/public-seo.spec.ts",
              "e2e/landing-demo-capture.spec.ts",
              "e2e/app-recovery.spec.ts",
              "e2e/analytics-ingestion.spec.ts",
              "e2e/checkout-money-clicks.spec.ts",
          }

          def add_group(specs):
              valid = [s for s in specs if os.path.exists(s) and s not in preview_only_specs]
              if valid and valid not in domain_groups:
                  domain_groups.append(valid)

          for f in files:
              if f.startswith("e2e/") and f.endswith(".spec.ts") and os.path.exists(f):
                  if f == "e2e/checkout-money-clicks.spec.ts":
                      checkout_360 = True
                  elif f == "e2e/cashier-transfer-conflict.spec.ts":
                      preview_transfer = True
                  elif f in {"e2e/public-seo.spec.ts", "e2e/landing-demo-capture.spec.ts"}:
                      preview_seo = True
                  elif f in {"e2e/app-recovery.spec.ts", "e2e/analytics-ingestion.spec.ts"}:
                      preview_recovery = True
                  elif f not in direct_specs:
                      direct_specs.append(f)

              if f.startswith(("src/cardapio/", "src/components/cardapio/")):
                  add_group([
                      "e2e/public-menu-order.spec.ts",
                      "e2e/cardapio-promotions.spec.ts",
                      "e2e/cardapio-draft-and-checkout.spec.ts",
                  ])

              if f.startswith(("src/components/caixa/pdv/", "src/components/caixa/checkout/")):
                  add_group([
                      "e2e/cashier-pdv-product-card.spec.ts",
                      "e2e/cashier-mixed-payment.spec.ts",
                      "e2e/cashier-delivery-new-order.spec.ts",
                  ])

              if f.startswith(("src/components/caixa/orders/", "src/components/courier/")) or f == "src/components/MotoboyPwaPage.tsx":
                  add_group([
                      "e2e/cashier-fulfillment-workspaces.spec.ts",
                      "e2e/cashier-delivery-stages.spec.ts",
                      "e2e/courier-realtime-cache.spec.ts",
                  ])
                  if "useCashierOrders.ts" in f:
                      preview_transfer = True

              if f.startswith(("src/components/caixa/customers/", "src/components/caixa/navigation/", "src/components/clientes/")):
                  add_group([
                      "e2e/relationship-navigation.spec.ts",
                      "e2e/customer-crm.spec.ts",
                  ])

              if f.startswith(("src/components/mesas/", "src/components/Mesa")) or f.startswith("src/domain/waiter"):
                  add_group([
                      "e2e/waiter-salon-wave1.spec.ts",
                      "e2e/waiter-projections.spec.ts",
                  ])

              if f.startswith(("src/components/onboarding/", "src/components/auth/")) or f == "src/utils/authSession.ts":
                  add_group([
                      "e2e/auth-persistence.spec.ts",
                      "e2e/onboarding-first-client-ux.spec.ts",
                  ])
                  if f == "src/components/auth/AppRecoveryBoundary.tsx":
                      preview_recovery = True
                  if f == "src/components/auth/TenantSuspensionBoundary.tsx":
                      add_group(["e2e/tenant-suspension-idle.spec.ts"])

              if f.startswith("src/components/printing/"):
                  add_group(["e2e/print-local-connection.spec.ts"])

              if f.startswith(("src/components/relatorios/", "src/components/caixa/reports/")):
                  add_group(["e2e/reports-practical.spec.ts"])

              if "Pix" in f or f in {"src/components/caixa/orders/DirectPixPendingPanel.tsx", "src/components/caixa/orders/pendingPixPolling.ts"}:
                  add_group(["e2e/direct-pix.spec.ts", "e2e/pagbank-connect.spec.ts"])

              if f.startswith(("src/components/caixa/online-menu/", "src/components/caixa/realtime/")):
                  add_group([
                      "e2e/online-control-idle.spec.ts",
                      "e2e/idle-reconciliation.spec.ts",
                  ])

              if f.startswith("src/legal/"):
                  checkout_360 = True

              if f.startswith(("src/landing/", "public/")) or f in {"scripts/prerenderLanding.ts", "index.html", "vite.config.ts"}:
                  preview_seo = True

              if f.startswith("src/analytics/"):
                  preview_recovery = True

          selected = list(direct_specs)
          if domain_groups:
              cap = 4 if len(domain_groups) > 1 else 3
              idx = 0
              while len(selected) < max(cap, len(direct_specs)):
                  progressed = False
                  for grp in domain_groups:
                      if idx < len(grp):
                          spec = grp[idx]
                          if spec not in selected:
                              selected.append(spec)
                          progressed = True
                          if len(selected) >= max(cap, len(direct_specs)):
                              break
                  if not progressed:
                      break
                  idx += 1

          if not (selected or checkout_360 or preview_transfer or preview_seo or preview_recovery):
              selected = [
                  s for s in (
                      "e2e/public-menu-order.spec.ts",
                      "e2e/cashier-pdv-product-card.spec.ts",
                  ) if os.path.exists(s)
              ]

          dev_list = sorted(set(selected))
          print("mode=targeted")
          print(f"dev_specs={' '.join(dev_list)}")
          print(f"checkout_360={'true' if checkout_360 else 'false'}")
          print(f"preview_transfer={'true' if preview_transfer else 'false'}")
          print(f"preview_seo={'true' if preview_seo else 'false'}")
          print(f"preview_recovery={'true' if preview_recovery else 'false'}")
          print("firefox_smoke=false")
          PY

      - name: Cache Playwright browsers (Chromium for PR, Chromium+Firefox for full)
        id: playwright-cache
        if: steps.precheck.outputs.run_browser == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.route.outputs.mode == 'full' && 'chromium-firefox' || 'chromium' }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers and OS deps
        if: steps.precheck.outputs.run_browser == 'true'
        run: |
          CHROME_BIN=$(find ~/.cache/ms-playwright -name chrome -type f 2>/dev/null | head -n 1 || true)
          if [ "${{ steps.route.outputs.mode }}" = "full" ]; then
            FIREFOX_BIN=$(find ~/.cache/ms-playwright -name firefox -type f 2>/dev/null | head -n 1 || true)
            if [ -z "$CHROME_BIN" ] || [ -z "$FIREFOX_BIN" ]; then
              npx playwright install --with-deps chromium firefox
            elif ! "$CHROME_BIN" --headless --no-sandbox --dump-dom about:blank >/dev/null 2>&1 || ldd "$FIREFOX_BIN" 2>/dev/null | grep -q "not found"; then
              npx playwright install-deps chromium firefox
            else
              echo "Chromium and Firefox binaries + OS deps verified from cache"
            fi
          else
            if [ -z "$CHROME_BIN" ]; then
              npx playwright install --with-deps chromium
            elif ! "$CHROME_BIN" --headless --no-sandbox --dump-dom about:blank >/dev/null 2>&1; then
              npx playwright install-deps chromium
            else
              echo "Chromium binary + OS deps verified from cache (skipped apt-get)"
            fi
          fi

      - name: Run targeted browser regressions (mobile-390 + desktop-1366)
        if: steps.route.outputs.mode == 'targeted' && steps.route.outputs.dev_specs != ''
        env:
          KOMA_E2E_PORT: '4283'
        run: >-
          npm run test:e2e --
          ${{ steps.route.outputs.dev_specs }}
          --project=mobile-390
          --project=desktop-1366
          --workers=4

      - name: Run checkout 360px + desktop smoke
        if: steps.route.outputs.checkout_360 == 'true'
        env:
          KOMA_E2E_PORT: '4284'
        run: >-
          npm run test:e2e --
          e2e/checkout-money-clicks.spec.ts
          --project=mobile-360
          --project=desktop-1366
          --workers=4

      - name: Run preview transfer conflict smoke
        if: steps.route.outputs.preview_transfer == 'true'
        env:
          KOMA_E2E_PORT: '4298'
          KOMA_E2E_PREVIEW: 'true'
        run: |
          npm run build
          npm run test:e2e -- e2e/cashier-transfer-conflict.spec.ts --project=mobile-390 --project=desktop-1366 --workers=4

      - name: Run preview SEO and auth smoke
        if: steps.route.outputs.preview_seo == 'true'
        env:
          KOMA_E2E_PORT: '4285'
          KOMA_E2E_PREVIEW: 'true'
        run: |
          npm run build
          npm run test:e2e -- e2e/public-seo.spec.ts e2e/auth-persistence.spec.ts e2e/landing-demo-capture.spec.ts --project=desktop-1366 --project=mobile-390 --workers=4

      - name: Run preview recovery and analytics smoke
        if: steps.route.outputs.preview_recovery == 'true'
        env:
          KOMA_E2E_PORT: '4297'
          KOMA_E2E_PREVIEW: 'true'
        run: |
          VITE_POSTHOG_PROJECT_TOKEN=phc_fixture_public_project \
          VITE_POSTHOG_HOST=http://127.0.0.1:7999 \
          npm run build
          npm run test:e2e -- e2e/app-recovery.spec.ts e2e/analytics-ingestion.spec.ts --project=mobile-390 --project=desktop-1366 --workers=4

      - name: Run comprehensive scheduled/manual E2E regression
        if: steps.route.outputs.mode == 'full'
        env:
          KOMA_E2E_PORT: '4283'
        run: |
          npm run test:e2e -- \
            e2e/public-menu-order.spec.ts \
            e2e/cardapio-promotions.spec.ts \
            e2e/cardapio-promotion-expiry.spec.ts \
            e2e/cardapio-promotion-mixed-cart.spec.ts \
            e2e/cardapio-foundation-accessibility.spec.ts \
            e2e/cardapio-draft-and-checkout.spec.ts \
            e2e/marmitaria-daily-menu.spec.ts \
            e2e/marmitaria-optional-salad.spec.ts \
            e2e/linked-complements.spec.ts \
            e2e/order-tracking-chat.spec.ts \
            e2e/cashier-pdv-product-card.spec.ts \
            e2e/cashier-mixed-payment.spec.ts \
            e2e/cashier-delivery-new-order.spec.ts \
            e2e/cashier-sale-recovery.spec.ts \
            e2e/cashier-fulfillment-workspaces.spec.ts \
            e2e/cashier-delivery-stages.spec.ts \
            e2e/cashier-fulfillment-conversion.spec.ts \
            e2e/courier-realtime-cache.spec.ts \
            e2e/auth-persistence.spec.ts \
            e2e/onboarding-first-client-ux.spec.ts \
            e2e/installed-pwa-auth-persistence.spec.ts \
            e2e/print-local-connection.spec.ts \
            e2e/reports-practical.spec.ts \
            e2e/direct-pix.spec.ts \
            e2e/pagbank-connect.spec.ts \
            e2e/waiter-salon-wave1.spec.ts \
            e2e/waiter-projections.spec.ts \
            e2e/waiter-sync.spec.ts \
            e2e/relationship-navigation.spec.ts \
            e2e/customer-crm.spec.ts \
            e2e/crm-api-contract.spec.ts \
            e2e/cashier-horizontal-navigation.spec.ts \
            e2e/whatsapp-marketing-consent.spec.ts \
            e2e/cardapio-whatsapp-optout.spec.ts \
            --project=mobile-390 \
            --project=desktop-1366 \
            --workers=4

          npm run test:e2e -- e2e/waiter-config-layout.spec.ts --project=mobile-360 --project=mobile-390 --project=mobile-412 --project=tablet-768 --project=desktop-1366 --workers=4
          npm run test:e2e -- e2e/tenant-suspension-idle.spec.ts e2e/online-control-idle.spec.ts e2e/idle-reconciliation.spec.ts --project=desktop-1366 --project=mobile-390 --project=tablet-768 --workers=4
          npm run test:e2e -- e2e/cardapio-mobile-layout.spec.ts --workers=4

      - name: Run Firefox preview smoke (scheduled/manual)
        if: steps.route.outputs.firefox_smoke == 'true'
        env:
          KOMA_E2E_PORT: '4288'
          KOMA_E2E_FIREFOX: 'true'
          KOMA_E2E_PREVIEW: 'true'
        run: |
          npm run build
          npm run test:e2e -- e2e/cardapio-artistic-parity.spec.ts --grep "contato preserva" --project=firefox-390 --workers=4

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-targeted-failures-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
