name: Hotfix remove addon suggestions

on:
  push:
    branches:
      - fix/remove-addon-suggestions

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-addon-suggestions
          fetch-depth: 0

      - name: Remove automatic addon suggestions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          frontend_path = Path('src/components/cardapio/ComplementosTab.tsx')
          frontend = frontend_path.read_text(encoding='utf-8')

          old_import = "import { Check, Edit3, Layers, Plus, Search, Sparkles, Trash2 } from 'lucide-react';"
          new_import = "import { Check, Edit3, Layers, Plus, Search, Trash2 } from 'lucide-react';"
          assert old_import in frontend, 'Sparkles import not found'
          frontend = frontend.replace(old_import, new_import, 1)

          state_line = "  const [syncingSuggestions, setSyncingSuggestions] = useState(false);\n"
          assert state_line in frontend, 'suggestions state not found'
          frontend = frontend.replace(state_line, '', 1)

          frontend, count = re.subn(
              r"\n  const handleApplySuggestions = async \(\) => \{.*?\n  \};\n\n  const handleSaveGrupo",
              "\n  const handleSaveGrupo",
              frontend,
              count=1,
              flags=re.S,
          )
          assert count == 1, 'suggestions handler not found'

          frontend, count = re.subn(
              r"\n          <button\n            type=\"button\"\n            onClick=\{handleApplySuggestions\}.*?\n          </button>",
              '',
              frontend,
              count=1,
              flags=re.S,
          )
          assert count == 1, 'suggestions button not found'

          old_empty = '            Use “Aplicar sugestões” para criar os 21 adicionais de hamburgueria ou cadastre um grupo manualmente.'
          new_empty = '            Cadastre os grupos e adicionais manualmente para manter o cardápio sob seu controle.'
          assert old_empty in frontend, 'suggestions empty-state copy not found'
          frontend = frontend.replace(old_empty, new_empty, 1)

          for forbidden in ('Aplicar sugestões', '/cardapio/modificadores/sugestoes/hamburgueria', 'handleApplySuggestions', 'syncingSuggestions'):
              assert forbidden not in frontend, f'frontend still contains {forbidden}'

          frontend_path.write_text(frontend, encoding='utf-8')

          backend_path = Path('backend/app/routes/modificadores.py')
          backend = backend_path.read_text(encoding='utf-8')
          import_line = '    ensure_hamburger_addon_suggestions,\n'
          assert import_line in backend, 'suggestions backend import not found'
          backend = backend.replace(import_line, '', 1)

          backend, count = re.subn(
              r"\n@router\.post\(\"/sugestoes/hamburgueria\"\)\ndef aplicar_sugestoes_hamburgueria\(.*?\n    return result\n\n",
              '\n',
              backend,
              count=1,
              flags=re.S,
          )
          assert count == 1, 'suggestions backend route not found'
          assert '/sugestoes/hamburgueria' not in backend
          assert 'ensure_hamburger_addon_suggestions' not in backend
          backend_path.write_text(backend, encoding='utf-8')

          Path('.github/workflows/hotfix-remove-addon-suggestions.yml').unlink()
          PY

      - name: Commit hotfix
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(cardapio): remover sugestões automáticas de complementos"
          git push origin HEAD:fix/remove-addon-suggestions
