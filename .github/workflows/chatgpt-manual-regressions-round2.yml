name: ChatGPT Manual Regression Round 2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.event.pull_request.head.ref == 'chatgpt/fix-manual-regressions-20260824'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply patch
        run: python scripts/_apply_manual_regressions_round2.py

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Commit validated product changes
        run: |
          rm scripts/_apply_manual_regressions_round2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CaixaPanel.tsx src/components/caixa/EstornoModal.tsx tests/manual_operational_regressions.test.ts scripts/_apply_manual_regressions_round2.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: stabilize manual order and refund interactions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
