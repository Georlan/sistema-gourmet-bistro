name: Product Contract Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'product-contract.json'
      - 'backend/app/services/plan_entitlements.py'
      - 'backend/app/services/product_contract.py'
      - 'backend/app/subscription.py'
      - 'backend/tests/test_product_contract_gate.py'
      - 'src/config/subscriptionPlans.ts'
      - 'src/components/caixa/navigation/**'
      - 'src/landing/sections/Plans.tsx'
      - 'src/legal/**'
      - 'tests/productContractGate.test.ts'
      - '.github/workflows/product-contract-gate.yml'
  workflow_dispatch:

concurrency:
  group: product-contract-gate-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract-compliance:
    name: Product contract cross-surface check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend product contract unit tests
        run: npx tsx --test tests/productContractGate.test.ts

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Backend product contract gate tests
        env:
          ENVIRONMENT: test
          SECRET_KEY: product-contract-gate-secret
          ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          PYTHONPATH: backend
        run: python -m pytest backend/tests/test_product_contract_gate.py -v
