name: Stage 3D dead checkout cleanup

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'audit/consistencia-financeira-etapa-3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Remove dead quick-actions checkout path
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/CaixaPanel.tsx')
          text = path.read_text(encoding='utf-8')

          def replace_exact(old: str, new: str, expected: int = 1):
              global text
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'Expected {expected} occurrence(s), found {count}: {old!r}')
              text = text.replace(old, new)

          replace_exact("import { ComandaActionsModal } from './ComandaActionsModal';\n", "")
          replace_exact("  const [quickActionsOrder, setQuickActionsOrder] = useState<Order | null>(null);\n", "")

          start_marker = "      {/* MODAL DE AÇÕES RÁPIDAS (RATEIO / DESCONTO / CHECKOUT) */}\n      <ComandaActionsModal\n"
          end_marker = "\n\n      {/* MODAL DE ENTRADA MANUAL DE ESTOQUE */}"
          if text.count(start_marker) != 1:
              raise SystemExit(f'Expected one quick-actions block start, found {text.count(start_marker)}')
          if text.count(end_marker) != 1:
              raise SystemExit(f'Expected one stock modal marker, found {text.count(end_marker)}')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          text = text[:start] + "      {/* MODAL DE ENTRADA MANUAL DE ESTOQUE */}" + text[end + len(end_marker):]

          for forbidden in ('ComandaActionsModal', 'quickActionsOrder', 'setQuickActionsOrder'):
              if forbidden in text:
                  raise SystemExit(f'Dead checkout symbol still present: {forbidden}')

          path.write_text(text, encoding='utf-8')
          PY
          git rm src/components/ComandaActionsModal.tsx

      - name: Validate frontend after cleanup
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Commit validated cleanup and remove one-shot workflow
        run: |
          rm .github/workflows/stage3d-dead-checkout-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(finance): remove checkout legado inativo"
          git push origin HEAD:${{ github.head_ref }}
