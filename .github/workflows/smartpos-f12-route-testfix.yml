name: SmartPOS F12 route test fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/smartpos-f12-recovery-refunds'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/smartpos-f12-recovery-refunds
      - name: Use canonical Caixa refund URLs
        shell: python
        run: |
          from pathlib import Path
          p = Path('backend/tests/test_smartpos_payment_intent_preview.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'f"/auth/caixa/pagamentos/{payment_id}/estornar"',
              'f"/caixa/pagamentos/{payment_id}/estornar"',
          )
          text = text.replace(
              '"/auth/caixa/pagamentos/estornaveis"',
              '"/caixa/pagamentos/estornaveis"',
          )
          p.write_text(text, encoding='utf-8')
      - run: git diff --check
      - name: Commit test correction
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/test_smartpos_payment_intent_preview.py
          git commit -m "test(smartpos): use canonical Caixa refund routes"
          git push origin HEAD:feat/smartpos-f12-recovery-refunds
