name: Reports civil-day regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/services/financial_read.py'
      - 'backend/app/routes/financial*_routes.py'
      - 'backend/tests/test_financial*.py'
      - 'backend/tests/test_relatorios.py'
      - 'backend/tests/test_report_snapshot_civil.py'
      - 'src/components/relatorios/**'
      - 'src/components/equipe/EquipeDesempenhoTab.tsx'
      - 'src/domain/reportPeriod.ts'
      - 'e2e/reports-practical.spec.ts'
      - '.github/workflows/reports-targeted.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reports-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Financial read and cash regressions
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./reports_ci.db
          SECRET_KEY: reports-ci-test-only-secret-32-characters
          PYTHONPATH: backend
        run: >-
          python -m pytest -q -ra
          backend/tests/test_relatorios.py
          backend/tests/test_report_snapshot_civil.py
          backend/tests/test_financial_read_stage3b.py
          backend/tests/test_financial_cash_stage3c.py
          backend/tests/test_financial_refund_history_stage3c.py
          backend/tests/test_financial_cash_extreme_stage3c.py
          backend/tests/test_financial_refund_retry_stage3c.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Report flows on desktop and mobile
        env:
          KOMA_E2E_PORT: '4283'
        run: npm run test:e2e -- e2e/reports-practical.spec.ts --workers=2 --project=desktop-1366 --project=mobile-390
