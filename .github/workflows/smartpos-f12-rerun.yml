name: SmartPOS F12 product rerun

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/smartpos-f12-recovery-refunds'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/smartpos-f12-recovery-refunds
          fetch-depth: 0

      - name: Reuse F12 patch block
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          product = Path('backend/app/routes/smartpos.py').read_text(encoding='utf-8')
          if 'def cancelar_payment_intent(' in product:
              raise SystemExit(0)

          source = Path('.github/workflows/smartpos-f12-oneshot.yml').read_text(encoding='utf-8')
          begin = "      - name: Apply F12 recovery and refund guards\n        shell: python\n        run: |\n"
          end = "\n      - name: Validate patch syntax\n"
          if begin not in source or end not in source:
              raise RuntimeError('F12 source block not found')
          block = source.split(begin, 1)[1].split(end, 1)[0]
          code = textwrap.dedent(block)
          exec(compile(code, 'f12-product-patch', 'exec'), {})

          smartpos = Path('backend/app/routes/smartpos.py')
          smartpos.write_text(smartpos.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')

      - name: Validate product patch
        run: |
          git diff --check
          python -m py_compile \
            backend/app/routes/smartpos.py \
            backend/app/routes/smartpos_provider.py \
            backend/app/routes/financial_refund_listing.py \
            backend/app/services/refund_guard.py

      - name: Commit product patch
        run: |
          if git diff --quiet -- \
            backend/app/routes/smartpos.py \
            backend/app/routes/smartpos_provider.py \
            backend/app/routes/financial_refund_listing.py \
            backend/app/services/refund_guard.py \
            backend/tests/test_smartpos_payment_intent_preview.py \
            src/smartpos/SmartPosPaymentFlow.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/routes/smartpos.py \
            backend/app/routes/smartpos_provider.py \
            backend/app/routes/financial_refund_listing.py \
            backend/app/services/refund_guard.py \
            backend/tests/test_smartpos_payment_intent_preview.py \
            src/smartpos/SmartPosPaymentFlow.tsx
          git commit -m "feat(smartpos): add safe cancellation and refund recovery"
          git push origin HEAD:feat/smartpos-f12-recovery-refunds
