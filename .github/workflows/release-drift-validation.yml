name: Koma Release Drift Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'backend/alembic/**'
      - 'backend/app/database.py'
      - 'backend/requirements*.txt'
      - '.github/workflows/release-drift-validation.yml'
  workflow_dispatch:

concurrency:
  group: release-drift-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-drift:
    name: PostgreSQL production-drift recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      SECRET_KEY: release-drift-validation-secret
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/koma_release_drift
      MIGRATION_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/koma_release_drift

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt

      - name: Create isolated PostgreSQL database
        run: |
          python - <<'PY'
          import psycopg2

          conn = psycopg2.connect(
              host="127.0.0.1",
              port=5432,
              dbname="postgres",
              user="postgres",
              password="postgres",
          )
          conn.autocommit = True
          try:
              with conn.cursor() as cur:
                  for role in ("anon", "authenticated", "service_role"):
                      cur.execute("SELECT 1 FROM pg_roles WHERE rolname = %s", (role,))
                      if cur.fetchone() is None:
                          cur.execute(f'CREATE ROLE "{role}" NOLOGIN')
                  cur.execute('DROP DATABASE IF EXISTS "koma_release_drift" WITH (FORCE)')
                  cur.execute('CREATE DATABASE "koma_release_drift"')
          finally:
              conn.close()
          PY

      - name: Reproduce legacy global user identity constraints
        working-directory: backend
        run: |
          python -m alembic -c alembic.ini upgrade f2d4e6a8b013
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.begin() as conn:
              conn.execute(text("""
                  INSERT INTO restaurantes (id, nome, plano)
                  VALUES
                    (9801, 'Drift Tenant A', 'pocket'),
                    (9802, 'Drift Tenant B', 'pocket')
              """))
              conn.execute(text("""
                  INSERT INTO usuarios (
                      id, restaurante_id, nome, usuario, senha_hash, role,
                      email, telefone, cargo, status, created_at
                  ) VALUES (
                      'drift-user-a', 9801, 'Drift User A', 'drift-user-a',
                      '$2b$12$dummyreleasehash', 'garcom',
                      'shared-release@koma.test', '88999990001',
                      'garcom', 'ativo', CURRENT_TIMESTAMP
                  )
              """))

              current = {
                  tuple(c.get("column_names") or ()): c.get("name")
                  for c in inspect(conn).get_unique_constraints("usuarios")
              }
              if ("email",) not in current:
                  conn.execute(text(
                      'ALTER TABLE usuarios ADD CONSTRAINT usuarios_email_key UNIQUE (email)'
                  ))
              if ("telefone",) not in current:
                  conn.execute(text(
                      'ALTER TABLE usuarios ADD CONSTRAINT usuarios_telefone_key UNIQUE (telefone)'
                  ))

          with engine.connect() as conn:
              constraints = {
                  tuple(c.get("column_names") or ())
                  for c in inspect(conn).get_unique_constraints("usuarios")
              }
              assert ("email",) in constraints
              assert ("telefone",) in constraints
              print("Production drift reproduced: global email/telefone uniqueness present")
          engine.dispose()
          PY

      - name: Upgrade drifted database and validate tenant-scoped identity
        working-directory: backend
        run: |
          expected_head="$(python -m alembic -c alembic.ini heads | awk '/\(head\)/ {print $1}')"
          test -n "$expected_head"
          export EXPECTED_ALEMBIC_HEAD="$expected_head"
          python -m alembic -c alembic.ini upgrade head
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text
          from sqlalchemy.exc import IntegrityError

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as conn:
              revision = conn.execute(text("SELECT version_num FROM alembic_version")).scalar_one()
              assert revision == os.environ["EXPECTED_ALEMBIC_HEAD"], revision

              constraints = {
                  tuple(c.get("column_names") or ()): c.get("name")
                  for c in inspect(conn).get_unique_constraints("usuarios")
              }
              assert ("email",) not in constraints
              assert ("telefone",) not in constraints
              assert ("restaurante_id", "email") in constraints
              assert ("restaurante_id", "telefone") in constraints

          # O mesmo e-mail/telefone em outro restaurante precisa ser válido.
          with engine.begin() as conn:
              conn.execute(text("""
                  INSERT INTO usuarios (
                      id, restaurante_id, nome, usuario, senha_hash, role,
                      email, telefone, cargo, status, created_at
                  ) VALUES (
                      'drift-user-b', 9802, 'Drift User B', 'drift-user-b',
                      '$2b$12$dummyreleasehash', 'garcom',
                      'shared-release@koma.test', '88999990001',
                      'garcom', 'ativo', CURRENT_TIMESTAMP
                  )
              """))

          with engine.connect() as conn:
              count = conn.execute(text("""
                  SELECT COUNT(*) FROM usuarios
                  WHERE email = 'shared-release@koma.test'
              """)).scalar_one()
              assert count == 2, count

          # Dentro do mesmo restaurante a duplicidade continua proibida.
          try:
              with engine.begin() as conn:
                  conn.execute(text("""
                      INSERT INTO usuarios (
                          id, restaurante_id, nome, usuario, senha_hash, role,
                          email, telefone, cargo, status, created_at
                      ) VALUES (
                          'drift-user-b-duplicate', 9802, 'Duplicate', 'drift-user-b-duplicate',
                          '$2b$12$dummyreleasehash', 'garcom',
                          'shared-release@koma.test', '88999990002',
                          'garcom', 'ativo', CURRENT_TIMESTAMP
                      )
                  """))
          except IntegrityError:
              pass
          else:
              raise AssertionError('Same-tenant duplicate e-mail was incorrectly accepted')

          print(
              'Release drift OK: legacy global constraints removed; '
              'cross-tenant identity allowed; same-tenant duplicate blocked'
          )
          engine.dispose()
          PY
