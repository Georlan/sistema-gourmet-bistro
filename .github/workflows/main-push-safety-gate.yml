name: Main Push Safety Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-push-safety-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend post-merge safety
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Cache node_modules
        id: node_modules_cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Frontend unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build

  backend:
    name: Backend post-merge critical smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: main-push-safety-secret-key-2026-only-for-ci
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      PYTHONPATH: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
      - name: Cache Python virtualenv
        id: py_venv_cache
        uses: actions/cache@v4
        with:
          path: /tmp/koma-ci-venv
          key: py-venv-${{ runner.os }}-py3.13.15-${{ hashFiles('backend/requirements.lock', 'backend/requirements.txt', 'backend/requirements-dev.txt') }}
      - name: Prepare Python virtualenv
        run: |
          if [ "${{ steps.py_venv_cache.outputs.cache-hit }}" != "true" ] || ! /tmp/koma-ci-venv/bin/python -c "import pytest, alembic, fastapi, xdist" >/dev/null 2>&1; then
            rm -rf /tmp/koma-ci-venv
            python -m venv /tmp/koma-ci-venv
            /tmp/koma-ci-venv/bin/python -m pip install --no-cache-dir -r backend/requirements-dev.txt
          fi
          echo "/tmp/koma-ci-venv/bin" >> "$GITHUB_PATH"
      - name: Validate Alembic single head
        working-directory: backend
        run: |
          heads="$(python -m alembic -c alembic.ini heads)"
          printf '%s\n' "$heads"
          count="$(printf '%s\n' "$heads" | grep -c '(head)')"
          test "$count" -eq 1
      - name: Run critical backend smoke
        run: >-
          python -m pytest
          backend/tests/test_critical_auth_flow.py
          backend/tests/test_online_order_robustness.py
          backend/tests/test_order_numbering_unified.py
          backend/tests/test_websocket_credentials.py
          -q -ra -x
