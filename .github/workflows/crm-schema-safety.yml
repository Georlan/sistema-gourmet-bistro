name: CRM schema safety
on:
  pull_request:
    paths:
      - 'backend/app/crm_models.py'
      - 'backend/app/services/customer_crm.py'
      - 'backend/app/routes/customer_crm.py'
      - 'backend/alembic/**'
      - 'backend/tests/test_crm*'
      - '.github/workflows/crm-schema-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-crm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: crm-local-test-only
          POSTGRES_DB: koma_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Simulate missing schema, migrations, restricted runtime and tenant isolation
        env:
          ENVIRONMENT: test
          SECRET_KEY: crm-schema-ci-test-only-secret
          ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          DATABASE_URL: sqlite:///./crm_ci_test.db
          CRM_POSTGRES_TEST_URL: postgresql+psycopg2://postgres:crm-local-test-only@127.0.0.1:5432/koma_crm
          PYTHONPATH: backend
        run: python -m pytest backend/tests/test_crm_migration_postgres.py backend/tests/test_crm_contact_concurrency_postgres.py backend/tests/test_crm_operational_evolution.py -q -ra
