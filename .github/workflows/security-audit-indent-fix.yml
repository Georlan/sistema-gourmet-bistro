name: Security audit indentation fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'audit/security-five-tenants-2026-08-19'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Repair capacity block indentation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/tools/security_adversarial_audit.py')
          lines = p.read_text().splitlines()
          marker = '            if response.status_code != 200:'
          i = lines.index(marker)
          replacement = [
              ' ' * 12 + 'if response.status_code != 200:',
              ' ' * 16 + 'finding(',
              ' ' * 20 + '"BUSY_DAY_CAPACITY_FAILURE",',
              ' ' * 20 + '"HIGH",',
              ' ' * 20 + '"Concurrent restaurant traffic exhausted backend database capacity",',
              ' ' * 20 + 'f"tenant={rid} path={path} returned HTTP {response.status_code}: {response.text[:160]}",',
              ' ' * 20 + 'once=True,',
              ' ' * 16 + ')',
              ' ' * 16 + 'return elapsed',
          ]
          lines[i:i+9] = replacement
          p.write_text('\n'.join(lines) + '\n')
          PY
          python -m py_compile backend/tools/security_adversarial_audit.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/tools/security_adversarial_audit.py
          git diff --cached --quiet && exit 0
          git commit -m 'test(security): repair adversarial audit capacity block'
          git push
