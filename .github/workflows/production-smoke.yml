name: Production smoke (non-destructive)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      frontend_url:
        description: URL pública do frontend
        required: false
        default: https://app.komafood.com.br
        type: string
      api_url:
        description: URL pública do backend
        required: false
        default: https://sistema-gourmet-bistro-production.up.railway.app
        type: string
  # Daily validation stays asynchronous and does not block merges or deploys.
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Production health + contract + checkout CORS
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KOMA_FRONTEND_URL: ${{ github.event.inputs.frontend_url || vars.KOMA_PRODUCTION_FRONTEND_URL || 'https://app.komafood.com.br' }}
      KOMA_API_URL: ${{ github.event.inputs.api_url || vars.KOMA_PRODUCTION_API_URL || 'https://sistema-gourmet-bistro-production.up.railway.app' }}
      KOMA_EXPECTED_FRONTEND_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run non-destructive production smoke
        run: node scripts/production-smoke.mjs
