name: Payment OAuth Targeted

on:
  pull_request:
    paths:
      - ".env.example"
      - "backend/alembic/versions/1c2d3e4f5a6b_resolve_mercado_pago_webhook_account.py"
      - "backend/app/routes/online_payments.py"
      - "backend/app/services/online_payments/**"
      - "backend/tests/test_mercado_pago_*.py"
      - "backend/tests/test_online_payment_gate.py"
      - "src/components/caixa/online-menu/**"
      - "tests/mercadoPagoConnection.test.ts"
      - ".github/workflows/payment-oauth-targeted.yml"

permissions:
  contents: read

jobs:
  targeted-oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      SECRET_KEY: oauth-targeted-ci-secret-key
      ENCRYPTION_KEY: dgvrWayyUxrh0PjzBcjn1AJ5woxjUE3lLTRptHDUSEQ=
      DATABASE_URL: sqlite:///./oauth-targeted-ci.db
      MIGRATION_DATABASE_URL: sqlite:///./oauth-targeted-ci.db
      KOMA_PUBLIC_API_URL: https://api.example.test
      KOMA_PUBLIC_APP_URL: https://app.example.test
      MERCADO_PAGO_CLIENT_ID: app-ci
      MERCADO_PAGO_CLIENT_SECRET: secret-ci
      MERCADO_PAGO_WEBHOOK_SECRET: webhook-ci
      MERCADO_PAGO_OAUTH_REDIRECT_URI: https://api.example.test/payments/mercado-pago/oauth/callback

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Compile payment OAuth modules
        run: |
          python -m py_compile backend/app/routes/online_payments.py
          python -m py_compile backend/app/services/online_payments/oauth.py
          python -m py_compile backend/app/services/online_payments/account_connection.py
          python -m py_compile backend/alembic/versions/1c2d3e4f5a6b_resolve_mercado_pago_webhook_account.py

      - name: Validate Alembic payment webhook head
        working-directory: backend
        run: |
          python -m alembic history | tee /tmp/alembic-history.txt
          grep -q "1c2d3e4f5a6b" /tmp/alembic-history.txt

      - name: Run targeted backend payment tests
        working-directory: backend
        run: |
          python -m pytest -q \
            tests/test_mercado_pago_oauth.py \
            tests/test_mercado_pago_account_connection.py \
            tests/test_mercado_pago_oauth_routes.py \
            tests/test_mercado_pago_application_webhook.py \
            tests/test_online_payment_gate.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run lint

      - name: Run Mercado Pago UI contract test
        run: npx tsx --test tests/mercadoPagoConnection.test.ts

      - name: Build production frontend
        run: npm run build
