name: Stage 4C one-shot mobile patch

on:
  push:
    branches:
      - audit/ux-theme-mobile-csp-etapa-4
    paths:
      - .github/workflows/stage4c-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ux-theme-mobile-csp-etapa-4
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply exact mobile and semantic refactor
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              assert count == expected, f'{path}: expected {expected}, found {count}: {old[:100]!r}'
              p.write_text(text.replace(old, new), encoding='utf-8')

          products = 'src/components/cardapio/CardapioProdutosTab.tsx'
          replace_exact(products, "'hover:bg-white/[0.025]',", "'hover:bg-koma-raised/50',")
          replace_exact(products, "!isPublished && 'bg-black/10',", "!isPublished && 'bg-koma-canvas/40',")
          replace_exact(products, "'flex items-center justify-between gap-2 pl-[4.25rem] sm:justify-end sm:pl-0'", "'flex flex-wrap items-center justify-between gap-2 pl-0 sm:flex-nowrap sm:justify-end'")
          replace_exact(products, "'inline-flex min-w-[112px] items-center", "'inline-flex min-w-0 flex-1 items-center sm:min-w-[112px] sm:flex-none")
          replace_exact(products, "placeholder:text-zinc-500 focus:border-emerald-400/30", "placeholder:text-koma-muted focus:border-koma-accent")

          finance = 'src/components/relatorios/RelatorioFinanceiroTab.tsx'
          replace_exact(finance, "import { localCalendarDate } from '../../utils/dateTime';\n", "import { localCalendarDate } from '../../utils/dateTime';\nimport { KOMA_CHART_COLORS } from '../../config/chartTheme';\n")
          replace_exact(finance, "fill: '#059669',", "fill: KOMA_CHART_COLORS.paymentMethods.pix,")
          replace_exact(finance, "fill: '#0284c7',", "fill: KOMA_CHART_COLORS.paymentMethods.cartao,")
          replace_exact(finance, "fill: '#d97706',", "fill: KOMA_CHART_COLORS.paymentMethods.dinheiro,")
          replace_exact(finance, 'className="flex items-center gap-2">\n          <div className="flex items-center gap-1.5 rounded-xl border border-koma-border bg-koma-raised px-2.5 py-1">', 'className="flex w-full items-center gap-2 sm:w-auto">\n          <div className="flex min-w-0 flex-1 items-center gap-1.5 rounded-xl border border-koma-border bg-koma-raised px-2.5 py-1 sm:flex-none">')
          replace_exact(finance, 'className="cursor-pointer bg-transparent text-xs font-bold text-koma-foreground focus:outline-none"', 'className="min-w-0 flex-1 cursor-pointer bg-transparent text-xs font-bold text-koma-foreground focus:outline-none sm:flex-none"')
          replace_exact(finance, 'className="grid grid-cols-2 gap-3 lg:grid-cols-4"', 'className="grid grid-cols-1 gap-3 min-[360px]:grid-cols-2 lg:grid-cols-4"')
          replace_exact(finance, 'border border-red-500/20 bg-red-500/10 p-3 text-xs text-red-400', 'border border-koma-danger-border bg-koma-danger-bg p-3 text-xs text-koma-danger-text')

          overview = 'src/components/relatorios/RelatoriosVisaoGeralTab.tsx'
          replace_exact(overview, 'Faturamento Total', 'Vendas Líquidas', expected=2)
          replace_exact(overview, 'className="flex items-center gap-2.5"', 'className="flex w-full flex-wrap items-center gap-2.5 sm:w-auto"')
          replace_exact(overview, 'hover:bg-[#10b981]/20', 'hover:bg-emerald-500/20')

          closing = 'src/components/caixa/CaixaFechamentoTab.tsx'
          replace_exact(closing, 'focus-within:border-emerald-500/40', 'focus-within:border-koma-accent')
          replace_exact(closing, 'hover:border-[#3ba982]', 'hover:border-koma-accent')
          replace_exact(closing, 'focus-within:border-[#2a9f7d]', 'focus-within:border-koma-accent')
          replace_exact(closing, 'divide-[#252b28]', 'divide-koma-border')
          replace_exact(closing, 'overflow-x-auto rounded-2xl border border-koma-border', 'overflow-x-auto overscroll-x-contain rounded-2xl border border-koma-border', expected=1)

          caixa = 'src/components/CaixaPanel.tsx'
          replace_exact(caixa, 'Faturamento Total;R$', 'Vendas Líquidas;R$')
          replace_exact(caixa, 'Faturamento de Hoje;R$', 'Líquido de Hoje;R$')
          replace_exact(caixa, '>Faturamento de Hoje</span>', '>Líquido de Hoje</span>')
          replace_exact(caixa, '>Faturamento</span>', '>Receita Líquida</span>')

          for path in (products, finance, overview, closing, caixa):
              text = Path(path).read_text(encoding='utf-8')
              assert 'Itens do Lote' not in text
          assert 'pl-[4.25rem]' not in Path(products).read_text(encoding='utf-8')
          assert "fill: '#059669'" not in Path(finance).read_text(encoding='utf-8')
          assert 'Faturamento Total' not in Path(overview).read_text(encoding='utf-8')
          PY

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Commit verified patch and remove one-shot workflow
        run: |
          git config user.name "Georlan"
          git config user.email "129700145+Georlan@users.noreply.github.com"
          git rm .github/workflows/stage4c-one-shot.yml
          git add -A
          git diff --cached --check
          git commit -m "refactor(ui): melhora mobile e semântica financeira — etapa 4C"
          git push origin HEAD:audit/ux-theme-mobile-csp-etapa-4
