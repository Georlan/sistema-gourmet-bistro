name: Workers Multiprocess

on:
  pull_request:
    paths:
      - 'backend/tests/test_workers_multiprocess.py'
      - 'backend/app/services/signup_notifications.py'
      - 'backend/app/services/outbox/dispatcher.py'
      - '.github/workflows/workers-multiprocess.yml'

permissions:
  contents: read

jobs:
  worker-claims:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: worker_test
          POSTGRES_PASSWORD: worker_test
          POSTGRES_DB: worker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: worker-ci-secret-only
      ENCRYPTION_KEY: dgvrWayyUxrh0PjzBcjn1AJ5woxjUE3lLTRptHDUSEQ=
      PYTHONPATH: backend
      DATABASE_URL: postgresql+psycopg2://worker_test:worker_test@127.0.0.1:5432/worker_test
      MIGRATION_DATABASE_URL: postgresql+psycopg2://worker_test:worker_test@127.0.0.1:5432/worker_test
      KOMA_WORKER_TEST_DATABASE_URL: postgresql+psycopg2://worker_test:worker_test@127.0.0.1:5432/worker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m alembic -c alembic.ini upgrade head
        working-directory: backend
      - run: python -m pytest -q -ra backend/tests/test_workers_multiprocess.py
