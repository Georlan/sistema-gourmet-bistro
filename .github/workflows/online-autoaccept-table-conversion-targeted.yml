name: Online Autoaccept and Table Conversion Targeted

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/online-autoaccept-table-conversion-targeted.yml'
      - 'backend/alembic/versions/m2b3c4d5e6f7_add_online_order_auto_accept.py'
      - 'backend/app/online_order_control_models.py'
      - 'backend/app/services/online_order_control.py'
      - 'backend/app/services/online_order_auto_accept.py'
      - 'backend/app/routes/online_order_control.py'
      - 'backend/app/adapters/orders/web_adapter.py'
      - 'backend/app/services/online_payments/service.py'
      - 'backend/app/services/scheduled_orders.py'
      - 'backend/app/routes/caixa.py'
      - 'backend/app/services/atendimentos.py'
      - 'backend/tests/test_online_order_auto_accept.py'
      - 'backend/tests/test_online_order_operational_counts.py'
      - 'backend/tests/test_first_client_payment_simulation.py'
      - 'backend/tests/test_atendimento_identity.py'
      - 'src/components/CaixaPanel.tsx'
      - 'src/components/caixa/orders/CaixaOrdersWorkspace.tsx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    name: Server autoaccept + table conversion
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ENVIRONMENT: test
      SECRET_KEY: online-autoaccept-targeted-secret
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      DATABASE_URL: sqlite:///./online-autoaccept-targeted.db
      MIGRATION_DATABASE_URL: sqlite:///./online-autoaccept-targeted.db
      KOMA_PUBLIC_API_URL: https://api.example.test
      KOMA_PUBLIC_APP_URL: https://app.example.test
      MERCADO_PAGO_CLIENT_ID: app-ci
      MERCADO_PAGO_CLIENT_SECRET: secret-ci
      MERCADO_PAGO_WEBHOOK_SECRET: webhook-ci
      MERCADO_PAGO_OAUTH_REDIRECT_URI: https://api.example.test/payments/mercado-pago/oauth/callback

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Validate Alembic single head
        working-directory: backend
        run: |
          test "$(python -m alembic -c alembic.ini heads | grep -c '(head)')" -eq 1
          python -m py_compile alembic/versions/m2b3c4d5e6f7_add_online_order_auto_accept.py

      - name: Compile changed backend modules
        run: |
          python -m py_compile backend/app/services/online_order_auto_accept.py
          python -m py_compile backend/app/services/online_order_control.py
          python -m py_compile backend/app/services/atendimentos.py
          python -m py_compile backend/app/adapters/orders/web_adapter.py
          python -m py_compile backend/app/services/online_payments/service.py
          python -m py_compile backend/app/services/scheduled_orders.py
          python -m py_compile backend/app/routes/caixa.py

      - name: Run targeted regressions
        working-directory: backend
        run: |
          python -m pytest -q -x tests/test_online_order_auto_accept.py tests/test_online_order_operational_counts.py tests/test_atendimento_identity.py tests/test_first_client_payment_simulation.py::test_dine_in_pix_approval_triggers_server_autoaccept_once
