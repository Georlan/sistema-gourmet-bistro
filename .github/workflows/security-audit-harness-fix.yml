name: Security audit harness transaction fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'audit/security-five-tenants-2026-08-19'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Fix implicit transaction before audit loop
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/tools/security_adversarial_audit.py')
          text = p.read_text()
          old = "\n        for rid in TENANT_IDS:\n            tx = conn.begin()"
          new = "\n        conn.rollback()\n\n        for rid in TENANT_IDS:\n            tx = conn.begin()"
          if old not in text:
              raise SystemExit('target block not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/tools/security_adversarial_audit.py
          git diff --cached --quiet && exit 0
          git commit -m 'test(security): fix audit transaction lifecycle'
          git push
