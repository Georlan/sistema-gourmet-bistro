name: SuperAdmin Onboarding UI Targeted

on:
  pull_request:
    paths:
      - "src/super-admin/SuperAdminNewTenantModal.tsx"
      - "src/super-admin/SuperAdminTenantsTab.tsx"
      - "src/super-admin/superAdminApi.ts"
      - "src/config/subscriptionPlans.ts"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/superadmin-onboarding-ui-targeted.yml"

permissions:
  contents: read

jobs:
  frontend-onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build
