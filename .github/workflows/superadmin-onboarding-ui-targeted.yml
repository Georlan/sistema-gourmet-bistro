name: SuperAdmin Onboarding UI Targeted

on:
  pull_request:
    paths:
      - "src/super-admin/**"
      - "src/config/subscriptionPlans.ts"
      - "tests/superAdmin*.test.ts"
      - "tests/super_admin_*.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/superadmin-onboarding-ui-targeted.yml"

permissions:
  contents: read

jobs:
  frontend-onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run SuperAdmin-focused unit regressions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(tests/superAdmin*.test.ts tests/super_admin_*.test.ts)
          if (( ${#files[@]} == 0 )); then
            echo "No SuperAdmin UI tests found."
            exit 1
          fi
          npx tsx --test "${files[@]}"
