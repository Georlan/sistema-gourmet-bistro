name: Idle Session Budget

on:
  pull_request:
    branches: [main]
    paths:
      - src/components/auth/TenantSuspensionBoundary.tsx
      - src/components/caixa/online-menu/OnlineOrderEmergencyControl.tsx
      - src/components/caixa/navigation/**
      - src/components/CaixaPanel.tsx
      - e2e/online-control-idle.spec.ts
      - e2e/online-control-request-coordination.spec.ts
      - e2e/fixtures/online-control.html
      - src/utils/authSession.ts
      - src/smartpos/smartPosSession.ts
      - e2e/tenant-suspension-idle.spec.ts
      - e2e/fixtures/tenant-boundary.html
      - .github/workflows/idle-session-budget.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  idle-boundary:
    name: Idle boundary browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/tenant-suspension-idle.spec.ts e2e/online-control-idle.spec.ts --project=desktop-1366 --project=mobile-390 --project=tablet-768 --workers=2
        env:
          KOMA_E2E_PORT: '4283'
      - run: npx playwright test e2e/online-control-request-coordination.spec.ts --project=desktop-1366 --project=mobile-390 --workers=2
        env:
          KOMA_E2E_PORT: '4283'
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: idle-boundary-failures
          path: test-results/
          retention-days: 7
