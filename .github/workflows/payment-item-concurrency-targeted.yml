name: Payment Item Concurrency Targeted

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/payment-item-concurrency-targeted.yml'
      - 'backend/alembic/versions/*payment_item_scope.py'
      - 'backend/app/models.py'
      - 'backend/app/routes/caixa.py'
      - 'backend/app/schemas.py'
      - 'backend/tests/test_critical_pdv_caixa_flow.py'
      - 'backend/tests/test_payment_item_concurrency_postgres.py'
      - 'src/components/caixa/checkout/useCheckoutController.ts'
      - 'src/components/caixa/checkout/**'

permissions:
  contents: read

jobs:
  item-contract:
    name: Strict item payment contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ENVIRONMENT: test
      SECRET_KEY: payment-item-concurrency-targeted-secret
      ENCRYPTION_KEY: dgvrWayyUxrh0PjzBcjn1AJ5woxjUE3lLTRptHDUSEQ=
      DATABASE_URL: sqlite:///./payment-item-concurrency-targeted.db
      MIGRATION_DATABASE_URL: sqlite:///./payment-item-concurrency-targeted.db
      KOMA_PUBLIC_API_URL: https://api.example.test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Compile payment modules
        run: |
          python -m py_compile backend/app/models.py
          python -m py_compile backend/app/routes/caixa.py
          python -m py_compile backend/app/schemas.py
          python -m py_compile backend/tests/test_critical_pdv_caixa_flow.py
          python -m py_compile backend/tests/test_payment_item_concurrency_postgres.py

      - name: Run strict item payment regressions
        run: >-
          python -m pytest
          backend/tests/test_critical_pdv_caixa_flow.py
          -q -x
          -k "stale_item_selection or table_item_selection or pending_cash_item_scope"

  postgres-race:
    name: Two-session PostgreSQL race
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: payment_items
          POSTGRES_PASSWORD: payment_items
          POSTGRES_DB: payment_items
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payment_items"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: payment-item-concurrency-postgres-secret
      ENCRYPTION_KEY: dgvrWayyUxrh0PjzBcjn1AJ5woxjUE3lLTRptHDUSEQ=
      DATABASE_URL: postgresql://payment_items:payment_items@127.0.0.1:5432/payment_items
      MIGRATION_DATABASE_URL: postgresql://payment_items:payment_items@127.0.0.1:5432/payment_items
      KOMA_PUBLIC_API_URL: https://api.example.test
      KOMA_PYTEST_USE_EXTERNAL_DATABASE: 'true'
      PYTHONPATH: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Validate Alembic single head
        working-directory: backend
        run: |
          test "$(python -m alembic heads | wc -l)" -eq 1
          python -m alembic upgrade head

      - name: Run two-session race
        run: python -m pytest -q -x backend/tests/test_payment_item_concurrency_postgres.py
