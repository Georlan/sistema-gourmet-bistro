name: Koma Quality Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-gate-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Light mode contrast audit
        run: npm run audit:light

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build

  backend-critical:
    name: Backend full + critical regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt

      - name: Validate Alembic single head
        working-directory: backend
        run: |
          heads="$(python -m alembic -c alembic.ini heads)"
          printf '%s\n' "$heads"
          count="$(printf '%s\n' "$heads" | grep -c '(head)')"
          test "$count" -eq 1
          head_revision="$(printf '%s\n' "$heads" | awk '/\(head\)/ {print $1}')"
          test -n "$head_revision"
          echo "Alembic single head: $head_revision"

      - name: Run critical regression suite
        env:
          KOMA_REGRESSION_LOG: /tmp/koma-regression.log
        run: bash scripts/regression_check.sh

      - name: Run full isolated backend suite
        run: python -m pytest backend/tests -q -ra

      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-regression-log-${{ github.run_id }}
          path: /tmp/koma-regression.log
          if-no-files-found: warn
          retention-days: 7
