name: Koma Quality Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-gate-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  brand-one-shot:
    name: Normalize App branding
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/brand-logo-slogan-standardization' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Normalize logo and slogan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('src/App.tsx')
          text = app.read_text(encoding='utf-8')

          if '<KomaLogo withText size="xl" />' not in text:
              pattern = re.compile(
                  r'<div className="flex justify-center">\s*'
                  r'<div className="h-20 w-20 bg-koma-card border border-koma-border rounded-2xl flex items-center justify-center shadow-lg shrink-0 overflow-hidden p-2">\s*'
                  r'<KomaLogo size="xl"\s*/>\s*'
                  r'</div>\s*</div>\s*'
                  r'<div className="space-y-1">\s*'
                  r'<span className="font-serif font-black tracking-\[-0\.03em\] text-koma-foreground text-xl block">\s*'
                  r'KÔMA\s*</span>',
                  re.MULTILINE,
              )
              replacement = '''<div className="flex justify-center">
              <KomaLogo withText size="xl" />
            </div>
            <div className="space-y-1">'''
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit('Expected App login brand block was not found')
              app.write_text(text, encoding='utf-8')

          wrong = 'Se está com fome, Kôma'
          correct = 'Se você está com fome, Kôma'
          for path in Path('src').rglob('*'):
              if path.suffix not in {'.ts', '.tsx', '.js', '.jsx', '.html'}:
                  continue
              source = path.read_text(encoding='utf-8')
              if wrong in source:
                  path.write_text(source.replace(wrong, correct), encoding='utf-8')
          PY

      - name: Commit and push normalization
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Branding already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix(brand): normalize App logo and slogan"
          git push origin HEAD:${{ github.head_ref }}

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

  backend-critical:
    name: Backend critical regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt

      - name: Validate Alembic single head
        working-directory: backend
        run: |
          heads="$(python -m alembic -c alembic.ini heads)"
          printf '%s\n' "$heads"
          count="$(printf '%s\n' "$heads" | grep -c '(head)')"
          test "$count" -eq 1
          printf '%s\n' "$heads" | grep -q '^e1c3a5b7d902 '

      - name: Run critical regression suite
        env:
          KOMA_REGRESSION_LOG: /tmp/koma-regression.log
        run: bash scripts/regression_check.sh

      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-regression-log-${{ github.run_id }}
          path: /tmp/koma-regression.log
          if-no-files-found: warn
          retention-days: 7
