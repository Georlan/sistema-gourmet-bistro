name: Koma Minimal Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: minimal-gate-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verdict:
    name: Merge verdict
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Frontend unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Install browser for session regression
        run: npx playwright install --with-deps chromium

      - name: Browser session and onboarding regressions
        run: >-
          KOMA_E2E_PORT=4283 npm run test:e2e --
          e2e/auth-persistence.spec.ts e2e/onboarding-first-client-ux.spec.ts
          --project=desktop-1366 --workers=2

      - name: Backend syntax check
        run: python -m compileall -q backend/app

      - name: Check migration compatibility hazards
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: python scripts/check_migration_safety.py --base "$BASE_SHA"

      - name: Setup Python for sensitive backend smoke
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Validate single Alembic head
        working-directory: backend
        env:
          ENVIRONMENT: test
          SECRET_KEY: merge-verdict-test-only-secret
        run: test "$(python -m alembic heads | grep -c '(head)')" -eq 1

      - name: Run production safety regressions
        env:
          ENVIRONMENT: test
          SECRET_KEY: merge-verdict-test-only-secret
          ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          PYTHONPATH: backend
        run: >-
          python -m pytest -q -ra -x
          backend/tests/test_pool_observability.py
          backend/tests/test_migration_safety_gate.py
          backend/tests/test_tenant_first_day_reset.py
          backend/tests/test_online_order_robustness.py
          backend/tests/test_order_numbering_unified.py
          backend/tests/test_order_idempotency_fingerprint.py
          backend/tests/test_auth_tenant_session_hardening.py
          backend/tests/test_websocket_credentials.py
          backend/tests/test_critical_auth_flow.py
          backend/tests/test_team_admin_delete_authorization.py
          backend/tests/test_onboarding_status.py
          backend/tests/test_saas_billing_checkout.py
          backend/tests/test_super_admin_contract_activation.py
          backend/tests/test_plan_entitlements.py
          backend/tests/test_plan_module_entitlements.py
          backend/tests/test_product_contract_gate.py
          backend/tests/test_optimization.py
