name: Koma Minimal Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: minimal-gate-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verdict:
    name: Merge verdict
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Frontend unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Backend syntax check
        run: python -m compileall -q backend/app

      - name: Detect sensitive backend changes
        id: backend_paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" HEAD > /tmp/koma-changed-files
          if grep -Eq '^backend/(app/(routes/(auth|onboarding|saas|signup|super_admin_onboarding)|services/(saas|signup|onboarding|restaurant_provisioning|billing)|security\.py|permissions\.py)|tests/(test_authorization|test_team_admin_delete_authorization|test_critical_auth_flow|test_onboarding_status|test_saas_billing_checkout))' /tmp/koma-changed-files; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python for sensitive backend smoke
        if: steps.backend_paths.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend test dependencies
        if: steps.backend_paths.outputs.run == 'true'
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run auth, onboarding and billing smoke
        if: steps.backend_paths.outputs.run == 'true'
        env:
          ENVIRONMENT: test
          SECRET_KEY: merge-verdict-test-only-secret
          ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          PYTHONPATH: backend
        run: >-
          python -m pytest -q -ra -x
          backend/tests/test_critical_auth_flow.py
          backend/tests/test_team_admin_delete_authorization.py
          backend/tests/test_onboarding_status.py
          backend/tests/test_saas_billing_checkout.py
