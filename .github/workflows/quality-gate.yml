name: Koma Quality Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan affected quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      frontend: ${{ steps.classify.outputs.frontend }}
      browser: ${{ steps.classify.outputs.browser }}
      backend: ${{ steps.classify.outputs.backend }}
      security: ${{ steps.classify.outputs.security }}
    steps:
      - name: Checkout history for change classification
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          frontend=false
          browser=false
          backend=false
          security=false
          ci=false

          # A push to main is the post-merge safety net: always run the complete gate.
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            frontend=true
            browser=true
            backend=true
            security=true
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" | tee /tmp/koma-changed-files.txt

            while IFS= read -r file; do
              [[ -z "$file" ]] && continue

              case "$file" in
                .github/workflows/*)
                  ci=true
                  ;;
              esac

              case "$file" in
                src/*|tests/*.test.ts|e2e/*|public/*|package.json|package-lock.json|tsconfig*.json|vite.config.*)
                  frontend=true
                  ;;
              esac

              case "$file" in
                e2e/*|src/App.tsx|src/main.tsx|src/cardapio/*|src/components/caixa/*|src/components/auth/*|src/super-admin/*|src/legal/*|src/landing/*)
                  browser=true
                  ;;
              esac

              case "$file" in
                backend/*)
                  backend=true
                  ;;
              esac

              case "$file" in
                .env.example|backend/alembic/*|backend/app/database.py|backend/app/models.py|backend/app/security.py|backend/app/main.py|backend/app/routes/auth*|backend/app/routes/super_admin*|backend/app/routes/online_payments.py|backend/app/services/online_payments/*|backend/app/services/customer_auth.py|backend/tests/test_*security*|backend/tests/test_*postgres*|backend/tests/test_multitenant_infra.py|backend/tests/test_super_admin_contract.py|backend/tests/test_cors_and_security_headers.py|backend/tests/test_cardapio_public_cors_railway.py)
                  security=true
                  ;;
              esac
            done < /tmp/koma-changed-files.txt

            # Workflow edits validate every lane so CI refactors cannot silently disable coverage.
            if [[ "$ci" == "true" ]]; then
              frontend=true
              browser=true
              backend=true
              security=true
            fi
          fi

          {
            echo "frontend=$frontend"
            echo "browser=$browser"
            echo "backend=$backend"
            echo "security=$security"
          } | tee -a "$GITHUB_OUTPUT"

  frontend:
    name: Frontend typecheck + unit + build
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Frontend unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build

  browser:
    name: Browser regression matrix
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run merge smoke matrix
        env:
          KOMA_E2E_PORT: '4283'
        run: npm run test:e2e -- e2e/operational-app-owners.spec.ts e2e/salon-context.spec.ts e2e/app-recovery.spec.ts e2e/public-menu-order.spec.ts e2e/order-tracking-chat.spec.ts e2e/password-recovery.spec.ts --project=mobile-360 --project=desktop-1366 --workers=2
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 7

  backend:
    name: Backend regression shard ${{ matrix.shard }} of 4
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    env:
      ENVIRONMENT: test
      SECRET_KEY: quality-gate-secret-key-2026-only-for-ci
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      PYTHONPATH: backend
      SHARD_TOTAL: '4'
      SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Reject tests outside canonical suite
        run: |
          if find backend -maxdepth 1 -type f -name 'test_*.py' -print -quit | grep -q .; then
            find backend -maxdepth 1 -type f -name 'test_*.py' -print
            exit 1
          fi
      - name: Validate Alembic single head
        working-directory: backend
        run: |
          heads="$(python -m alembic -c alembic.ini heads)"
          printf '%s\n' "$heads"
          count="$(printf '%s\n' "$heads" | grep -c '(head)')"
          test "$count" -eq 1
      - name: Run backend shard
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find backend/tests -maxdepth 1 -type f -name 'test_*.py' | sort)
          selected=()
          zero_based=$((SHARD_INDEX - 1))

          for i in "${!files[@]}"; do
            if (( i % SHARD_TOTAL == zero_based )); then
              selected+=("${files[$i]}")
            fi
          done

          if (( ${#selected[@]} == 0 )); then
            echo "No tests selected for shard $SHARD_INDEX/$SHARD_TOTAL"
            exit 1
          fi

          printf 'Shard %s/%s: %s test files\n' "$SHARD_INDEX" "$SHARD_TOTAL" "${#selected[@]}"
          printf '  %s\n' "${selected[@]}"

          pytest_args=(-q -ra)
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            pytest_args+=(-x)
          fi

          python -m pytest "${selected[@]}" "${pytest_args[@]}"

  security:
    name: postgres-security-audit
    needs: plan
    if: needs.plan.outputs.security == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: koma_security_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d koma_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ENVIRONMENT: test
      SECRET_KEY: security-audit-secret-key-2026-only-for-ci
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      PYTHONPATH: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run security regression gate
        run: >-
          python -m pytest
          backend/tests/test_cors_and_security_headers.py
          backend/tests/test_cardapio_public_cors_railway.py
          backend/tests/test_super_admin_contract.py
          backend/tests/test_multitenant_infra.py
          -q -ra -x
      - name: Bootstrap Supabase compatibility roles
        env:
          PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/koma_security_test
        run: >-
          python -c "import os, psycopg2;
          c=psycopg2.connect(os.environ['PG_ADMIN_URL']); c.autocommit=True;
          q=c.cursor();
          q.execute('CREATE ROLE anon NOLOGIN');
          q.execute('CREATE ROLE authenticated NOLOGIN');
          q.execute('CREATE ROLE service_role NOLOGIN');
          q.close(); c.close()"
      - name: Apply schema to ephemeral PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/koma_security_test
          MIGRATION_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/koma_security_test
        run: python -m alembic -c alembic.ini upgrade head
      - name: Provision restricted runtime role
        env:
          PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/koma_security_test
        run: >-
          python -c "import os, psycopg2;
          c=psycopg2.connect(os.environ['PG_ADMIN_URL']); c.autocommit=True;
          q=c.cursor();
          q.execute(\"CREATE ROLE koma_security_runtime LOGIN PASSWORD 'koma-security-runtime' IN ROLE koma_app\");
          q.close(); c.close()"
      - name: Run real PostgreSQL operational and RLS regressions
        env:
          DATABASE_URL: postgresql+psycopg2://koma_security_runtime:koma-security-runtime@localhost:5432/koma_security_test
          MIGRATION_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/koma_security_test
          KOMA_PYTEST_USE_EXTERNAL_DATABASE: "true"
          STRICT_RLS_ROLE_CHECK: "true"
          CREATE_SCHEMA_ON_STARTUP: "false"
          KOMA_CONCURRENCY_DATABASE_URL: postgresql+psycopg2://koma_security_runtime:koma-security-runtime@localhost:5432/koma_security_test
        run: >-
          python -m pytest
          backend/tests/test_super_admin_incidents_postgres.py
          backend/tests/test_order_chat_postgres_rls.py
          backend/tests/test_password_recovery_postgres.py
          backend/tests/test_b14_operational_smoke_postgres.py
          backend/tests/test_atendimento_concurrency_postgres.py
          backend/tests/test_first_client_payment_simulation.py
          -q -ra -x

  verdict:
    name: Merge verdict
    if: always()
    needs: [plan, frontend, browser, backend, security]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected lane to pass
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          for result in "$PLAN_RESULT" "$FRONTEND_RESULT" "$BROWSER_RESULT" "$BACKEND_RESULT" "$SECURITY_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "Quality gate lane finished as: $result"; exit 1 ;;
            esac
          done
          echo "All selected quality lanes passed."
