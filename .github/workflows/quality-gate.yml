name: Koma Minimal Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: minimal-gate-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verdict:
    name: Merge verdict
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Frontend unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Backend syntax check
        run: python -m compileall -q backend/app

      - name: Detect sensitive backend changes
        id: backend_paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'print=true' >> "$GITHUB_OUTPUT"
            echo 'fiscal=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" HEAD > /tmp/koma-changed-files
          if grep -Eq '(^\.github/workflows/quality-gate\.yml$|^backend/app/(fiscal/|fiscal_models\.py|models\.py|database\.py|security\.py|services/fiscal_|routes/fiscal_)|^backend/alembic/versions/.*fiscal|^backend/tests/test_fiscal|^e2e/fiscal|^src/components/caixa/settings/Cashier(Fiscal|Integrations))' /tmp/koma-changed-files; then
            echo 'fiscal=true' >> "$GITHUB_OUTPUT"
          else
            echo 'fiscal=false' >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(backend/|print-agent/|\.github/workflows/|railway\.(json|toml)$|Dockerfile)' /tmp/koma-changed-files; then
            echo 'print=true' >> "$GITHUB_OUTPUT"
          else
            echo 'print=false' >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '(product-contract\.json|^backend/(app/(routes/(auth|onboarding|saas|signup|super_admin_onboarding|super_admin_contracts|estoque|relatorios|financial_read_routes|financial_product_routes|optimization)|services/(saas|signup|onboarding|restaurant_provisioning|billing|plan_entitlements|product_contract)|security\.py|permissions\.py)|tests/(test_authorization|test_team_admin_delete_authorization|test_critical_auth_flow|test_onboarding_status|test_saas_billing_checkout|test_super_admin_contract_activation|test_plan_entitlements|test_plan_module_entitlements|test_product_contract_gate)))' /tmp/koma-changed-files; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python for sensitive backend smoke
        if: steps.backend_paths.outputs.run == 'true' || steps.backend_paths.outputs.print == 'true' || steps.backend_paths.outputs.fiscal == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend test dependencies
        if: steps.backend_paths.outputs.run == 'true' || steps.backend_paths.outputs.print == 'true' || steps.backend_paths.outputs.fiscal == 'true'
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run auth, onboarding, billing and plan capability smoke
        if: steps.backend_paths.outputs.run == 'true'
        env:
          ENVIRONMENT: test
          SECRET_KEY: merge-verdict-test-only-secret
          ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          PYTHONPATH: backend
        run: >-
          python -m pytest -q -ra -x
          backend/tests/test_critical_auth_flow.py
          backend/tests/test_team_admin_delete_authorization.py
          backend/tests/test_onboarding_status.py
          backend/tests/test_saas_billing_checkout.py
          backend/tests/test_super_admin_contract_activation.py
          backend/tests/test_plan_entitlements.py
          backend/tests/test_plan_module_entitlements.py
          backend/tests/test_product_contract_gate.py
          backend/tests/test_optimization.py
          backend/tests/test_pagbank_connect.py
          backend/tests/test_online_payment_gate.py
          backend/tests/test_online_payment_token_refresh.py
          backend/tests/test_read_query_budget.py

      - name: Preserve installed-agent printing through freshness windows
        if: steps.backend_paths.outputs.print == 'true'
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./efficiency-safety-isolated.db
          SECRET_KEY: efficiency-safety-test-only-secret
          ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          PYTHONPATH: backend
        run: python -m pytest backend/tests/test_print_agents.py -q -ra -x

      - name: Preserve fiscal tenant isolation and concurrent replay
        if: steps.backend_paths.outputs.fiscal == 'true'
        env:
          ENVIRONMENT: test
          SECRET_KEY: fiscal-ci-test-only-secret
          ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          PYTHONPATH: backend
          KOMA_FISCAL_TENANT_TEST_POSTGRES_URL: postgresql://postgres:fiscal-ci-test-only@127.0.0.1:55437/koma_fiscal_test
        run: |
          set -euo pipefail
          trap 'docker rm -f koma-fiscal-ci >/dev/null 2>&1 || true' EXIT
          docker run --rm -d --name koma-fiscal-ci \
            -e POSTGRES_PASSWORD=fiscal-ci-test-only \
            -e POSTGRES_DB=koma_fiscal_test \
            -p 127.0.0.1:55437:5432 postgres:17
          for attempt in $(seq 1 30); do
            if docker exec koma-fiscal-ci pg_isready -U postgres -d koma_fiscal_test; then
              break
            fi
            sleep 1
          done
          docker exec koma-fiscal-ci pg_isready -U postgres -d koma_fiscal_test
          python -m pytest -q -ra -x \
            backend/tests/test_fiscal_tenant_links.py \
            backend/tests/test_fiscal_idempotency_concurrency_postgres.py \
            --junitxml=/tmp/koma-fiscal-postgres.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = ET.parse('/tmp/koma-fiscal-postgres.xml').getroot().iter('testsuite')
          counts = [(int(s.get('tests', 0)), int(s.get('skipped', 0))) for s in suites]
          assert sum(tests for tests, _ in counts) >= 22, counts
          assert sum(skipped for _, skipped in counts) == 0, counts
          PY
