name: Koma Quality Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-gate-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck + unit + build
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Frontend unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

  browser-e2e:
    name: Browser regression matrix
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run merge smoke matrix
        run: npm run test:e2e -- e2e/operational-app-owners.spec.ts e2e/salon-context.spec.ts --project=mobile-360 --project=desktop-1366 --workers=2

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 7

  backend-critical:
    name: Backend full + critical regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      ENVIRONMENT: test
      SECRET_KEY: quality-gate-secret-key-2026-only-for-ci
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt

      - name: Reject tests outside the canonical suite
        run: |
          if find backend -maxdepth 1 -type f -name 'test_*.py' -print -quit | grep -q .; then
            find backend -maxdepth 1 -type f -name 'test_*.py' -print
            exit 1
          fi

      - name: Validate Alembic single head
        working-directory: backend
        run: |
          heads="$(python -m alembic -c alembic.ini heads)"
          printf '%s\n' "$heads"
          count="$(printf '%s\n' "$heads" | grep -c '(head)')"
          test "$count" -eq 1

      - name: Run fast backend regression gate
        run: >-
          python -m pytest
          backend/tests/test_cardapio_public_cors_railway.py
          backend/tests/test_cors_and_security_headers.py
          -q -ra

  post-merge-frontend-audit:
    name: Post-merge frontend audits
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Light mode contrast audit
        run: npm run audit:light
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Production build
        run: npm run build
      - name: Guard cashier deferred loading and startup budget
        run: node scripts/audit-cashier-loading.mjs > cashier-loading.json
      - name: Measure source ownership and production chunks
        run: node scripts/architecture-metrics.mjs > architecture-metrics.json
      - uses: actions/upload-artifact@v6
        with:
          name: architecture-metrics-${{ github.run_id }}
          path: |
            architecture-metrics.json
            cashier-loading.json
          retention-days: 30

  post-merge-browser-full:
    name: Post-merge full browser regression
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run full browser regression matrix
        run: npm run test:e2e
      - name: Validate deferred loading against production assets
        run: |
          npm run build
          KOMA_E2E_PREVIEW=true KOMA_E2E_PORT=4285 npm run test:e2e -- e2e/cashier-loading.spec.ts e2e/cashier-boundaries.spec.ts e2e/operational-app-owners.spec.ts e2e/salon-context.spec.ts e2e/salon-density.spec.ts --project=mobile-360 --project=desktop-1366 --workers=2
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-full-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 7

  post-merge-backend-full:
    name: Post-merge full backend regression
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: koma_concurrency
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d koma_concurrency"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      SECRET_KEY: quality-gate-secret-key-2026-only-for-ci
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      KOMA_CONCURRENCY_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/koma_concurrency

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            print-agent/requirements.txt
      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt -r print-agent/requirements.txt
      - name: Audit Python dependencies and generate SBOM
        run: |
          python -m pip install 'pip-audit==2.10.1'
          python -m pip_audit -r backend/requirements.txt --progress-spinner=off --format=cyclonedx-json --output=python-sbom.cdx.json
          python -m pip_audit -r print-agent/requirements.txt --progress-spinner=off --format=cyclonedx-json --output=print-agent-sbom.cdx.json
      - name: Validate Alembic single head
        working-directory: backend
        run: python -m alembic -c alembic.ini heads
      - name: Run full backend regression suite
        run: python -m pytest backend/tests -q -ra
      - name: Run print agent suite
        run: python -m pytest print-agent -q -ra
      - name: Upload Python SBOM
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: python-sbom-${{ github.run_id }}
          path: |
            python-sbom.cdx.json
            print-agent-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-regression-log-${{ github.run_id }}
          path: /tmp/koma-regression.log
          if-no-files-found: warn
          retention-days: 7
