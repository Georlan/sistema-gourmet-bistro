name: Koma Quality Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck + unit + build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Frontend unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build

  browser:
    name: Browser regression matrix
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run merge smoke matrix
        env:
          KOMA_E2E_PORT: '4283'
        run: npm run test:e2e -- e2e/operational-app-owners.spec.ts e2e/salon-context.spec.ts --project=mobile-360 --project=desktop-1366 --workers=2
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 7

  backend:
    name: Backend full + critical regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENVIRONMENT: test
      SECRET_KEY: quality-gate-secret-key-2026-only-for-ci
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      PYTHONPATH: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt
      - name: Reject tests outside canonical suite
        run: |
          if find backend -maxdepth 1 -type f -name 'test_*.py' -print -quit | grep -q .; then
            find backend -maxdepth 1 -type f -name 'test_*.py' -print
            exit 1
          fi
      - name: Validate Alembic single head
        working-directory: backend
        run: |
          heads="$(python -m alembic -c alembic.ini heads)"
          printf '%s\n' "$heads"
          count="$(printf '%s\n' "$heads" | grep -c '(head)')"
          test "$count" -eq 1
      - name: Run full backend regression suite
        run: python -m pytest backend/tests -q -ra

  security:
    name: postgres-security-audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ENVIRONMENT: test
      SECRET_KEY: security-audit-secret-key-2026-only-for-ci
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      PYTHONPATH: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt
      - name: Run security regression gate
        run: >-
          python -m pytest
          backend/tests/test_cors_and_security_headers.py
          backend/tests/test_cardapio_public_cors_railway.py
          backend/tests/test_super_admin_contract.py
          backend/tests/test_multitenant_infra.py
          -q -ra
