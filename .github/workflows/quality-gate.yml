name: Koma Minimal Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: minimal-gate-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verdict:
    name: Merge verdict
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Frontend unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Backend syntax check
        run: python -m compileall -q backend/app
