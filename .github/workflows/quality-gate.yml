name: Koma Quality Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'audit/**'

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

  backend-critical:
    name: Backend critical regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt

      - name: Validate Alembic single head
        working-directory: backend
        run: |
          heads="$(python -m alembic -c alembic.ini heads)"
          printf '%s\n' "$heads"
          count="$(printf '%s\n' "$heads" | grep -c '(head)')"
          test "$count" -eq 1
          printf '%s\n' "$heads" | grep -q '^f9a0b1c2d3e4 '

      - name: Run critical regression suite
        env:
          KOMA_REGRESSION_LOG: /tmp/koma-regression.log
        run: bash scripts/regression_check.sh

      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-regression-log-${{ github.run_id }}
          path: /tmp/koma-regression.log
          if-no-files-found: warn
          retention-days: 7
