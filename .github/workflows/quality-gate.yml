name: Koma Minimal Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: minimal-gate-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verdict:
    name: Merge verdict
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed surfaces and sensitive backend paths
        id: backend_paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo 'frontend=true' >> "$GITHUB_OUTPUT"
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'print=true' >> "$GITHUB_OUTPUT"
            echo 'fiscal=true' >> "$GITHUB_OUTPUT"
            echo 'alembic=true' >> "$GITHUB_OUTPUT"
            echo 'orders_payments_inventory=true' >> "$GITHUB_OUTPUT"
            echo 'changed_tests=' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          git diff --name-only "$BASE_SHA" HEAD > /tmp/koma-changed-files

          if grep -Eq '^(src/|tests/|public/|functions/|scripts/|package\.json$|package-lock\.json$|vite\.config\.ts$|tsconfig.*\.json$|index\.html$|product-contract\.json$|\.github/workflows/quality-gate\.yml$)' /tmp/koma-changed-files; then
            echo 'frontend=true' >> "$GITHUB_OUTPUT"
          else
            echo 'frontend=false' >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '(^\.github/workflows/quality-gate\.yml$|^backend/app/(fiscal/|fiscal_models\.py|models\.py|database\.py|security\.py|services/fiscal_|routes/fiscal_)|^backend/alembic/versions/.*fiscal|^backend/tests/test_fiscal|^e2e/fiscal|^src/components/caixa/settings/Cashier(Fiscal|Integrations))' /tmp/koma-changed-files; then
            echo 'fiscal=true' >> "$GITHUB_OUTPUT"
          else
            echo 'fiscal=false' >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '(^\.github/workflows/(quality-gate|print-agent)\.yml$|^backend/|^print-agent/|^railway\.(json|toml)$|^Dockerfile)' /tmp/koma-changed-files; then
            echo 'print=true' >> "$GITHUB_OUTPUT"
          else
            echo 'print=false' >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '(product-contract\.json|^backend/(app/(routes/(auth|onboarding|saas|signup|super_admin_onboarding|super_admin_contracts|estoque|relatorios|financial_read_routes|financial_product_routes|optimization)|services/(saas|signup|onboarding|restaurant_provisioning|billing|plan_entitlements|product_contract)|security\.py|permissions\.py)|tests/(test_authorization|test_team_admin_delete_authorization|test_critical_auth_flow|test_onboarding_status|test_saas_billing_checkout|test_super_admin_contract_activation|test_plan_entitlements|test_plan_module_entitlements|test_product_contract_gate)))' /tmp/koma-changed-files; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(backend/alembic/|backend/app/.*models\.py$)' /tmp/koma-changed-files; then
            echo 'alembic=true' >> "$GITHUB_OUTPUT"
          else
            echo 'alembic=false' >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^backend/app/(application/orders/|adapters/orders/|domain/orders/|routes/(orders|orders_core|caixa|estoque|direct_pix|saas_pix|online_payments|online_order_control|order_tracking|atendimentos|cardapio|cardapio_digital|financial_cash_routes|print_agents|print_agent_events|waiter_history)|services/(inventory|atendimentos|online_payments/|online_order|direct_pix|saas_mercadopago|order_chat|order_rejection_notice|courier_|delivery_receipts)|models\.py|schemas\.py|operational_models\.py|order_chat_models\.py|online_order_control_models\.py)' /tmp/koma-changed-files; then
            echo 'orders_payments_inventory=true' >> "$GITHUB_OUTPUT"
          else
            echo 'orders_payments_inventory=false' >> "$GITHUB_OUTPUT"
          fi

          changed_tests="$(grep -E '^backend/tests/(.*/)?test_[^/]+\.py$' /tmp/koma-changed-files | grep -Ev '(_postgres\.py|_pg17.*\.py|/test_workers_multiprocess\.py$|/test_operational_realtime_multiprocess\.py$|/test_transfer_database_conflicts\.py$|/test_fiscal_tenant_links\.py$|/test_capacity_scale_stages\.py$|/test_direct_pix\.py$|/test_marmitaria_sizes\.py$|/test_marmitaria_size_migration\.py$|/test_crm_operational_evolution\.py$|/test_order_idempotency_fingerprint\.py$)' | while IFS= read -r f; do [ -f "$f" ] && printf '%s ' "$f"; done || true)"
          echo "changed_tests=${changed_tests% }" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.backend_paths.outputs.frontend == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache node_modules
        id: node_modules_cache
        if: steps.backend_paths.outputs.frontend == 'true'
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.backend_paths.outputs.frontend == 'true' && steps.node_modules_cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        if: steps.backend_paths.outputs.frontend == 'true'
        run: npm run lint

      - name: Frontend unit tests
        if: steps.backend_paths.outputs.frontend == 'true'
        run: npm run test:unit

      - name: Production build
        if: steps.backend_paths.outputs.frontend == 'true'
        run: npm run build

      - name: Performance budget audit
        if: steps.backend_paths.outputs.frontend == 'true'
        run: npm run audit:perf

      - name: Backend syntax check
        run: python -m compileall -q backend/app

      - name: Setup Python for sensitive backend smoke
        if: >-
          steps.backend_paths.outputs.run == 'true' ||
          steps.backend_paths.outputs.print == 'true' ||
          steps.backend_paths.outputs.fiscal == 'true' ||
          steps.backend_paths.outputs.alembic == 'true' ||
          steps.backend_paths.outputs.orders_payments_inventory == 'true' ||
          steps.backend_paths.outputs.changed_tests != ''
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'

      - name: Cache Python virtualenv
        id: py_venv_cache
        if: >-
          steps.backend_paths.outputs.run == 'true' ||
          steps.backend_paths.outputs.print == 'true' ||
          steps.backend_paths.outputs.fiscal == 'true' ||
          steps.backend_paths.outputs.alembic == 'true' ||
          steps.backend_paths.outputs.orders_payments_inventory == 'true' ||
          steps.backend_paths.outputs.changed_tests != ''
        uses: actions/cache@v4
        with:
          path: /tmp/koma-ci-venv
          key: py-venv-${{ runner.os }}-py3.13.15-${{ hashFiles('backend/requirements.lock', 'backend/requirements.txt', 'backend/requirements-dev.txt') }}

      - name: Prepare Python virtualenv
        if: >-
          steps.backend_paths.outputs.run == 'true' ||
          steps.backend_paths.outputs.print == 'true' ||
          steps.backend_paths.outputs.fiscal == 'true' ||
          steps.backend_paths.outputs.alembic == 'true' ||
          steps.backend_paths.outputs.orders_payments_inventory == 'true' ||
          steps.backend_paths.outputs.changed_tests != ''
        run: |
          if [ "${{ steps.py_venv_cache.outputs.cache-hit }}" != "true" ] || ! /tmp/koma-ci-venv/bin/python -c "import pytest, alembic, fastapi, psycopg2, xdist" >/dev/null 2>&1; then
            rm -rf /tmp/koma-ci-venv
            python -m venv /tmp/koma-ci-venv
            /tmp/koma-ci-venv/bin/python -m pip install --no-cache-dir -r backend/requirements-dev.txt
          fi
          echo "/tmp/koma-ci-venv/bin" >> "$GITHUB_PATH"

      - name: Validate Alembic single head
        if: steps.backend_paths.outputs.alembic == 'true'
        working-directory: backend
        run: |
          heads="$(python -m alembic -c alembic.ini heads)"
          printf '%s\n' "$heads"
          test "$(printf '%s\n' "$heads" | grep -c '(head)')" -eq 1

      - name: Run auth, onboarding, billing and plan capability smoke
        if: steps.backend_paths.outputs.run == 'true'
        env:
          ENVIRONMENT: test
          SECRET_KEY: merge-verdict-test-only-secret-key
          ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          PYTHONPATH: backend
        run: >-
          python -m pytest -q -ra -x
          backend/tests/test_critical_auth_flow.py
          backend/tests/test_team_admin_delete_authorization.py
          backend/tests/test_onboarding_status.py
          backend/tests/test_saas_billing_checkout.py
          backend/tests/test_super_admin_contract_activation.py
          backend/tests/test_plan_entitlements.py
          backend/tests/test_plan_module_entitlements.py
          backend/tests/test_product_contract_gate.py
          backend/tests/test_optimization.py
          backend/tests/test_pagbank_connect.py
          backend/tests/test_online_payment_gate.py
          backend/tests/test_online_payment_token_refresh.py
          backend/tests/test_read_query_budget.py

      - name: Run orders, payments and inventory critical smoke
        if: steps.backend_paths.outputs.orders_payments_inventory == 'true'
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./orders-payments-inventory-isolated.db
          MIGRATION_DATABASE_URL: sqlite:///./orders-payments-inventory-isolated.db
          SECRET_KEY: merge-verdict-orders-test-only-secret
          ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          KOMA_PUBLIC_API_URL: https://api.example.test
          KOMA_PUBLIC_APP_URL: https://app.example.test
          MERCADO_PAGO_CLIENT_ID: app-ci
          MERCADO_PAGO_CLIENT_SECRET: secret-ci
          MERCADO_PAGO_WEBHOOK_SECRET: webhook-ci
          MERCADO_PAGO_OAUTH_REDIRECT_URI: https://api.example.test/payments/mercado-pago/oauth/callback
          PYTHONPATH: backend
        run: |
          python -m pytest backend/tests/test_critical_pdv_caixa_flow.py -q -ra -x \
            -k "stale_item_selection or table_item_selection or table_item_payment_allocates or pending_cash_item_scope"
          python -m pytest -q -ra -x \
            backend/tests/test_inventory_concurrent_idempotency.py \
            backend/tests/test_online_order_acceptance_inventory.py \
            backend/tests/test_online_payment_cash_close.py \
            backend/tests/test_online_payment_refunds.py \
            backend/tests/test_online_order_operational_safety.py \
            backend/tests/test_atendimento_identity.py \
            backend/tests/test_b1_cancel_payment_guard.py \
            backend/tests/test_order_lifecycle_authority.py

      - name: Run changed backend tests
        if: steps.backend_paths.outputs.changed_tests != ''
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./changed-tests-isolated.db
          MIGRATION_DATABASE_URL: sqlite:///./changed-tests-isolated.db
          SECRET_KEY: merge-verdict-changed-tests-secret-key
          ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          KOMA_PUBLIC_API_URL: https://api.example.test
          KOMA_PUBLIC_APP_URL: https://app.example.test
          PYTHONPATH: backend
        run: python -m pytest -q -ra -x ${{ steps.backend_paths.outputs.changed_tests }}

      - name: Preserve installed-agent printing through freshness windows
        if: steps.backend_paths.outputs.print == 'true'
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///./efficiency-safety-isolated.db
          SECRET_KEY: efficiency-safety-test-only-secret-key
          ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          PYTHONPATH: backend
        run: python -m pytest backend/tests/test_print_agents.py -q -ra -x

      - name: Preserve fiscal tenant isolation and concurrent replay
        if: steps.backend_paths.outputs.fiscal == 'true'
        env:
          ENVIRONMENT: test
          SECRET_KEY: fiscal-ci-test-only-secret-key-long
          ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          PYTHONPATH: backend
          KOMA_FISCAL_TENANT_TEST_POSTGRES_URL: postgresql://postgres:fiscal-ci-test-only@127.0.0.1:55437/koma_fiscal_test
        run: |
          set -euo pipefail
          trap 'docker rm -f koma-fiscal-ci >/dev/null 2>&1 || true' EXIT
          docker run --rm -d --name koma-fiscal-ci \
            -e POSTGRES_PASSWORD=fiscal-ci-test-only \
            -e POSTGRES_DB=koma_fiscal_test \
            -p 127.0.0.1:55437:5432 postgres:17-alpine
          for attempt in $(seq 1 30); do
            if docker exec koma-fiscal-ci pg_isready -U postgres -d koma_fiscal_test; then
              break
            fi
            sleep 1
          done
          docker exec koma-fiscal-ci pg_isready -U postgres -d koma_fiscal_test
          python -m pytest -q -ra -x \
            backend/tests/test_fiscal_tenant_links.py \
            backend/tests/test_fiscal_idempotency_concurrency_postgres.py \
            --junitxml=/tmp/koma-fiscal-postgres.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = ET.parse('/tmp/koma-fiscal-postgres.xml').getroot().iter('testsuite')
          counts = [(int(s.get('tests', 0)), int(s.get('skipped', 0))) for s in suites]
          assert sum(tests for tests, _ in counts) >= 22, counts
          assert sum(skipped for _, skipped in counts) == 0, counts
          PY
