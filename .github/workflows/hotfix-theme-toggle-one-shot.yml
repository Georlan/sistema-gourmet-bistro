name: Hotfix caixa theme toggle one-shot

on:
  push:
    branches:
      - fix/caixa-theme-toggle-realtime
    paths:
      - .github/workflows/hotfix-theme-toggle-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/caixa-theme-toggle-realtime
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply exact realtime theme hotfix
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/components/CaixaPanel.tsx')
          text = path.read_text(encoding='utf-8')

          def replace_exact(old: str, new: str, expected: int = 1):
              global text
              count = text.count(old)
              assert count == expected, f'expected {expected}, found {count}: {old[:120]!r}'
              text = text.replace(old, new)

          replace_exact(
              "import { API } from '../config/caixaService';\n",
              "import { API } from '../config/caixaService';\nimport { KOMA_THEME_CHANGED_EVENT, nextKomaTheme, persistKomaTheme, readKomaTheme, type KomaTheme } from '../config/theme';\n",
          )

          replace_exact(
              "  const [theme, setTheme] = useState<'dark' | 'light'>(() => {\n    return (localStorage.getItem('@koma:theme') as 'dark' | 'light') || 'dark';\n  });",
              "  const [theme, setTheme] = useState<KomaTheme>(() => readKomaTheme());",
          )

          replace_exact(
              "      const storedTheme = localStorage.getItem('@koma:theme') as 'dark' | 'light';\n      if (storedTheme && ['dark', 'light'].includes(storedTheme)) {\n        setTheme(storedTheme);\n      }",
              "      setTheme(readKomaTheme());",
          )

          replace_exact(
              "    window.addEventListener('koma_theme_changed', handleStorageChange);",
              "    window.addEventListener(KOMA_THEME_CHANGED_EVENT, handleStorageChange);",
          )
          replace_exact(
              "      window.removeEventListener('koma_theme_changed', handleStorageChange);",
              "      window.removeEventListener(KOMA_THEME_CHANGED_EVENT, handleStorageChange);",
          )

          legacy_click = """                          const newTheme = theme === 'dark' ? 'light' : 'dark';
                          localStorage.setItem('@koma:theme', newTheme);
                          setTheme(newTheme);
                          window.dispatchEvent(new Event('koma_theme_changed'));"""
          shared_click = """                          setTheme(persistKomaTheme(nextKomaTheme(theme)));"""
          replace_exact(legacy_click, shared_click, expected=2)

          assert "localStorage.setItem('@koma:theme'" not in text
          assert "new Event('koma_theme_changed')" not in text
          assert text.count('persistKomaTheme(nextKomaTheme(theme))') == 2
          assert 'useState<KomaTheme>(() => readKomaTheme())' in text
          assert text.count('KOMA_THEME_CHANGED_EVENT, handleStorageChange') == 2

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Commit verified hotfix and remove one-shot workflow
        run: |
          git config user.name "Georlan"
          git config user.email "129700145+Georlan@users.noreply.github.com"
          git rm .github/workflows/hotfix-theme-toggle-one-shot.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(ui): restaura alternância de tema em tempo real no caixa"
          git push origin HEAD:fix/caixa-theme-toggle-realtime
