name: Stage 4B one-shot UI patch

on:
  push:
    branches:
      - audit/ux-theme-mobile-csp-etapa-4
    paths:
      - .github/workflows/stage4b-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ux-theme-mobile-csp-etapa-4
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply exact UI refactor
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              assert count == expected, f'{path}: expected {expected} match(es), found {count}: {old[:80]!r}'
              p.write_text(text.replace(old, new), encoding='utf-8')

          app = 'src/App.tsx'
          replace_exact(app, "import logoImg from './assets/logo.png';\n", '')
          replace_exact(
              app,
              "import { API_BASE_URL } from './config/api';\n",
              "import { API_BASE_URL } from './config/api';\nimport { KOMA_THEME_CHANGED_EVENT, nextKomaTheme, persistKomaTheme, readKomaTheme, type KomaTheme } from './config/theme';\n",
          )
          replace_exact(app, 'bg-koma-page text-[#00c996]', 'bg-koma-page text-koma-accent')

          old_theme = '''  const [theme, setTheme] = useState<'dark' | 'light'>(() => {\n    return (localStorage.getItem('@koma:theme') as 'dark' | 'light') || 'dark';\n  });\n\n  const toggleTheme = () => {\n    const newTheme = theme === 'dark' ? 'light' : 'dark';\n    localStorage.setItem('@koma:theme', newTheme);\n    setTheme(newTheme);\n    window.dispatchEvent(new Event('koma_theme_changed'));\n  };\n\n  useEffect(() => {\n    document.documentElement.setAttribute('data-koma-theme', theme);\n    const handleStorageChange = () => {\n      const stored = localStorage.getItem('@koma:theme') as 'dark' | 'light';\n      if (stored && ['dark', 'light'].includes(stored)) {\n        setTheme(stored);\n      }\n    };\n    window.addEventListener('storage', handleStorageChange);\n    window.addEventListener('koma_theme_changed', handleStorageChange);\n    return () => {\n      window.removeEventListener('storage', handleStorageChange);\n      window.removeEventListener('koma_theme_changed', handleStorageChange);\n    };\n  }, [theme]);'''
          new_theme = '''  const [theme, setTheme] = useState<KomaTheme>(() => readKomaTheme());\n\n  const toggleTheme = () => {\n    setTheme(persistKomaTheme(nextKomaTheme(theme)));\n  };\n\n  useEffect(() => {\n    const handleThemeChange = () => setTheme(readKomaTheme());\n    window.addEventListener('storage', handleThemeChange);\n    window.addEventListener(KOMA_THEME_CHANGED_EVENT, handleThemeChange);\n    return () => {\n      window.removeEventListener('storage', handleThemeChange);\n      window.removeEventListener(KOMA_THEME_CHANGED_EVENT, handleThemeChange);\n    };\n  }, []);'''
          replace_exact(app, old_theme, new_theme)

          caixa = 'src/components/CaixaPanel.tsx'
          replace_exact(caixa, "import logoImg from '../assets/logo.png';\n", '')
          replace_exact(caixa, '>Lote: #{selectedKanbanOrder.id.slice(-4)}</span>', '>Pedido: #{selectedKanbanOrder.id.slice(-4)}</span>')
          replace_exact(caixa, '>Itens do Lote:</span>', '>Itens do Pedido:</span>')

          app_text = Path(app).read_text(encoding='utf-8')
          caixa_text = Path(caixa).read_text(encoding='utf-8')
          assert "localStorage.getItem('@koma:theme')" not in app_text
          assert "new Event('koma_theme_changed')" not in app_text
          assert "Lote:" not in caixa_text
          assert "Itens do Lote" not in caixa_text
          assert "import logoImg from '../assets/logo.png'" not in caixa_text
          PY

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Commit verified patch and remove one-shot workflow
        run: |
          git config user.name "Georlan"
          git config user.email "129700145+Georlan@users.noreply.github.com"
          git rm .github/workflows/stage4b-one-shot.yml
          git add -A
          git diff --cached --check
          git commit -m "refactor(ui): centraliza tema e nomenclatura operacional — etapa 4B"
          git push origin HEAD:audit/ux-theme-mobile-csp-etapa-4
