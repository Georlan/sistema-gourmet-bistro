name: Online Payment Cash Close Targeted

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/online-payment-cash-close-targeted.yml'
      - '.env.example'
      - 'backend/app/config.py'
      - 'backend/app/routes/financial_cash_routes.py'
      - 'backend/app/services/online_payments/**'
      - 'backend/tests/test_online_payment_cash_close.py'
      - 'backend/tests/test_online_payment_gate.py'
      - 'backend/tests/test_online_payment_refunds.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    name: Pix shift-close invariant
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      SECRET_KEY: pix-shift-close-targeted-secret-key
      ENCRYPTION_KEY: dgvrWayyUxrh0PjzBcjn1AJ5woxjUE3lLTRptHDUSEQ=
      DATABASE_URL: sqlite:///./pix-shift-close-targeted.db
      MIGRATION_DATABASE_URL: sqlite:///./pix-shift-close-targeted.db
      KOMA_PUBLIC_API_URL: https://api.example.test
      KOMA_PUBLIC_APP_URL: https://app.example.test
      MERCADO_PAGO_CLIENT_ID: app-ci
      MERCADO_PAGO_CLIENT_SECRET: secret-ci
      MERCADO_PAGO_WEBHOOK_SECRET: webhook-ci
      MERCADO_PAGO_OAUTH_REDIRECT_URI: https://api.example.test/payments/mercado-pago/oauth/callback

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Compile Pix cash-close modules
        run: |
          python -m py_compile backend/app/routes/financial_cash_routes.py
          python -m py_compile backend/app/services/online_payments/base.py
          python -m py_compile backend/app/services/online_payments/mercado_pago.py
          python -m py_compile backend/app/services/online_payments/service.py
          python -m py_compile backend/tests/test_online_payment_cash_close.py
          python -m py_compile backend/tests/test_online_payment_refunds.py

      - name: Run targeted Pix cash-close tests
        working-directory: backend
        run: |
          python -m pytest -q -x \
            tests/test_online_payment_cash_close.py \
            tests/test_online_payment_gate.py \
            tests/test_online_payment_refunds.py
