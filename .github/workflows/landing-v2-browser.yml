name: Landing V2 Browser

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/landing/**'
      - 'src/main.tsx'
      - 'public/landing-v2/**'
      - 'e2e/landing-v2.spec.ts'
      - 'e2e/annual-pricing.spec.ts'
      - '.github/workflows/landing-v2-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  landing-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Landing V2 mobile and breakpoint coverage
        env:
          KOMA_E2E_PORT: '4283'
        run: npx playwright test e2e/landing-v2.spec.ts e2e/annual-pricing.spec.ts --project=mobile-390 --project=desktop-1024 --workers=2
