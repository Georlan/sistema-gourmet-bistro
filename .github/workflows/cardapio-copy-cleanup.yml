name: One-off online menu copy cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cardapio-copy-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Clarify online menu header
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/CaixaPanel.tsx')
          text = path.read_text(encoding='utf-8')
          old = "{(activeTab === 'cardapio_digital' || activeSubTab === 'cardapio_digital') && 'Cardápio Digital — Identidade Whitelabel'}"
          new = "{(activeTab === 'cardapio_digital' || activeSubTab === 'cardapio_digital') && 'Configurações do cardápio online'}"
          if text.count(old) != 1:
              raise SystemExit(f'expected one legacy online-menu header, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git rm -f .github/workflows/cardapio-copy-cleanup.yml
          git add src/components/CaixaPanel.tsx
          git commit -m "fix: clarify online menu settings copy"
          git push origin main
