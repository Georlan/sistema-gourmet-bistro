name: Outbox Scheduled Import Gate

on:
  pull_request:
    paths:
      - "backend/app/services/outbox/**"
      - "backend/app/services/scheduled_orders.py"
      - "backend/app/routes/cardapio.py"
      - "backend/app/main.py"
      - "backend/alembic/versions/*worker_due_tenant_discovery.py"
      - "backend/tests/test_worker_due_discovery*.py"
      - ".github/workflows/outbox-import-cycle-targeted.yml"

permissions:
  contents: read

jobs:
  import-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      SECRET_KEY: outbox-import-ci-secret-key
      ENCRYPTION_KEY: dgvrWayyUxrh0PjzBcjn1AJ5woxjUE3lLTRptHDUSEQ=
      DATABASE_URL: sqlite:///./outbox-import-ci.db
      MIGRATION_DATABASE_URL: sqlite:///./outbox-import-ci.db
      PYTHONPATH: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Verify dependency compatibility
        run: python -m pip check

      - name: Compile affected modules
        run: |
          python -m py_compile backend/app/services/outbox/__init__.py
          python -m py_compile backend/app/services/outbox/worker.py
          python -m py_compile backend/app/services/scheduled_orders.py
          python -m py_compile backend/app/main.py

      - name: Import application and both sides of the dependency
        run: |
          python - <<'PY'
          from app.main import app
          from app.services.scheduled_orders import release_due_scheduled_orders_in_session
          from app.services.outbox import default_outbox_worker

          assert app is not None
          assert callable(release_due_scheduled_orders_in_session)
          assert default_outbox_worker is not None
          print("outbox/scheduled-orders import smoke: ok")
          PY

  due-work-postgres:
    name: Worker due discovery PostgreSQL RLS
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: worker_smoke_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d worker_smoke_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: worker-discovery-ci-only-secret
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      DATABASE_URL: postgresql://postgres:isolated-ci-password@127.0.0.1:5432/worker_smoke_test
      MIGRATION_DATABASE_URL: postgresql://postgres:isolated-ci-password@127.0.0.1:5432/worker_smoke_test
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Migrate and verify additive rollback on ephemeral PostgreSQL
        working-directory: backend
        run: |
          test "$(python -m alembic heads | wc -l)" -eq 1
          python -m alembic upgrade head
          python -m alembic downgrade -1
          python -m alembic upgrade head
      - name: Create restricted ephemeral runtime role
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          with create_engine(os.environ['DATABASE_URL']).begin() as db:
              db.execute(text("CREATE ROLE worker_test LOGIN PASSWORD 'isolated-ci-password'"))
              db.execute(text("GRANT koma_app TO worker_test"))
          PY
      - name: Verify durable dispatch, due discovery, RLS and idle query budget
        env:
          DATABASE_URL: postgresql://worker_test:isolated-ci-password@127.0.0.1:5432/worker_smoke_test
          KOMA_PYTEST_USE_EXTERNAL_DATABASE: 'true'
        run: >-
          python -m pytest -q -ra
          backend/tests/test_b14_operational_smoke_postgres.py::test_outbox_multi_tenant_worker_rls_postgres_smoke
          backend/tests/test_worker_due_discovery_postgres.py
