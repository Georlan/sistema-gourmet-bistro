name: Koma B1.4 Operational Smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operational-smoke:
    name: Login -> caixa -> pedido -> impressão -> pagamento -> fechamento
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      SECRET_KEY: b14-operational-smoke-secret
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/koma_b14_smoke
      MIGRATION_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/koma_b14_smoke
      RUN_MIGRATIONS_ON_STARTUP: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt

      - name: Create isolated Supabase-compatible PostgreSQL database
        run: |
          python - <<'PY'
          import psycopg2

          conn = psycopg2.connect(
              host="127.0.0.1",
              port=5432,
              dbname="postgres",
              user="postgres",
              password="postgres",
          )
          conn.autocommit = True
          try:
              with conn.cursor() as cur:
                  for role in ("anon", "authenticated", "service_role"):
                      cur.execute("SELECT 1 FROM pg_roles WHERE rolname = %s", (role,))
                      if cur.fetchone() is None:
                          cur.execute(f'CREATE ROLE "{role}" NOLOGIN')
                  cur.execute('DROP DATABASE IF EXISTS "koma_b14_smoke" WITH (FORCE)')
                  cur.execute('CREATE DATABASE "koma_b14_smoke"')
          finally:
              conn.close()
          PY

      - name: Migrate clean database to current head
        working-directory: backend
        run: |
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini current

      - name: B1.4 operational smoke on PostgreSQL 17
        working-directory: backend
        run: |
          python -m pytest tests/test_b14_operational_smoke_postgres.py -q -ra
