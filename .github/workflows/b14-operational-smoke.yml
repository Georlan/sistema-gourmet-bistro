name: Koma B1.4 Operational Smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brand-lockup-one-shot:
    name: Normalize remaining Kôma lockups
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/brand-logo-slogan-standardization' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply final visual-brand replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          caixa = Path('src/components/CaixaPanel.tsx')
          text = caixa.read_text(encoding='utf-8')
          old_caixa = '''                    <span className="cashier-sidebar__logo-wrap">
                      <KomaLogo size="md" />
                    </span>
                    <span className="cashier-sidebar__brand-copy">
                      <strong>Kôma</strong>
                      <small>Se você está com fome, Kôma</small>
                    </span>'''
          if old_caixa in text:
              text = text.replace(old_caixa, '                    <KomaLogo withText withSlogan size="lg" />')
          elif '<KomaLogo withText withSlogan size="lg" />' not in text:
              raise SystemExit('Expected CaixaPanel brand lockups were not found')
          caixa.write_text(text, encoding='utf-8')

          app = Path('src/App.tsx')
          text = app.read_text(encoding='utf-8')

          malformed_login = '''            <div className="flex justify-center">
    <KomaLogo withText size="xl" />
  </div>
  <div className="space-y-1">'''
          formatted_login = '''            <div className="flex justify-center">
              <KomaLogo withText size="xl" />
            </div>
            <div className="space-y-1">'''
          text = text.replace(malformed_login, formatted_login, 1)

          old_header = '''              <div className="flex items-center gap-2.5">
                <KomaLogo size="lg" />
                <div>
                  <h1 className="font-serif text-base sm:text-lg font-black tracking-[-0.03em] text-koma-foreground leading-tight">
                    {restaurantName}
                  </h1>
                  <p className="text-[9px] text-koma-muted font-sans leading-none mt-0.5 font-medium">
                    {activeWaiter.nome}
                  </p>
                </div>
              </div>'''
          new_header = '''              <div className="flex items-center gap-2.5">
                <KomaLogo withText size="lg" />
                <div>
                  {!['koma', 'kôma'].includes(restaurantName.trim().toLowerCase()) && (
                    <h1 className="font-serif text-base sm:text-lg font-black tracking-[-0.03em] text-koma-foreground leading-tight">
                      {restaurantName}
                    </h1>
                  )}
                  <p className="text-[9px] text-koma-muted font-sans leading-none mt-0.5 font-medium">
                    {activeWaiter.nome}
                  </p>
                </div>
              </div>'''
          if old_header in text:
              text = text.replace(old_header, new_header, 1)

          old_drawer = '''                <div className={clsx('flex', 'items-center', 'gap-2.5')}>
                  <KomaLogo size="md" />
                  <div>
                    <span className={clsx('font-serif', 'font-bold', 'text-base', 'text-koma-foreground', 'leading-none', 'block')}>{restaurantName}</span>
                    <span className="text-[9px] text-emerald-700 dark:text-emerald-400 font-sans font-medium block mt-0.5">Se você está com fome, Kôma</span>
                  </div>
                </div>'''
          new_drawer = '''                <div className={clsx('flex', 'items-center', 'gap-2.5')}>
                  <KomaLogo withText withSlogan size="lg" />
                  {!['koma', 'kôma'].includes(restaurantName.trim().toLowerCase()) && (
                    <span className={clsx('font-serif', 'font-bold', 'text-base', 'text-koma-foreground', 'leading-none', 'block')}>
                      {restaurantName}
                    </span>
                  )}
                </div>'''
          if old_drawer in text:
              text = text.replace(old_drawer, new_drawer, 1)

          text = text.replace('Se está com fome, Kôma', 'Se você está com fome, Kôma')
          app.write_text(text, encoding='utf-8')
          PY

      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No remaining brand replacements."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/CaixaPanel.tsx
          git commit -m "fix(brand): replace remaining typed Kôma lockups"
          git push origin HEAD:${{ github.head_ref }}

  operational-smoke:
    name: Login -> caixa -> pedido -> impressão -> pagamento -> fechamento
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      SECRET_KEY: b14-operational-smoke-secret
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/koma_b14_smoke
      MIGRATION_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/koma_b14_smoke
      RUN_MIGRATIONS_ON_STARTUP: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt

      - name: Create isolated Supabase-compatible PostgreSQL database
        run: |
          python - <<'PY'
          import psycopg2

          conn = psycopg2.connect(
              host="127.0.0.1",
              port=5432,
              dbname="postgres",
              user="postgres",
              password="postgres",
          )
          conn.autocommit = True
          try:
              with conn.cursor() as cur:
                  for role in ("anon", "authenticated", "service_role"):
                      cur.execute("SELECT 1 FROM pg_roles WHERE rolname = %s", (role,))
                      if cur.fetchone() is None:
                          cur.execute(f'CREATE ROLE "{role}" NOLOGIN')
                  cur.execute('DROP DATABASE IF EXISTS "koma_b14_smoke" WITH (FORCE)')
                  cur.execute('CREATE DATABASE "koma_b14_smoke"')
          finally:
              conn.close()
          PY

      - name: Migrate clean database to current head
        working-directory: backend
        run: |
          python -m alembic -c alembic.ini upgrade head
          python -m alembic -c alembic.ini current

      - name: B1.4 operational smoke on PostgreSQL 17
        working-directory: backend
        run: |
          python -m pytest tests/test_b14_operational_smoke_postgres.py -q -ra
