name: Frontend recovery
on:
  pull_request:
    paths:
      - 'src/main.tsx'
      - 'src/analytics/**'
      - 'src/components/auth/AppRecoveryBoundary.tsx'
      - 'e2e/app-recovery.spec.ts'
      - '.github/workflows/frontend-recovery.yml'
permissions:
  contents: read
jobs:
  recovery:
    name: Frontend recovery browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e -- e2e/app-recovery.spec.ts --project=mobile-390 --project=desktop-1366 --workers=2
        env:
          KOMA_E2E_PORT: '4297'
          KOMA_E2E_PREVIEW: 'true'
